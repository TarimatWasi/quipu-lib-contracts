openapi: 3.0.3
info:
  title: Quipu — BFF API
  description: >
    Contract-first spec for the BFF (`/bff/**`) consumed by the Angular
    frontend. Source of truth for the contract — designed BEFORE
    implementation (see SRS chapter "10 - APIs e Integraciones", section
    "Estrategia de contrato: BFF vs. Core API"). Any new endpoint or
    response shape change is reflected here first; the Spring Boot
    implementation is validated against this spec with contract tests
    (MockMvc, SRS chapter "13 - Plan de Pruebas").
    Plain JSON, no HATEOAS `_links` (that is exclusive to the internal Core
    API). Language convention: identifiers (paths, fields, enums, error
    codes) are English per project convention; the SRS chapters that
    reference this spec stay in Spanish (formal documentation). User-facing
    error `message` values stay in Spanish — the end users (Tarimat Wasi
    family and guests) read Spanish, not English.
  version: "1.0"
  license:
    name: Proprietary - all rights reserved (Tarimat Wasi)
servers:
  - url: /bff

tags:
  - name: auth
    description: Login, link activation, session and password recovery (RF-08, RF-11, RF-12, RF-16)
  - name: admin-environments
    description: Rentable environment inventory (RF-01, RF-13)
  - name: admin-guests
    description: Guest minimal registration, detail, access generation and onboarding documents (RF-02, RF-11, RF-13, RF-17)
  - name: admin-contracts
    description: Contract upload, validity and termination (RF-03, RF-09)
  - name: admin-payments
    description: Payment review queue and direct payments (RF-05, RF-06)
  - name: admin-fines
    description: Fines charged to guests, counted as income (RF-19, RN-30)
  - name: admin-expenses
    description: Operating expenses (RF-07)
  - name: admin-dashboard
    description: Home summary and monthly income/expense balance (RF-18)
  - name: guest-onboarding
    description: Mandatory, resumable onboarding of a new guest of either type (RF-14, RF-20)
  - name: guest
    description: Self-service for a guest with an active contract (RF-04, RF-06, RF-10)
  - name: temporary-guest
    description: Self-service for a guest with a one-time stay (RF-04, RF-06)

paths:
  # ───────────────────────── AUTH (RF-08, RF-11, RF-12, RF-16, RF-17) ─────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in (RF-08, CU-15)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentType, documentNumber, password]
              properties:
                documentType: { $ref: "#/components/schemas/DocumentType" }
                documentNumber: { type: string }
                password: { type: string }
      responses:
        "200":
          description: "Session started — HttpOnly JWT cookie issued (SameSite=Lax; Secure)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: >
            `AUTH_INVALID_CREDENTIALS` (incorrect document or password) or
            `AUTH_TEMPORARY_PASSWORD_EXPIRED` (the temporary password was
            correct but its 30 minutes are over, RN-32: the guest asks the
            administrator for a new access). The expired code is only given
            when the password matched, so it never reveals whether a document
            exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "423": { $ref: "#/components/responses/AccountLocked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      security: [{ cookieAuth: [] }]
      responses:
        "204": { description: "Session closed, cookie invalidated" }
        "401": { $ref: "#/components/responses/NoSession" }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current session
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: >
            Active session data, read from the account in the database (not
            from the token), so the client can restore the session after a reload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/NoSession" }

  /auth/activate:
    post:
      operationId: activateAccess
      tags: [auth]
      summary: Activate access with the single-use link and choose the password (RF-11, RF-12, CU-24)
      description: >
        The administrator hands the guest a link (RN-32) whose token is
        single-use and expires 30 minutes after it was generated. The guest
        opens it and chooses their own password; the session starts right
        away. It also serves an already active guest whose password was lost:
        the administrator generates a new access (`POST
        /admin/guests/{id}/access`) and the guest sets a new password with it;
        the previous password stays valid until the link is used.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, description: "Single-use token from the activation link" }
                newPassword: { type: string, minLength: 8, description: "At most 72 bytes in UTF-8 (bcrypt limit)" }
      responses:
        "200":
          description: >
            Access activated — HttpOnly JWT cookie issued. Always a guest
            session with the password already set: the guest goes on to the
            onboarding (never back to the password step) or, if it was already
            active (administrator-assisted recovery), straight to the home
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ActivatedOnboardingSession"
                  - $ref: "#/components/schemas/ActivatedActiveSession"
        "400":
          description: >
            `AUTH_INVALID_OR_EXPIRED_CODE` (unknown, expired, revoked or
            already used token: one generic answer for all of them),
            `AUTH_WEAK_PASSWORD` (with `field: newPassword`; the token is not
            consumed) or `VALIDATION_ERROR` if a field is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password — mandatory on first login (RF-12)
      description: >
        `currentPassword` is optional only while the session still has the
        password change pending (first login with a temporary password) and
        required otherwise. On success the response sets a fresh `sessionToken`
        cookie without the pending mark. A new password equal to the current
        (or temporary) one is rejected.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string, description: "Optional when coming from the forced first-login flow" }
                newPassword: { type: string, minLength: 8, description: "At most 72 bytes in UTF-8 (bcrypt limit)" }
      responses:
        "204": { description: Password updated; Set-Cookie replaces the session }
        "400":
          description: >
            `AUTH_WEAK_PASSWORD` (shorter than 8 characters or longer than 72
            bytes) or `AUTH_PASSWORD_UNCHANGED` (same as the current one), both
            with `field: newPassword`; `VALIDATION_ERROR` if the field is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/NoSession" }

  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request password recovery (RF-16)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: >
            Always 202, whether the email exists or not (generic response
            by design — never reveals account existence, RF-16). When the
            account exists and is active, the email carries a link with a
            single-use code that expires in 30 minutes (SEG-05).
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password with a single-use code (RF-16)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, newPassword]
              properties:
                code: { type: string, description: "Single-use code from the link in the recovery email" }
                newPassword: { type: string, minLength: 8, description: "At most 72 bytes in UTF-8 (bcrypt limit)" }
      responses:
        "204": { description: Password reset; the code can no longer be used }
        "400":
          description: >
            `AUTH_INVALID_OR_EXPIRED_CODE` (unknown, expired or already used
            code, or a disabled account: one generic answer for all of them),
            `AUTH_WEAK_PASSWORD` (with `field: newPassword`; the code is not
            consumed) or `VALIDATION_ERROR` if a field is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── ADMIN: ENVIRONMENTS (RF-01, RF-13, CU-01, CU-10) ─────────────────────────
  /admin/environments:
    get:
      operationId: listEnvironments
      tags: [admin-environments]
      summary: List environments (RF-01)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
      responses:
        "200":
          description: Environment list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Environment" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createEnvironment
      tags: [admin-environments]
      summary: Create environment (RF-01, CU-01)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type]
              properties:
                code: { type: string, minLength: 1, maxLength: 50, pattern: '\S', description: "Unique, e.g. \"201\". Surrounding spaces are ignored; at least one character is not a space" }
                type: { type: string, enum: [ROOM, CABIN] }
      responses:
        "201":
          description: Environment created, always ACTIVE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/EnvironmentCodeTaken" }

  /admin/environments/{id}:
    get:
      operationId: getEnvironment
      tags: [admin-environments]
      summary: Environment detail
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Environment detail
          content: { application/json: { schema: { $ref: "#/components/schemas/Environment" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateEnvironment
      tags: [admin-environments]
      summary: Edit environment
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                code: { type: string, minLength: 1, maxLength: 50, pattern: '\S' }
                type: { type: string, enum: [ROOM, CABIN] }
      responses:
        "200":
          description: Environment updated (status is not changed here, see deactivate and reactivate)
          content: { application/json: { schema: { $ref: "#/components/schemas/Environment" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/EnvironmentCodeTaken" }

  /admin/environments/{id}/deactivate:
    post:
      operationId: deactivateEnvironment
      tags: [admin-environments]
      summary: Soft-deactivate environment (RF-13, RN-12, CU-10)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: "Environment deactivated, history preserved; deactivating an inactive one changes nothing" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/environments/{id}/reactivate:
    post:
      operationId: reactivateEnvironment
      tags: [admin-environments]
      summary: Reactivate a previously deactivated environment (RN-12)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: "Environment reactivated, visible in active listings again; reactivating an active one changes nothing" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── ADMIN: GUESTS (RF-02, RF-13, RF-14, RF-17, CU-02, CU-06, CU-10, CU-11, CU-13) ─────────────────────────
  /admin/guests:
    get:
      operationId: listGuests
      tags: [admin-guests]
      summary: List guests (RF-02)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [CONTRACT, TEMPORARY] }
        - name: status
          in: query
          description: "CURRENT is every guest except the inactive ones (pending activation, onboarding and active)"
          schema: { type: string, enum: [CURRENT, PENDING_ACTIVATION, ONBOARDING, ACTIVE, INACTIVE, ALL], default: CURRENT }
      responses:
        "200":
          description: Guest list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GuestSummary" } }
        "401": { $ref: "#/components/responses/NoSession" }
    post:
      operationId: createGuest
      tags: [admin-guests]
      summary: Register guest with the minimal data and generate their access (RF-02, RF-11, CU-02, CU-09)
      description: >
        The administrator registers only the document type and number and the
        guest type (RN-31); optionally a phone or an email to notify. The guest
        completes everything else in the onboarding (RF-20). The guest is
        created pending activation and the response carries the first access
        (link or temporary password, valid 30 minutes, RN-32). If an email was
        given, the link is also sent by email, best-effort. If the document is
        already registered nothing is created or modified: the existing guest
        comes back with `alreadyRegistered: true` and a 200 (RN-18).
        The response is never cacheable (`Cache-Control: no-store`) because it
        carries the access in clear.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestInput" }
      responses:
        "201":
          description: Guest created pending activation, with its first access
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestCreated" }
        "200":
          description: "The document was already registered: the existing guest, unmodified, with `alreadyRegistered: true` and no `access` (RN-18)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestAlreadyRegistered" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/GuestInactive" }

  /admin/guests/{id}:
    get:
      operationId: getGuestDetail
      tags: [admin-guests]
      summary: Guest 360 detail (CU-06) — personal data, contract, payment history
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Consolidated guest view
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestDetail" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateGuest
      tags: [admin-guests]
      summary: >
        Correct the document (only while pending activation) and manage the
        stay data (RN-17, RN-36). The personal and contact data belong to the
        guest alone and are edited through the guest's own endpoints.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/GuestUpdateInput" } } }
      responses:
        "200":
          description: Guest updated
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestSummary" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `GUEST_DOCUMENT_LOCKED` (the document can only be corrected while
            the guest is pending activation, RN-36) or `GUEST_DOCUMENT_TAKEN`
            (the corrected document already belongs to another guest, RN-18),
            both with the `field` that caused it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /admin/guests/{id}/deactivate:
    post:
      operationId: deactivateGuest
      tags: [admin-guests]
      summary: Soft-deactivate guest — loses login access (RF-13, RN-12, CU-10)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Guest deactivated }
        "401": { $ref: "#/components/responses/NoSession" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/guests/{id}/reactivate:
    post:
      operationId: reactivateGuest
      tags: [admin-guests]
      summary: Reactivate a previously deactivated guest — restores login access and the state it had when deactivated (RF-13, RN-12, CU-28)
      description: >
        Answers the guest as it stands after reactivating: if the access it
        had expired meanwhile the guest comes back pending activation and the
        administrator offers to generate a new access.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: "Guest reactivated, login access restored"
          content: { application/json: { schema: { $ref: "#/components/schemas/NonInactiveGuestSummary" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/guests/{id}/access:
    post:
      operationId: generateGuestAccess
      tags: [admin-guests]
      summary: Generate a new access (link or temporary password) for a guest — invalidates the previous one (RF-17, CU-13)
      description: >
        Covers an expired, lost or undelivered access, and a guest without
        email. Any guest that is not inactive qualifies, active ones
        included (an administrator-assisted password recovery). Generating
        a new access revokes the previous one, but the guest's current password
        stays valid until the new link or temporary password is used. The
        response carries the access in clear and is never cacheable
        (`Cache-Control: no-store`).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessMode]
              properties:
                accessMode: { $ref: "#/components/schemas/AccessMode" }
      responses:
        "200":
          description: New access generated; the previous one is revoked
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessGrant" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/GuestInactive" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/guests/{id}/documents:
    get:
      operationId: listGuestDocuments
      tags: [admin-guests]
      summary: Documents the guest uploaded in the onboarding, with a short-lived signed link (RN-37, CU-27)
      description: >
        Only the administrator sees these files. Each `url` is a signed R2
        link that expires 5 minutes after the response; ask again for a new one.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Documents of the guest (empty if none was uploaded)
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GuestDocument" } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/guests/{id}/payments:
    get:
      operationId: listGuestPaymentsByAdmin
      tags: [admin-guests]
      summary: A guest's payment history, admin view (RF-10)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Payment history for the given guest
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Payment" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── ADMIN: CONTRACTS (RF-03, RF-09, CU-03, CU-07, CU-12) ─────────────────────────
  /admin/contracts:
    get:
      operationId: listContracts
      tags: [admin-contracts]
      summary: List contracts with validity status (RF-09, CU-07)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, EXPIRED, TERMINATED] }
      responses:
        "200":
          description: Contract list
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Contract" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
    post:
      operationId: createContract
      tags: [admin-contracts]
      summary: Upload contract (RF-03, CU-03)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, environmentId, guestId, monthlyAmount, paymentDay, graceDays, startDate]
              properties:
                file: { type: string, format: binary, description: "PDF, ≤10MB (RF-15)" }
                environmentId: { type: string, format: uuid }
                guestId: { type: string, format: uuid }
                monthlyAmount: { type: number }
                paymentDay: { type: integer, minimum: 1, maximum: 31 }
                graceDays: { type: integer, minimum: 0 }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date, description: "optional; omitted means an open-ended contract (RN-07)" }
      responses:
        "201":
          description: Contract created
          content: { application/json: { schema: { $ref: "#/components/schemas/Contract" } } }
        "400": { description: "Invalid file, end date before start date, etc." }
        "401": { $ref: "#/components/responses/NoSession" }
        "409": { description: "Environment already has an active contract (RN-20)" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/contracts/{id}:
    get:
      operationId: getContract
      tags: [admin-contracts]
      summary: Contract detail
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Contract detail
          content: { application/json: { schema: { $ref: "#/components/schemas/Contract" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/contracts/{id}/terminate:
    post:
      operationId: terminateContract
      tags: [admin-contracts]
      summary: Manually terminate contract (RN-25, CU-12) — blocked if there is outstanding debt
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Contract terminated }
        "401": { $ref: "#/components/responses/NoSession" }
        "409": { description: "Unpaid periods pending (RN-25) — detail in the body" }

  # ───────────────────────── ADMIN: PAYMENTS (RF-05, RF-06, CU-04, CU-05, CU-14) ─────────────────────────
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin-dashboard]
      summary: Administrator home summary (HU-A04, CU-04)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                type: object
                required: [paymentsUpToDate, paymentsPending, paymentsOverdue, pendingVouchers]
                properties:
                  paymentsUpToDate: { type: integer }
                  paymentsPending: { type: integer }
                  paymentsOverdue: { type: integer }
                  pendingVouchers:
                    type: array
                    items: { $ref: "#/components/schemas/Payment" }
        "401": { $ref: "#/components/responses/NoSession" }

  /admin/finance:
    get:
      operationId: getFinanceSummary
      tags: [admin-dashboard]
      summary: Income vs. expenses balance for a month (RF-18, CU-08)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$", example: "2026-09" }
      responses:
        "200":
          description: Monthly balance
          content:
            application/json:
              schema:
                type: object
                required: [totalIncome, totalExpenses, net]
                properties:
                  totalIncome: { type: number }
                  totalExpenses: { type: number }
                  net: { type: number }
        "400": { description: "Invalid month parameter" }
        "401": { $ref: "#/components/responses/NoSession" }

  /admin/payments:
    get:
      operationId: listPayments
      tags: [admin-payments]
      summary: Payment review queue (RF-05, CU-05)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
      responses:
        "200":
          description: Payment list
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Payment" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
    post:
      operationId: createDirectPayment
      tags: [admin-payments]
      summary: >
        Register a direct payment (cash/manual) — admin uploads the
        voucher on the guest's behalf, auto-approved (RN-22, RN-23, CU-14).
        A voucher is always required, no exceptions (RN-22).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, guestId, period, amount]
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB (RF-15)" }
                guestId: { type: string, format: uuid }
                period: { type: string, pattern: "^\\d{4}-\\d{2}$" }
                amount: { type: number }
      responses:
        "201":
          description: "Payment registered, status APPROVED immediately (RN-23)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } }
        "400": { description: "Invalid file (RF-15)" }
        "401": { $ref: "#/components/responses/NoSession" }
        "409": { description: "An approved payment already exists for this period (RN-02)" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/payments/{id}:
    patch:
      operationId: resolvePayment
      tags: [admin-payments]
      summary: Approve or reject a payment (RF-05, CU-05)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
                reason: { type: string, description: "Required when status=REJECTED (RN-05)" }
      responses:
        "200":
          description: Payment resolved
          content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } }
        "400": { description: "Empty reason on rejection (RN-05)" }
        "401": { $ref: "#/components/responses/NoSession" }
        "409": { description: "Payment already resolved" }

  # ───────────────────────── ADMIN: EXPENSES (RF-07, CU-08) ─────────────────────────
  /admin/expenses:
    get:
      operationId: listExpenses
      tags: [admin-expenses]
      summary: List monthly expenses (RF-07, CU-08)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
      responses:
        "200":
          description: Expense list of the month, oldest first
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Expense" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: createExpense
      tags: [admin-expenses]
      summary: Register expense (RF-07)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "201":
          description: Expense created
          content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/expenses/{id}:
    patch:
      operationId: updateExpense
      tags: [admin-expenses]
      summary: Edit expense — replaces its category, amount, month and description; no audit restriction (RN-24)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseInput" } } }
      responses:
        "200":
          description: Expense updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: deleteExpense
      tags: [admin-expenses]
      summary: Delete expense — no audit restriction (RN-24)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Expense deleted for good (RN-24) }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── ADMIN: FINES (RF-19, RN-30) ─────────────────────────
  /admin/fines:
    get:
      operationId: listFines
      tags: [admin-fines]
      summary: List monthly fines (RF-19)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
      responses:
        "200":
          description: Fine list
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Fine" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
    post:
      operationId: createFine
      tags: [admin-fines]
      summary: Register fine as income against a guest (RF-19, RN-30)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FineInput" }
      responses:
        "201":
          description: Fine created
          content: { application/json: { schema: { $ref: "#/components/schemas/Fine" } } }
        "400": { description: "Invalid amount or month" }
        "401": { $ref: "#/components/responses/NoSession" }
        "404": { description: "Guest not found" }

  /admin/fines/{id}:
    delete:
      operationId: deleteFine
      tags: [admin-fines]
      summary: Delete fine — no audit restriction (RN-24)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Fine deleted }
        "401": { $ref: "#/components/responses/NoSession" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── CONTRACT GUEST (RF-04, RF-06, RF-10, CU-16..20) ─────────────────────────
  /guest/account-status:
    get:
      operationId: getGuestAccountStatus
      tags: [guest]
      summary: Payment status by period — up to date/pending/overdue (RF-06, CU-16)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      responses:
        "200":
          description: Status per period
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PeriodStatus" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }

  /guest/contract:
    get:
      operationId: getOwnContract
      tags: [guest]
      summary: >
        Own contract, regardless of status — shown read-only even when
        EXPIRED or TERMINATED (CU-18, RN-26). A guest never loses visibility
        of their own contract; only the ability to act on it changes with
        status (e.g. voucher upload requires ACTIVE, see /guest/payments).
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      responses:
        "200":
          description: Own contract, whatever its status
          content: { application/json: { schema: { $ref: "#/components/schemas/Contract" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "404": { description: "No contract was ever associated with this guest" }

  /guest/payments:
    get:
      operationId: listOwnPayments
      tags: [guest]
      summary: Own payment history (RF-10, CU-19) — own record only (RN-09)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      responses:
        "200":
          description: Own payment history
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Payment" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
    post:
      operationId: uploadPaymentVoucher
      tags: [guest]
      summary: Upload monthly payment voucher (RF-04, CU-17)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, period]
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB (RF-15)" }
                period: { type: string, pattern: "^\\d{4}-\\d{2}$" }
                paymentMethod: { type: string, description: "Optional free text, e.g. Yape/transfer/cash (RN-28)" }
      responses:
        "201":
          description: Voucher uploaded, payment set to PENDING
          content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } }
        "400": { description: "Invalid file (RF-15)" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >
            `VOUCHER_NO_ACTIVE_CONTRACT` (no active contract, RN-27),
            `AUTH_ONBOARDING_REQUIRED` (the onboarding is not complete, RN-33),
            `AUTH_PASSWORD_CHANGE_REQUIRED` (temporary password not changed,
            RF-12) or `AUTH_FORBIDDEN` (a guest of the other type, RN-09)
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [VOUCHER_NO_ACTIVE_CONTRACT, AUTH_ONBOARDING_REQUIRED, AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
                  message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        "409": { description: "A pending voucher already exists for this period (RN-15)" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /guest/profile:
    patch:
      operationId: updateOwnProfile
      tags: [guest]
      summary: Edit own personal and contact data (CU-20, RN-17)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateInput" }
      responses:
        "200":
          description: Profile updated
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestSummary" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }

  # ───────────────────────── GUEST ONBOARDING (RF-14, RF-20, CU-11, CU-24..26) ─────────────────────────
  # Open to a GUEST of either type. Until the onboarding is complete every other
  # /guest/** and /temporary-guest/** operation answers 403 AUTH_ONBOARDING_REQUIRED.
  /guest/onboarding:
    get:
      operationId: getOnboarding
      tags: [guest-onboarding]
      summary: Onboarding state — next step, saved data and the consent text in force (RF-20, CU-26)
      description: >
        Lets the guest resume where they left off. `nextStep` is the first
        pending step in the order PASSWORD, PERSONAL_DATA, DOCUMENTS, CONSENT
        (RN-33); the documents step is optional (RN-37) but is still offered
        once.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      responses:
        "200":
          description: Current onboarding state
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingState" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }

  /guest/onboarding/personal-data:
    put:
      operationId: savePersonalData
      tags: [guest-onboarding]
      summary: Save the personal data step (RF-20, CU-25)
      description: >
        Requires the password step to be done (RN-33). Only while the guest is
        in onboarding; afterwards the data is edited through the profile endpoint.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PersonalDataInput" } } }
      responses:
        "200":
          description: Step saved
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingDocumentsPending" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409": { $ref: "#/components/responses/OnboardingConflict" }

  /guest/onboarding/documents:
    post:
      operationId: uploadOnboardingDocument
      tags: [guest-onboarding]
      summary: Upload one optional document (RN-37, RF-15, CU-25)
      description: >
        One file per call; repeat for more. At most 5 files per guest, each
        JPG, PNG or PDF of up to 5 MB, checked by real content (SEC-07). The
        guest never gets the file back: only the administrator sees it. Files
        are neither deleted nor replaced.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB (RF-15)" }
      responses:
        "201":
          description: Document stored
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestDocumentRef" } } }
        "400":
          description: "`DOCUMENT_INVALID_FILE` (type or size not allowed, RF-15)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409":
          description: >
            `DOCUMENT_LIMIT_REACHED` (the guest already has 5 files),
            `ONBOARDING_STEP_OUT_OF_ORDER` or `ONBOARDING_ALREADY_COMPLETED`
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /guest/onboarding/documents/done:
    post:
      operationId: finishDocumentsStep
      tags: [guest-onboarding]
      summary: Mark the documents step as finished, with files or skipped (RN-37, CU-25)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      responses:
        "200":
          description: Step finished
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingConsentPending" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409": { $ref: "#/components/responses/OnboardingConflict" }

  /guest/onboarding/consent:
    post:
      operationId: acceptConsent
      tags: [guest-onboarding]
      summary: Accept the personal data consent — closes the onboarding (RF-14, RN-14, CU-11)
      description: >
        Records the acceptance with date, time and the text version. With the
        password and personal data steps already done, the guest becomes
        ACTIVE (RN-33, RN-36). Accepting before the personal data step answers
        409 `ONBOARDING_STEP_OUT_OF_ORDER`.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConsentInput" } } }
      responses:
        "200":
          description: "Consent recorded and the guest is now ACTIVE: the onboarding is complete"
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingCompleted" } } }
        "400":
          description: >
            `CONSENT_NOT_ACCEPTED` (`accepted` is not true) or
            `VALIDATION_ERROR` with `field: consentVersion` if it is not the
            version in force
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409": { $ref: "#/components/responses/OnboardingConflict" }

  # ───────────────────────── TEMPORARY GUEST (RF-04, RF-06, CU-21, CU-22) ─────────────────────────
  /temporary-guest/payment-status:
    get:
      operationId: getTemporaryGuestPaymentStatus
      tags: [temporary-guest]
      summary: Payment status for the stay period (CU-21)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType TEMPORARY
      responses:
        "200":
          description: Stay payment status
          content: { application/json: { schema: { $ref: "#/components/schemas/PeriodStatus" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }

  /temporary-guest/payments:
    post:
      operationId: uploadTemporaryVoucher
      tags: [temporary-guest]
      summary: >
        Upload one-time payment voucher (RF-04, CU-22) — a temporary guest
        record allows exactly one voucher ever, pending or approved
        (RN-03: single non-recurring payment). A second stay is a new
        guest record (RN-13), never a second voucher on this one.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType TEMPORARY
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB (RF-15)" }
      responses:
        "201":
          description: Voucher uploaded, payment set to PENDING
          content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } }
        "400": { description: "Invalid file (RF-15)" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "409": { description: "A voucher already exists for this stay, pending or approved (RN-03, RN-15)" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /temporary-guest/profile:
    patch:
      operationId: updateOwnProfileTemporary
      tags: [temporary-guest]
      summary: Edit own personal and contact data (CU-23, RN-17)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType TEMPORARY
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateInput" }
      responses:
        "200":
          description: Profile updated
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestSummary" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionToken
      description: JWT in an HttpOnly cookie, SameSite=Lax; Secure — same site, because Vercel rewrites /bff/* to the backend (RF-08). OpenAPI 3.0 only allows empty scope lists for this scheme, so the role that may call each operation is declared with the `x-roles` extension (ADMIN or GUEST); an operation without it accepts any authenticated session.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    ValidationFailed:
      description: Invalid input data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: The session is valid but its role cannot use the operation (RN-08, RN-09). The `code` is always `AUTH_FORBIDDEN`
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_FORBIDDEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    EnvironmentCodeTaken:
      description: Another environment already has that code (RF-01). The `code` is always `ENVIRONMENT_CODE_TAKEN` and `field` is always `code`
      content:
        application/json:
          schema:
            type: object
            required: [code, message, field]
            properties:
              code: { type: string, enum: [ENVIRONMENT_CODE_TAKEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
              field: { type: string, enum: [code] }
    NoSession:
      description: No active session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCredentials:
      description: Incorrect document or password
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PasswordChangeRequired:
      description: >
        The session must change its password first (RF-12). Any endpoint except
        login and change-password answers `AUTH_PASSWORD_CHANGE_REQUIRED` until it does.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountDisabled:
      description: Account disabled (RN-12)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountLocked:
      description: >
        Account temporarily locked after 5 consecutive failed logins (SEG-06): the lock lasts
        15 minutes, expires by itself and is lifted by a password reset (RF-16). The `code` is
        always `AUTH_ACCOUNT_LOCKED`
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_ACCOUNT_LOCKED] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    TooManyRequests:
      description: "Rate limit exceeded (SEC-01) — retry after the window in the `Retry-After` header"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    GuestInactive:
      description: >
        The guest is inactive (RN-12, RN-18). The `code` is always
        `GUEST_INACTIVE` and `guestId` lets the administrator reactivate it
        right from the notice (`POST /admin/guests/{id}/reactivate`, CU-28)
      content:
        application/json:
          schema:
            type: object
            required: [code, message, guestId]
            properties:
              code: { type: string, enum: [GUEST_INACTIVE] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
              guestId: { type: string, format: uuid }
    OnboardingAccessDenied:
      description: >
        A guest session that cannot use the onboarding operation. The `code` is
        `AUTH_PASSWORD_CHANGE_REQUIRED` while a temporary password has not been
        changed (RF-12) or `AUTH_FORBIDDEN` for the administrator. Never
        `AUTH_ONBOARDING_REQUIRED`: these are the routes an incomplete guest must reach
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    GuestAccessDenied:
      description: >
        The guest session cannot use the operation yet or at all. The `code` is
        `AUTH_ONBOARDING_REQUIRED` while the onboarding is incomplete (RN-33: the
        client redirects to the first pending step, `nextStep` of `GET
        /guest/onboarding`), `AUTH_PASSWORD_CHANGE_REQUIRED` while a temporary
        password has not been changed (RF-12) and `AUTH_FORBIDDEN` for a guest
        of the other type (a CONTRACT guest on `/temporary-guest/**` or the
        reverse, RN-09)
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_ONBOARDING_REQUIRED, AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    OnboardingConflict:
      description: >
        `ONBOARDING_STEP_OUT_OF_ORDER` (a step was attempted before its
        predecessor, RN-33) or `ONBOARDING_ALREADY_COMPLETED` (the guest is
        already active: use the profile endpoint)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      description: >
        BFF error shape — plain JSON, distinct from RFC 7807 (that is
        exclusive to the internal Core API, see SRS chapter "10 - APIs e
        Integraciones"). `code` is a stable English constant read by the
        frontend; `message` is the Spanish text shown to the end user.
      required: [code, message]
      properties:
        code: { type: string, description: "Stable error code, e.g. VOUCHER_ALREADY_EXISTS" }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        field: { type: string, description: "Field name if this is a validation error" }

    DocumentType:
      type: string
      enum: [DNI, CE, PASSPORT]
      description: "DNI (national ID, 8 digits), CE (Carné de Extranjería), PASSPORT (foreign visitors without CE)"

    Environment:
      type: object
      required: [id, code, type, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        type: { type: string, enum: [ROOM, CABIN] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }

    SessionInfo:
      description: >
        Session data answered by login, link activation and `GET /auth/me`,
        in one of four shapes: the administrator, a guest that must still set its
        password (temporary password), a guest in onboarding with the password already
        set (with the step to go to) or an active guest. `name` is the guest's name;
        while the guest has not completed the personal data step it is the
        document in text (for example "DNI 12345678") so the field is always there.
      oneOf:
        - $ref: "#/components/schemas/AdminSession"
        - $ref: "#/components/schemas/GuestPasswordPendingSession"
        - $ref: "#/components/schemas/GuestOnboardingSession"
        - $ref: "#/components/schemas/GuestActiveSession"

    AdminSession:
      type: object
      required: [role, name, mustChangePassword]
      properties:
        role: { type: string, enum: [ADMIN] }
        name: { type: string }
        mustChangePassword: { type: boolean, description: "true until the administrator changes a temporary password (RF-12)" }

    GuestPasswordPendingSession:
      type: object
      description: A guest that logged in with a temporary password and must choose its own first (RF-12, RN-33)
      required: [role, guestType, name, mustChangePassword, guestStatus, nextOnboardingStep]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [true] }
        guestStatus: { type: string, enum: [ONBOARDING] }
        nextOnboardingStep: { type: string, enum: [PASSWORD] }

    GuestOnboardingSession:
      type: object
      description: A guest whose password is set and whose onboarding still has steps left (RN-33)
      required: [role, guestType, name, mustChangePassword, guestStatus, nextOnboardingStep]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [false] }
        guestStatus: { type: string, enum: [ONBOARDING] }
        nextOnboardingStep: { type: string, enum: [PERSONAL_DATA, DOCUMENTS, CONSENT], description: "First pending step, in the order of RN-33" }

    GuestActiveSession:
      type: object
      description: A guest that completed the onboarding (RN-36)
      required: [role, guestType, name, mustChangePassword, guestStatus]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, description: "true while a temporary password has not been changed (RF-12)" }
        guestStatus: { type: string, enum: [ACTIVE] }

    ActivatedOnboardingSession:
      type: object
      description: A guest that has just set its password through the activation link and still has onboarding steps left
      required: [role, guestType, name, mustChangePassword, guestStatus, nextOnboardingStep]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [false] }
        guestStatus: { type: string, enum: [ONBOARDING] }
        nextOnboardingStep: { type: string, enum: [PERSONAL_DATA, DOCUMENTS, CONSENT] }

    ActivatedActiveSession:
      type: object
      description: An already active guest that recovered its access with a new link
      required: [role, guestType, name, mustChangePassword, guestStatus]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [false] }
        guestStatus: { type: string, enum: [ACTIVE] }

    GuestStatus:
      type: string
      enum: [PENDING_ACTIVATION, ONBOARDING, ACTIVE, INACTIVE]
      description: "Guest lifecycle (RN-36). Inactive is reversible (RN-12)"

    AccessMode:
      type: string
      enum: [LINK, TEMPORARY_PASSWORD]
      description: "How the administrator delivers the access: an activation link or a temporary password (RN-32)"

    AccessGrant:
      description: >
        An access generated by the administrator. Valid 30 minutes and single
        use (RN-32). The secret is given only here, in clear, and cannot be
        read again, so each mode requires its own secret: `activationUrl` for
        LINK, `temporaryPassword` for TEMPORARY_PASSWORD.
      oneOf:
        - $ref: "#/components/schemas/LinkAccessGrant"
        - $ref: "#/components/schemas/PasswordAccessGrant"
      discriminator:
        propertyName: mode
        mapping:
          LINK: "#/components/schemas/LinkAccessGrant"
          TEMPORARY_PASSWORD: "#/components/schemas/PasswordAccessGrant"

    LinkAccessGrant:
      type: object
      required: [mode, activationUrl, expiresAt, emailSent, shareMessage]
      properties:
        mode: { type: string, enum: [LINK] }
        activationUrl: { type: string, description: "Single-use activation link (RN-32)" }
        expiresAt: { type: string, format: date-time }
        emailSent: { type: boolean, description: "true if the access was sent to the guest's email (best-effort, RN-19)" }
        shareMessage: { type: string, description: "Spanish text ready to copy or to send by WhatsApp, with the link and the 30-minute notice" }

    PasswordAccessGrant:
      type: object
      required: [mode, temporaryPassword, expiresAt, emailSent, shareMessage]
      properties:
        mode: { type: string, enum: [TEMPORARY_PASSWORD] }
        temporaryPassword: { type: string, description: "Temporary password, valid 30 minutes (RN-32)" }
        expiresAt: { type: string, format: date-time }
        emailSent: { type: boolean, description: "true if the access was sent to the guest's email (best-effort, RN-19)" }
        shareMessage: { type: string, description: "Spanish text ready to copy or to send by WhatsApp, with the password and the 30-minute notice" }

    GuestInput:
      type: object
      description: Minimal registration by the administrator (RN-31)
      required: [documentType, documentNumber, type, accessMode]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string, minLength: 1, maxLength: 20 }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        phone: { type: string, maxLength: 30, description: "Optional, to notify the guest" }
        contactEmail: { type: string, format: email, maxLength: 200, description: "Optional: if present the link is also sent by email (RN-19)" }
        accessMode: { $ref: "#/components/schemas/AccessMode" }

    GuestCreated:
      type: object
      description: Answer of a registration that created the guest; it always carries the first access
      required: [guest, alreadyRegistered, access]
      properties:
        guest: { $ref: "#/components/schemas/PendingGuestSummary" }
        alreadyRegistered: { type: boolean, enum: [false] }
        access: { $ref: "#/components/schemas/AccessGrant" }

    NonInactiveGuestSummary:
      type: object
      description: "A guest that is not inactive: what the duplicate-document answer (RN-18) and a successful reactivation (RN-12) return"
      required: [id, documentType, documentNumber, name, type, status, hasLoginAccess]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        status: { type: string, enum: [PENDING_ACTIVATION, ONBOARDING, ACTIVE] }
        hasLoginAccess: { type: boolean }

    PendingGuestSummary:
      type: object
      description: "A guest just created by the administrator: always pending activation (RN-36) and still without a name (RN-31)"
      required: [id, documentType, documentNumber, name, type, status, hasLoginAccess]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, enum: [null], description: "Always null: the guest completes the personal data in the onboarding (RN-31)" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        status: { type: string, enum: [PENDING_ACTIVATION] }
        hasLoginAccess: { type: boolean }

    GuestAlreadyRegistered:
      type: object
      description: Answer when the document was already registered; the guest comes back unmodified and no access is generated (RN-18)
      required: [guest, alreadyRegistered]
      properties:
        guest: { $ref: "#/components/schemas/NonInactiveGuestSummary" }
        alreadyRegistered: { type: boolean, enum: [true] }

    EmergencyContact:
      type: object
      description: Optional, never blocks guest registration (RN-29)
      properties:
        name: { type: string }
        relationship: { type: string }
        phone: { type: string }

    GuestUpdateInput:
      type: object
      description: >
        What the administrator may change: the document, only while the guest
        is pending activation (RN-36), and the stay data of a temporary guest.
        Personal and contact data are the guest's alone (RN-17).
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string, minLength: 1, maxLength: 20 }
        stayStartDate: { type: string, format: date, description: "Only when guest type=TEMPORARY" }
        stayEndDate: { type: string, format: date, description: "Only when guest type=TEMPORARY" }
        agreedAmount: { type: number, description: "Only when guest type=TEMPORARY" }

    PersonalDataInput:
      type: object
      description: Personal data step of the onboarding (RN-33)
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        contactEmail: { type: string, format: email, maxLength: 200, description: "Optional; without it the password can only be recovered through the administrator (RF-16, RF-17)" }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }

    ProfileUpdateInput:
      type: object
      description: The guest edits their own data; every field is optional (RN-17)
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        contactEmail: { type: string, format: email, maxLength: 200 }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }

    ConsentInput:
      type: object
      required: [accepted, consentVersion]
      properties:
        accepted: { type: boolean, enum: [true], description: "Must be true (RN-14); anything else is answered 400 CONSENT_NOT_ACCEPTED" }
        consentVersion: { type: string, description: "Version of the text being accepted; must be the one in `OnboardingState.consent.version`" }

    GuestSummary:
      type: object
      required: [id, documentType, documentNumber, name, type, status, hasLoginAccess]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        status: { $ref: "#/components/schemas/GuestStatus" }
        hasLoginAccess: { type: boolean }

    OnboardingProgress:
      type: string
      enum: [NOT_STARTED, PASSWORD_SET, PERSONAL_DATA_SAVED, DOCUMENTS_DONE, COMPLETED]
      description: >
        Ordered onboarding progress of a guest (RN-33): the password is chosen,
        then the personal data saved, then the documents step finished or
        skipped, then the consent accepted (COMPLETED, which is what an ACTIVE
        guest always has). One value, so impossible combinations cannot be expressed.

    GuestDetail:
      allOf:
        - $ref: "#/components/schemas/GuestSummary"
        - type: object
          required: [onboardingProgress, documentCount, paymentHistory]
          properties:
            phone: { type: string, nullable: true }
            contactEmail: { type: string, nullable: true }
            emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }
            stayStartDate: { type: string, format: date, description: "Only when type=TEMPORARY" }
            stayEndDate: { type: string, format: date, description: "Only when type=TEMPORARY" }
            agreedAmount: { type: number, description: "Only when type=TEMPORARY" }
            onboardingProgress: { $ref: "#/components/schemas/OnboardingProgress" }
            documentCount: { type: integer, minimum: 0, maximum: 5 }
            accessExpiresAt: { type: string, format: date-time, nullable: true, description: "Expiry of the current unused access, if there is one" }
            contract: { $ref: "#/components/schemas/Contract" }
            paymentHistory:
              type: array
              items: { $ref: "#/components/schemas/Payment" }

    GuestDocumentRef:
      type: object
      description: "A document as the guest sees it, without a link: only the administrator can open the file (RN-37)"
      required: [id, originalName, contentType, sizeBytes, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        uploadedAt: { type: string, format: date-time }

    GuestDocument:
      allOf:
        - $ref: "#/components/schemas/GuestDocumentRef"
        - type: object
          required: [url, urlExpiresAt]
          properties:
            url: { type: string, description: "R2 signed URL, expires 5 minutes after the response (RN-37)" }
            urlExpiresAt: { type: string, format: date-time }

    OnboardingState:
      description: >
        Onboarding state. While the guest is in onboarding `nextStep` names the
        step to go to; once active there is no `nextStep` (RN-33, RN-36).
      oneOf:
        - $ref: "#/components/schemas/OnboardingInProgress"
        - $ref: "#/components/schemas/OnboardingCompleted"

    OnboardingInProgress:
      description: >
        Onboarding still open. Before the personal data step is saved the data
        is not there yet; from the documents step on it is always returned.
      oneOf:
        - $ref: "#/components/schemas/OnboardingPersonalDataPending"
        - $ref: "#/components/schemas/OnboardingDocumentsPending"
        - $ref: "#/components/schemas/OnboardingConsentPending"

    OnboardingPersonalDataPending:
      type: object
      required: [status, nextStep, documents, consent]
      properties:
        status: { type: string, enum: [ONBOARDING] }
        nextStep: { type: string, enum: [PASSWORD, PERSONAL_DATA], description: "First pending step, in the order of RN-33" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/ConsentState" }

    OnboardingDocumentsPending:
      type: object
      description: "Personal data saved; the optional documents step is next (the answer of saving the personal data)"
      required: [status, nextStep, personalData, documents, consent]
      properties:
        status: { type: string, enum: [ONBOARDING] }
        nextStep: { type: string, enum: [DOCUMENTS] }
        personalData: { $ref: "#/components/schemas/PersonalDataInput" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/ConsentState" }

    OnboardingConsentPending:
      type: object
      description: "Documents step finished or skipped; only the consent is left (the answer of finishing the documents step)"
      required: [status, nextStep, personalData, documents, consent]
      properties:
        status: { type: string, enum: [ONBOARDING] }
        nextStep: { type: string, enum: [CONSENT] }
        personalData: { $ref: "#/components/schemas/PersonalDataInput" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/ConsentState" }

    OnboardingCompleted:
      type: object
      required: [status, personalData, documents, consent]
      properties:
        status: { type: string, enum: [ACTIVE] }
        personalData: { $ref: "#/components/schemas/PersonalDataInput" }
        documents:
          type: array
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/ConsentState" }

    ConsentState:
      type: object
      required: [version, text, accepted]
      properties:
        version: { type: string }
        text: { type: string, description: "Consent text in force, in Spanish" }
        accepted: { type: boolean }

    Contract:
      type: object
      required: [id, environmentId, guestId, monthlyAmount, paymentDay, graceDays, startDate, status, fileUrl]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        monthlyAmount: { type: number }
        paymentDay: { type: integer }
        graceDays: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: "null means an open-ended contract (RN-07)" }
        status: { type: string, enum: [ACTIVE, EXPIRED, TERMINATED] }
        fileUrl: { type: string, description: "R2 signed URL, expires in 15 min" }

    Payment:
      type: object
      required: [id, guestId, period, amount, status, voucherUrl, createdAt]
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        period: { type: string, example: "2026-09" }
        amount: { type: number }
        paymentMethod: { type: string, nullable: true, description: "Free text per payment (RN-28)" }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejectionReason: { type: string, nullable: true }
        voucherUrl: { type: string, description: "R2 signed URL — every payment has a voucher, no exceptions (RN-22, includes admin-direct payments per RN-23)" }
        createdAt: { type: string, format: date-time }

    PeriodStatus:
      type: object
      required: [period, status]
      properties:
        period: { type: string, example: "2026-09" }
        status: { type: string, enum: [PAID, UNDER_REVIEW, UNPAID, OVERDUE] }

    ExpenseInput:
      type: object
      required: [category, amount, month]
      properties:
        category: { type: string, enum: [WATER, ELECTRICITY, INTERNET, OTHER] }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09", description: "Month the expense belongs to" }
        description: { type: string, maxLength: 500, description: "Optional; blank means none" }

    FineInput:
      type: object
      required: [guestId, amount, month]
      properties:
        guestId: { type: string, format: uuid }
        amount: { type: number }
        month: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        description: { type: string }

    Fine:
      allOf:
        - $ref: "#/components/schemas/FineInput"
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid }

    Expense:
      type: object
      description: An expense as the BFF answers it; the fields of `ExpenseInput`, with the same constraints, plus its `id`. The description is left out when there is none.
      required: [id, category, amount, month]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [WATER, ELECTRICITY, INTERNET, OTHER] }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        description: { type: string, maxLength: 500 }
