      tags: [temporary-guest]
      summary: Correct the rejected payment of a stay and send it again (T2 «Enviar de nuevo», RN-05)
      description: Same rules as `correctOwnPayment`.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType TEMPORARY
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ProofsCorrection" }
            encoding:
              proofs: { contentType: application/json }
      responses:
        "200":
          description: Payment sent again, status PENDING
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSummary" } } }
        "400":
          description: "`VOUCHER_INVALID_FILE` (with the `field` of the file, RF-15) or `VALIDATION_ERROR` (`proofs` or `proofs[i].…`)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "404": { description: "No payment with that id belongs to this guest (`RESOURCE_NOT_FOUND`, RN-09)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: "`PAYMENT_NOT_CORRECTABLE` (the payment is pending or approved, not rejected) or `GUEST_NOT_ACTIVE` (RN-35)"
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PaymentNotCorrectableError"
                  - $ref: "#/components/schemas/GuestNotActiveError"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /temporary-guest/profile:
    get:
      operationId: getOwnProfileTemporary
