openapi: 3.0.3
info:
  title: Quipu — BFF API
  description: >
    Contract-first spec for the BFF (`/bff/**`) consumed by the Angular
    frontend. Source of truth for the contract — designed BEFORE
    implementation (see SRS chapter "10 - APIs e Integraciones", section
    "Estrategia de contrato: BFF vs. Core API"). Any new endpoint or
    response shape change is reflected here first; the Spring Boot
    implementation is validated against this spec with contract tests
    (MockMvc, SRS chapter "13 - Plan de Pruebas").
    Plain JSON, no HATEOAS `_links` (that is exclusive to the internal Core
    API). Language convention: identifiers (paths, fields, enums, error
    codes) are English per project convention; the SRS chapters that
    reference this spec stay in Spanish (formal documentation). User-facing
    error `message` values stay in Spanish — the end users (Tarimat Wasi
    family and guests) read Spanish, not English.
  version: "1.0"
  license:
    name: Proprietary - all rights reserved (Tarimat Wasi)
servers:
  - url: /bff

tags:
  - name: auth
    description: Login, link activation, session and password recovery (RF-08, RF-11, RF-12, RF-16)
  - name: admin-environments
    description: Rentable environment inventory (RF-01, RF-13)
  - name: admin-administrators
    description: Additional administrators created by an administrator (RF-22, CU-30, D-34c)
  - name: admin-guests
    description: Guest minimal registration, detail, access generation and onboarding documents (RF-02, RF-11, RF-13, RF-17)
  - name: admin-contracts
    description: Contract upload, validity and termination (RF-03, RF-09)
  - name: admin-payments
    description: Payment review queue and direct payments (RF-05, RF-06)
  - name: admin-fines
    description: Fines charged to guests, counted as income (RF-19, RN-30)
  - name: admin-expenses
    description: Operating expenses (RF-07)
  - name: admin-dashboard
    description: Home summary and monthly income/expense balance (RF-18)
  - name: guest-onboarding
    description: Mandatory, resumable onboarding of a new guest of either type (RF-14, RF-20)
  - name: guest
    description: Self-service for a guest with an active contract (RF-04, RF-06, RF-10)
  - name: temporary-guest
    description: Self-service for a guest with a one-time stay (RF-04, RF-06)

paths:
  # ───────────────────────── AUTH (RF-08, RF-11, RF-12, RF-16, RF-17) ─────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in (RF-08, CU-15)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentType, documentNumber, password]
              properties:
                documentType: { $ref: "#/components/schemas/DocumentType" }
                documentNumber: { type: string, maxLength: 20 }
                password: { type: string, maxLength: 128 }
      responses:
        "200":
          description: "Session started — HttpOnly JWT cookie issued (SameSite=Lax; Secure)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: >
            `AUTH_INVALID_CREDENTIALS` (incorrect document or password) or
            `AUTH_TEMPORARY_PASSWORD_EXPIRED` (the temporary password was
            correct but its 30 minutes are over, RN-32: the guest asks the
            administrator for a new access). The expired code is only given
            when the password matched, so it never reveals whether a document
            exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "423": { $ref: "#/components/responses/AccountLocked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      security: [{ cookieAuth: [] }]
      responses:
        "204": { description: "Session closed, cookie invalidated" }
        "401": { $ref: "#/components/responses/NoSession" }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current session
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: >
            Active session data, read from the account in the database (not
            from the token), so the client can restore the session after a reload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/NoSession" }

  /auth/activate:
    post:
      operationId: activateAccess
      tags: [auth]
      summary: Activate access with the single-use link and choose the password (RF-11, RF-12, CU-24)
      description: >
        The administrator hands the guest a link (RN-32) whose token is
        single-use and expires 30 minutes after it was generated. The guest
        opens it and chooses their own password; the session starts right
        away. It also serves an already active guest whose password was lost:
        the administrator generates a new access (`POST
        /admin/guests/{id}/access`) and the guest sets a new password with it;
        the previous password stays valid until the link is used.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, description: "Single-use token from the activation link" }
                newPassword: { type: string, minLength: 8, description: "At most 72 bytes in UTF-8 (bcrypt limit)" }
      responses:
        "200":
          description: >
            Access activated — HttpOnly JWT cookie issued. Always a guest
            session with the password already set: the guest goes on to the
            onboarding (never back to the password step) or, if it was already
            active (administrator-assisted recovery), straight to the home
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ActivatedOnboardingSession"
                  - $ref: "#/components/schemas/ActivatedActiveSession"
        "400":
          description: >
            `AUTH_INVALID_OR_EXPIRED_CODE` (unknown, expired, revoked or
            already used token: one generic answer for all of them),
            `AUTH_WEAK_PASSWORD` (with `field: newPassword`; the token is not
            consumed) or `VALIDATION_ERROR` if a field is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password — mandatory on first login (RF-12)
      description: >
        `currentPassword` is optional only while the session still has the
        password change pending (first login with a temporary password) and
        required otherwise. On success the response sets a fresh `sessionToken`
        cookie without the pending mark. A new password equal to the current
        (or temporary) one is rejected.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string, maxLength: 128, description: "Optional when coming from the forced first-login flow" }
                newPassword: { type: string, minLength: 8, maxLength: 128, description: "At most 72 bytes in UTF-8 (bcrypt limit)" }
      responses:
        "204": { description: Password updated; Set-Cookie replaces the session }
        "400":
          description: >
            `AUTH_WEAK_PASSWORD` (shorter than 8 characters or longer than 72
            bytes) or `AUTH_PASSWORD_UNCHANGED` (same as the current one), both
            with `field: newPassword`; `VALIDATION_ERROR` if the field is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/NoSession" }

  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request password recovery (RF-16)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: >
            Always 202, whether the email exists or not (generic response
            by design — never reveals account existence, RF-16). When the
            account exists and is active, the email carries a link with a
            single-use code that expires in 30 minutes (SEG-05).
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password with a single-use code (RF-16)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, newPassword]
              properties:
                code: { type: string, maxLength: 100, description: "Single-use code from the link in the recovery email" }
                newPassword: { type: string, minLength: 8, maxLength: 128, description: "At most 72 bytes in UTF-8 (bcrypt limit)" }
      responses:
        "204": { description: Password reset; the code can no longer be used }
        "400":
          description: >
            `AUTH_INVALID_OR_EXPIRED_CODE` (unknown, expired or already used
            code, or a disabled account: one generic answer for all of them),
            `AUTH_WEAK_PASSWORD` (with `field: newPassword`; the code is not
            consumed) or `VALIDATION_ERROR` if a field is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── ADMIN: ENVIRONMENTS (RF-01, RF-13, CU-01, CU-10) ─────────────────────────
  /admin/environments:
    get:
      operationId: listEnvironments
      tags: [admin-environments]
      summary: List environments (RF-01)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: One page of the environment list, ordered by code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedEnvironments" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createEnvironment
      tags: [admin-environments]
      summary: Create environment (RF-01, CU-01)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type]
              properties:
                code: { type: string, minLength: 1, maxLength: 50, pattern: '\S', description: "Unique, e.g. \"201\". Surrounding spaces are ignored; at least one character is not a space" }
                type: { type: string, enum: [ROOM, CABIN] }
      responses:
        "201":
          description: Environment created, always ACTIVE
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409": { $ref: "#/components/responses/EnvironmentCodeTaken" }

  /admin/environments/{id}:
    get:
      operationId: getEnvironment
      tags: [admin-environments]
      summary: Environment detail
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Environment detail
          content: { application/json: { schema: { $ref: "#/components/schemas/Environment" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateEnvironment
      tags: [admin-environments]
      summary: Edit environment
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                code: { type: string, minLength: 1, maxLength: 50, pattern: '\S' }
                type: { type: string, enum: [ROOM, CABIN] }
      responses:
        "200":
          description: Environment updated (status is not changed here, see deactivate and reactivate)
          content: { application/json: { schema: { $ref: "#/components/schemas/Environment" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `ENVIRONMENT_CODE_TAKEN` (another environment already has that
            code, with `field: code`, RF-01) or `CONCURRENT_MODIFICATION` (the
            record changed while it was being edited, see the
            `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [code, message, field]
                    properties:
                      code: { type: string, enum: [ENVIRONMENT_CODE_TAKEN] }
                      message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
                      field: { type: string, enum: [code] }
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/environments/{id}/deactivate:
    post:
      operationId: deactivateEnvironment
      tags: [admin-environments]
      summary: Soft-deactivate environment (RF-13, RN-12, CU-10)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: "Environment deactivated, history preserved; deactivating an inactive one changes nothing" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `ENVIRONMENT_OCCUPIED` (the environment has a contract in force, RN-12, RN-20) or
            `CONCURRENT_MODIFICATION` (see the `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/EnvironmentOccupiedError"
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/environments/{id}/reactivate:
    post:
      operationId: reactivateEnvironment
      tags: [admin-environments]
      summary: Reactivate a previously deactivated environment (RN-12)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: "Environment reactivated, visible in active listings again; reactivating an active one changes nothing" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConcurrentModification" }

  /admin/environments/{id}/account-status:
    get:
      operationId: getEnvironmentAccountStatus
      tags: [admin-environments]
      summary: Payment status by period of the environment's current contract, admin view (RF-06, D-66)
      description: >-
        Every period of the environment's current contract (status `ACTIVE`, RN-07), classified as in
        `getGuestAccountStatus` (paid, pending review, unpaid or overdue by payment day plus grace days,
        RN-10), in the same order. An environment without a current contract (none, expired or terminated)
        answers an empty list. Works for active and inactive environments.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Status per period of the environment's current contract
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PeriodStatus" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/administrators:
    get:
      operationId: listAdministrators
      tags: [admin-administrators]
      summary: List the administrators, active and inactive (RF-22, TAR-127)
      description: >-
        Every ADMIN account, active and inactive, ordered by `createdAt` (oldest first). Not paginated:
        there are never more than the configurable maximum of administrators (5). The document number
        comes masked and `self` marks the account of the session. Never cacheable
        (`Cache-Control: no-store`).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      responses:
        "200":
          description: The administrators
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdministratorSummary" } }
              example:
                - id: 3f2b8c1e-7a4d-4e6b-9c0a-1d2e3f4a5b6c
                  documentType: DNI
                  documentNumber: "*****678"
                  email: admin.uno@example.com
                  status: ACTIVE
                  createdAt: "2026-01-15T14:00:00Z"
                  self: true
                - id: 8a7b6c5d-4e3f-4a1b-8c2d-3e4f5a6b7c8d
                  documentType: CE
                  documentNumber: "******321"
                  email: admin.dos@example.com
                  status: INACTIVE
                  createdAt: "2026-03-02T16:30:00Z"
                  self: false
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >-
            Not an administrator (`AUTH_FORBIDDEN`) or the session still has the password change
            pending (`AUTH_PASSWORD_CHANGE_REQUIRED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createAdministrator
      tags: [admin-administrators]
      summary: An administrator creates another administrator (RF-22, CU-30)
      description: >-
        Creates an active ADMIN account with an unusable random password and emails the new
        administrator a single-use link that expires in 30 minutes to set their own password
        (the same flow as the first administrator, RF-16, SEG-05). No password, code or link is ever
        returned. The creator re-authenticates with `currentPassword`. Administrators are equals,
        without hierarchy (SRS 03). At most 5 administrators may exist (configurable). Every other
        active administrator is notified by email. If the email cannot be sent the account still
        exists, `emailSent` is false and the new administrator can use "forgot password" later.
        Administrators are listed with `listAdministrators` and deactivated or reactivated with
        `deactivateAdministrator` and `reactivateAdministrator` (TAR-127).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdministratorInput" }
      responses:
        "201":
          description: Administrator created
          content: { application/json: { schema: { $ref: "#/components/schemas/AdministratorCreated" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >-
            Not an administrator (`AUTH_FORBIDDEN`), the session still has the password change
            pending (`AUTH_PASSWORD_CHANGE_REQUIRED`), or `currentPassword` is wrong (`AUTH_INVALID_CREDENTIALS` with
            `field: currentPassword`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            `ACCOUNT_DOCUMENT_TAKEN` (the document already belongs to an account, administrator or
            guest, `field: documentNumber`), `ACCOUNT_EMAIL_TAKEN` (the email, case-insensitive, already
            belongs to an account, `field: email`; a guest contact email is not an account email, D-33)
            or `ADMIN_LIMIT_REACHED` (the maximum number of administrators already exists)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/administrators/{id}/deactivate:
    post:
      operationId: deactivateAdministrator
      tags: [admin-administrators]
      summary: Deactivate an administrator (RF-22, TAR-127)
      description: >-
        Deactivates another ADMIN account, effective immediately: its session stops being valid from
        its next request on and it cannot log in until it is reactivated. Its history is kept. The
        caller re-authenticates with `currentPassword`, checked before anything else. An administrator
        cannot deactivate their own account (`ADMIN_SELF_DEACTIVATION`) and the last active
        administrator cannot be deactivated (`LAST_ACTIVE_ADMIN`): the system always keeps at least
        one active ADMIN. Deactivating an inactive administrator is idempotent: 204 and nothing
        changes. When the account changes, every other active administrator is notified by email
        (best-effort). Its own rate limit: 3 requests per minute per session user.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdministratorReauthentication" }
      responses:
        "204": { description: "Administrator deactivated; deactivating an inactive one changes nothing" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >-
            Not an administrator (`AUTH_FORBIDDEN`), the session still has the password change
            pending (`AUTH_PASSWORD_CHANGE_REQUIRED`), or `currentPassword` is wrong (`AUTH_INVALID_CREDENTIALS` with
            `field: currentPassword`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/AdministratorNotFound" }
        "409":
          description: >-
            `ADMIN_SELF_DEACTIVATION` (the target is the account of the session) or `LAST_ACTIVE_ADMIN`
            (deactivating it would leave no active administrator)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdministratorDeactivationConflictError" }
              example:
                code: LAST_ACTIVE_ADMIN
                message: No puedes desactivar al último administrador activo
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/administrators/{id}/reactivate:
    post:
      operationId: reactivateAdministrator
      tags: [admin-administrators]
      summary: Reactivate a previously deactivated administrator (RF-22, TAR-127)
      description: >-
        Reactivates an inactive ADMIN account, effective immediately: it can log in again. The caller
        re-authenticates with `currentPassword`, checked before anything else. Reactivating an
        active administrator is idempotent: 204 and nothing changes. When the account changes,
        every other active administrator is notified by email (best-effort). Its own rate limit:
        3 requests per minute per session user.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdministratorReauthentication" }
      responses:
        "204": { description: "Administrator reactivated; reactivating an active one changes nothing" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >-
            Not an administrator (`AUTH_FORBIDDEN`), the session still has the password change
            pending (`AUTH_PASSWORD_CHANGE_REQUIRED`), or `currentPassword` is wrong (`AUTH_INVALID_CREDENTIALS` with
            `field: currentPassword`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/AdministratorNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── ADMIN: GUESTS (RF-02, RF-13, RF-14, RF-17, CU-02, CU-06, CU-10, CU-11, CU-13) ─────────────────────────
  /admin/guests:
    get:
      operationId: listGuests
      tags: [admin-guests]
      summary: List guests (RF-02)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [CONTRACT, TEMPORARY] }
        - name: status
          in: query
          description: "CURRENT is every guest except the inactive ones (pending activation, onboarding and active)"
          schema: { type: string, enum: [CURRENT, PENDING_ACTIVATION, ONBOARDING, ACTIVE, INACTIVE, ALL], default: CURRENT }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: One page of the guest list, ordered by document type and number
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedGuests" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createGuest
      tags: [admin-guests]
      summary: Register guest with the minimal data and generate their access (RF-02, RF-11, CU-02, CU-09)
      description: >
        The administrator registers only the document type and number and the
        guest type (RN-31); optionally a phone or an email to notify. The guest
        completes everything else in the onboarding (RF-20). The guest is
        created pending activation and the response carries the first access
        (link or temporary password, valid 30 minutes, RN-32). If an email was
        given, the access is also sent to it by email, best-effort: the activation
        link in LINK mode, the temporary password itself in TEMPORARY_PASSWORD mode. If the document is
        already registered nothing is created or modified: the existing guest
        comes back with `alreadyRegistered: true` and a 200 (RN-18).
        The response is never cacheable (`Cache-Control: no-store`) because it
        carries the access in clear.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestInput" }
      responses:
        "201":
          description: Guest created pending activation, with its first access
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestCreated" }
        "200":
          description: "The document was already registered: the existing guest, unmodified, with `alreadyRegistered: true` and no `access` (RN-18)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestAlreadyRegistered" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409":
          description: >
            `GUEST_INACTIVE` (the document belongs to an inactive guest, RN-12, RN-18),
            `GUEST_DOCUMENT_TAKEN` (the document belongs to an administrator account, D-34e) or
            `GUEST_EMAIL_TAKEN` (the contact email already belongs to another guest, D-33)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestInactiveError"
                  - $ref: "#/components/schemas/GuestDocumentTakenError"
                  - $ref: "#/components/schemas/GuestEmailTakenError"

  /admin/guests/{id}:
    get:
      operationId: getGuestDetail
      tags: [admin-guests]
      summary: Guest 360 detail (CU-06) — personal data, contract, payment history
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Consolidated guest view
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestDetail" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateGuest
      tags: [admin-guests]
      summary: >
        Correct the document (only while pending activation, RN-36). The
        stays are managed through `/admin/guests/{id}/stays` (RN-17). The personal and contact data belong to the
        guest alone and are edited through the guest's own endpoints.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/GuestUpdateInput" } } }
      responses:
        "200":
          description: Guest updated
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestSummary" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `GUEST_DOCUMENT_LOCKED` (the document can only be corrected while
            the guest is pending activation, RN-36) or `GUEST_DOCUMENT_TAKEN`
            (the corrected document already belongs to another guest or to an administrator account, RN-18, D-34e),
            both with the `field` that caused it; or `CONCURRENT_MODIFICATION`
            (the record changed while it was being edited, see the
            `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [code, message, field]
                    properties:
                      code: { type: string, enum: [GUEST_DOCUMENT_LOCKED] }
                      message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
                      field: { type: string }
                  - type: object
                    required: [code, message, field]
                    properties:
                      code: { type: string, enum: [GUEST_DOCUMENT_TAKEN] }
                      message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
                      field: { type: string }
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/guests/{id}/deactivate:
    post:
      operationId: deactivateGuest
      tags: [admin-guests]
      summary: Soft-deactivate guest — loses login access (RF-13, RN-12, CU-10)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Guest deactivated }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `GUEST_HAS_ACTIVE_CONTRACT` (the guest has a contract in force; debt does not block,
            RN-12) or `CONCURRENT_MODIFICATION` (see the `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestHasActiveContractError"
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/guests/{id}/reactivate:
    post:
      operationId: reactivateGuest
      tags: [admin-guests]
      summary: Reactivate a previously deactivated guest — restores login access and the state it had when deactivated (RF-13, RN-12, CU-28)
      description: >
        Answers the guest as it stands after reactivating: if the access it
        had expired meanwhile the guest comes back pending activation and the
        administrator offers to generate a new access.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: "Guest reactivated, login access restored"
          content: { application/json: { schema: { $ref: "#/components/schemas/NonInactiveGuestSummary" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `GUEST_HAS_PENDING_DEBT` (the guest owes periods; it is reactivated once they are
            paid, RN-25, RN-35) or `CONCURRENT_MODIFICATION` (see the `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestHasPendingDebtError"
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/guests/{id}/stays:
    get:
      operationId: listGuestStays
      tags: [admin-guests]
      summary: Stay history of a temporary guest, newest first (RN-13, CU-06, CU-31)
      description: >
        Every visit keeps its dates and agreed amount; a new stay is a new row of the same guest, never a new guest (RN-13, RN-18).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/After" }
      responses:
        "200":
          description: One page of the stays of the guest
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedStays" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createGuestStay
      tags: [admin-guests]
      summary: Register a stay of a temporary guest (RN-13, RN-17, CU-31)
      description: >
        Only for an active temporary guest. The dates may not overlap another stay of the same guest;
        a stay in the future may be registered while the previous one is still running.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StayInput" } } }
      responses:
        "201":
          description: Stay registered
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Stay" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `GUEST_NOT_ACTIVE` (the guest is not active, RN-35), `GUEST_NOT_TEMPORARY` (only temporary
            guests have stays) or `STAY_OVERLAP` (the dates cross another stay of the guest)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestNotActiveError"
                  - $ref: "#/components/schemas/GuestNotTemporaryError"
                  - $ref: "#/components/schemas/StayOverlapError"

  /admin/guests/{id}/stays/{stayId}:
    patch:
      operationId: updateGuestStay
      tags: [admin-guests]
      summary: Correct the dates or the agreed amount of a stay (RN-17, CU-31)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/StayId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StayUpdateInput" } } }
      responses:
        "200":
          description: Stay updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Stay" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `STAY_OVERLAP` (the new dates cross another stay of the guest) or `CONCURRENT_MODIFICATION`
            (see the `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/StayOverlapError"
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/guests/{id}/access:
    post:
      operationId: generateGuestAccess
      tags: [admin-guests]
      summary: Generate a new access (link or temporary password) for a guest — invalidates the previous one (RF-17, CU-13)
      description: >
        Covers an expired, lost or undelivered access, and a guest without
        email. Any guest that is not inactive qualifies, active ones
        included (an administrator-assisted password recovery). Generating
        a new access revokes the previous one, but the guest's current password
        stays valid until the new link or temporary password is used. The
        response carries the access in clear and is never cacheable
        (`Cache-Control: no-store`).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessMode]
              properties:
                accessMode: { $ref: "#/components/schemas/AccessMode" }
      responses:
        "200":
          description: New access generated; the previous one is revoked
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessGrant" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `GUEST_INACTIVE` (the guest is inactive, RN-12, RN-18; `guestId`
            lets the administrator reactivate it, CU-28) or
            `CONCURRENT_MODIFICATION` (the guest row changed while the access
            was generated, see the `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [code, message, guestId]
                    properties:
                      code: { type: string, enum: [GUEST_INACTIVE] }
                      message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
                      guestId: { type: string, format: uuid }
                  - $ref: "#/components/schemas/ConcurrentModificationError"
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/guests/{id}/documents:
    get:
      operationId: listGuestDocuments
      tags: [admin-guests]
      summary: Documents the guest uploaded in the onboarding, with a short-lived signed link (RN-37, CU-27)
      description: >
        Only the administrator sees these files. Each `url` is a signed R2
        link that expires 5 minutes after the response; ask again for a new one.
        A document is never deleted or replaced, except on an ARCO request of
        the holder or an upload error (RN-37), only by an administrator and
        with evidence (`deleteGuestDocument`, `replaceGuestDocument`,
        `listGuestDocumentActions`).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Documents of the guest (empty if none was uploaded)
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/GuestDocument" } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/guests/{id}/documents/{documentId}:
    put:
      operationId: replaceGuestDocument
      tags: [admin-guests]
      summary: Replace a document of the guest on an ARCO request or an upload error, with evidence (RN-37)
      description: >
        Only for an ARCO request of the holder or an upload error (RN-37). The
        fields `reason`, `requestedAt`, `requestChannel` and `note` follow the
        rules of `DocumentActionRequest`; an empty multipart field
        (`requestedAt=""`, `requestChannel=""`, `note=""` or whitespace only) counts
        as absent. A file over 5 MB is a 400 `DOCUMENT_INVALID_FILE`, never a 413.
        Order and atomicity: (1) the new object is uploaded to the storage; if
        that fails the answer is 503 `FILE_STORAGE_UNAVAILABLE` and nothing
        changes. (2) In a single transaction the document row is swapped for the
        new one (new `id`) and the evidence entry (`REPLACE`) is inserted; if the
        transaction fails the new object is deleted and nothing changes. (3) After
        the commit the old object is deleted, with a persistent retry; no row
        references it any more, so no new signed URL is issued for it. A signed URL
        already handed out for the old object (`listGuestDocuments`) may keep
        opening it until it expires (at most 5 minutes) or until the old object is
        deleted, whichever comes first.
        Concurrency: of two actions on the same `documentId` (replace or delete)
        only one wins; the row is taken by `(guest_id, id)` with a row lock or a
        conditional delete, and the loser gets 404 `RESOURCE_NOT_FOUND`.
        Never cacheable (`Cache-Control: no-store`).
        Rate limited per session user, checked before the file is read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/DocumentId" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, reason]
              additionalProperties: false
              description: >
                The fields other than `file` follow the rules of `DocumentActionRequest`
                (OpenAPI 3.0 cannot express the conditions). An empty field counts as
                absent. An unknown field is a 400 `DOCUMENT_INVALID_FILE`.
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB, checked by content (RF-15); over 5 MB is a 400 DOCUMENT_INVALID_FILE, not a 413" }
                reason: { $ref: "#/components/schemas/DocumentActionReason" }
                requestedAt: { $ref: "#/components/schemas/DocumentRequestedAt" }
                requestChannel: { $ref: "#/components/schemas/DocumentRequestChannel" }
                note: { $ref: "#/components/schemas/DocumentActionNote" }
      responses:
        "200":
          description: Document replaced; the response is the new document, with a new `id`
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestDocument" } } }
        "400":
          description: >
            `DOCUMENT_INVALID_FILE` (not JPG, PNG or PDF by content, over 5 MB, or an
            unknown multipart field, RF-15) or `VALIDATION_ERROR` with its `field`:
            `reason` missing or unknown; with `ARCO_REQUEST`, `requestedAt` or
            `requestChannel` missing; with `UPLOAD_ERROR`, `requestedAt` or
            `requestChannel` present; `requestedAt` after today (America/Lima); `note`
            over 500 characters
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OriginCheckForbidden" }
        "404": { $ref: "#/components/responses/GuestDocumentNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /admin/guests/{id}/documents/{documentId}/deletion:
    post:
      operationId: deleteGuestDocument
      tags: [admin-guests]
      summary: Delete a document of the guest on an ARCO request or an upload error, with evidence (RN-37)
      description: >
        Only for an ARCO request of the holder or an upload error (RN-37). A `POST`
        with a JSON body instead of a `DELETE` with a body, because proxies and
        rewrites may drop the body of a `DELETE`. It deletes personal data
        irreversibly and a `POST` can be sent cross-site without a preflight, so
        it is under the same `Origin`/`Sec-Fetch-Site` check as the multipart
        routes (ADR-006, 403), and it only accepts `Content-Type:
        application/json` (anything else is a 415).
        Order and atomicity: (1) the object is deleted from the storage; if that
        fails the answer is 503 `FILE_STORAGE_UNAVAILABLE`, nothing is deleted and
        no evidence is written. An object that is already missing counts as
        deleted, so a retry never gets stuck in 503. (2) If it succeeds, in a
        single transaction the document row is deleted and the evidence entry
        (`DELETE`) is inserted; if that transaction fails the answer is 500 and the
        row stays, so the administrator repeats the action and it completes
        (idempotent: step 1 finds the object missing and goes on to step 2).
        Concurrency: of two actions on the same `documentId` (delete or replace)
        only one wins; the row is taken by `(guest_id, id)` with a row lock or a
        conditional delete, and the loser gets 404 `RESOURCE_NOT_FOUND`.
        Never cacheable (`Cache-Control: no-store`).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/DocumentId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DocumentActionRequest" } } }
      responses:
        "204":
          description: File and row deleted, evidence entry recorded
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
        "400":
          description: >
            `VALIDATION_ERROR` with its `field`: `reason` missing or unknown; with
            `ARCO_REQUEST`, `requestedAt` or `requestChannel` missing; with
            `UPLOAD_ERROR`, `requestedAt` or `requestChannel` present; `requestedAt`
            after today (America/Lima); `note` over 500 characters; or an unknown property
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OriginCheckForbidden" }
        "404": { $ref: "#/components/responses/GuestDocumentNotFound" }
        "415":
          description: "The `Content-Type` is not exactly `application/json` (`UNSUPPORTED_MEDIA_TYPE`)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: >
            The object was deleted from the storage but the transaction that deletes
            the row and writes the evidence failed; the row stays. Repeat the action:
            it is idempotent and completes
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /admin/guests/{id}/document-actions:
    get:
      operationId: listGuestDocumentActions
      tags: [admin-guests]
      summary: Evidence of the deletions and replacements of the guest's documents, newest first (RN-37)
      description: >
        Who deleted or replaced which document, when and why. Never carries the
        file name, the storage key or the content.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/After" }
      responses:
        "200":
          description: One page of the document actions of the guest, newest first (empty if there is none)
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedGuestDocumentActions" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/guests/{id}/payments:
    get:
      operationId: listGuestPaymentsByAdmin
      tags: [admin-guests]
      summary: A guest's payment history, admin view (RF-10) — newest first, without the voucher URL (ask `getPayment` for it)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Payment history page for the given guest
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedPayments" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/guests/{id}/account-status:
    get:
      operationId: getGuestAccountStatusByAdmin
      tags: [admin-guests]
      summary: A guest's payment status by period, admin view (RF-06) — the same classification the guest sees in `getGuestAccountStatus`
      description: >-
        Every period of the guest's contracts, current or past, classified as in `getGuestAccountStatus`
        (paid, pending review, unpaid or overdue by payment day plus grace days, RN-10), in the same order.
        A guest without contracts, such as a temporary guest, answers an empty list. Works for active and
        inactive guests.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Status per period of the given guest
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PeriodStatus" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── ADMIN: CONTRACTS (RF-03, RF-09, CU-03, CU-07, CU-12) ─────────────────────────
  /admin/contracts:
    get:
      operationId: listContracts
      tags: [admin-contracts]
      summary: List contracts with validity status (RF-09, CU-07)
      description: >
        Newest first. The list carries no `fileUrl` (a signed URL per row would sign N files);
        ask `getContract` for the file of one contract. `status` is derived from the dates at
        the time of the request (America/Lima), so EXPIRED needs no job (RN-07).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, EXPIRED, TERMINATED] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Contract page
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedContracts" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createContract
      tags: [admin-contracts]
      summary: Upload contract (RF-03, CU-03)
      description: >
        Rate limited per session user, checked before the file is read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, environmentId, guestId, monthlyAmount, paymentDay, graceDays, startDate]
              properties:
                file: { type: string, format: binary, description: "PDF, ≤10MB, checked by content (RF-15)" }
                environmentId: { type: string, format: uuid }
                guestId: { type: string, format: uuid }
                monthlyAmount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
                paymentDay: { type: integer, minimum: 1, maximum: 31 }
                graceDays: { type: integer, minimum: 0, maximum: 31 }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date, description: "optional; omitted means an open-ended contract (RN-07); when present it must be after `startDate`" }
      responses:
        "201":
          description: Contract created
          content: { application/json: { schema: { $ref: "#/components/schemas/Contract" } } }
        "400":
          description: >
            `CONTRACT_INVALID_FILE` (not a PDF by content, or over 10 MB, RF-15),
            `CONTRACT_INVALID_DATES` (the end date is not after the start date, RF-03) or
            `VALIDATION_ERROR` (any other field, with its `field`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "The environment (`ENVIRONMENT_NOT_FOUND`) or the guest (`GUEST_NOT_FOUND`) does not exist", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: >
            `GUEST_NOT_ACTIVE` (the guest is not active, RN-35), `GUEST_NOT_CONTRACT` (only a
            guest of type CONTRACT takes a contract, the temporary one has stays, RN-13),
            `GUEST_HAS_PENDING_DEBT` (the guest owes periods, RN-25), `ENVIRONMENT_INACTIVE` (the
            environment is inactive and takes no new contract, RF-01) or `ENVIRONMENT_OCCUPIED`
            (the environment already has a contract in force, RN-20). The check order is: guest
            state, guest type, debt, environment state, environment occupancy
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestNotActiveError"
                  - $ref: "#/components/schemas/GuestNotContractError"
                  - $ref: "#/components/schemas/GuestHasPendingDebtError"
                  - $ref: "#/components/schemas/EnvironmentInactiveError"
                  - $ref: "#/components/schemas/EnvironmentOccupiedError"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /admin/contracts/{id}:
    get:
      operationId: getContract
      tags: [admin-contracts]
      summary: Contract detail
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: "Contract detail (never cacheable: it carries a freshly signed file URL)"
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Contract" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /admin/contracts/{id}/terminate:
    post:
      operationId: terminateContract
      tags: [admin-contracts]
      summary: Manually terminate contract (RN-25, CU-12) — the debt does not block it, and the guest keeps owing the periods until they are paid
      description: Idempotent — a contract that is already terminated or expired answers 204 and stays as it is
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Contract terminated }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── ADMIN: PAYMENTS (RF-05, RF-06, CU-04, CU-05, CU-14) ─────────────────────────
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin-dashboard]
      summary: Administrator home summary (HU-A04, CU-04)
      description: >
        One state per active contract (its period of the current month, America/Lima,
        RN-10) and per temporary guest whose stay covers today: `PAID` counts as up to
        date, `UNDER_REVIEW` as under review, `UNPAID` not yet overdue as pending and
        `OVERDUE` as overdue (RN-06). The vouchers awaiting review come oldest first,
        at most 20; `pendingVouchersTotal` gives how many there are.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                type: object
                required: [paymentsUpToDate, paymentsUnderReview, paymentsPending, paymentsOverdue, pendingVouchers, pendingVouchersTotal]
                properties:
                  paymentsUpToDate: { type: integer, minimum: 0, description: "PAID" }
                  paymentsUnderReview: { type: integer, minimum: 0, description: "UNDER_REVIEW" }
                  paymentsPending: { type: integer, minimum: 0, description: "UNPAID, not yet overdue" }
                  paymentsOverdue: { type: integer, minimum: 0, description: "OVERDUE" }
                  pendingVouchers:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/PaymentSummary" }
                  pendingVouchersTotal: { type: integer, minimum: 0 }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/finance:
    get:
      operationId: getFinanceSummary
      tags: [admin-dashboard]
      summary: Income vs. expenses balance for a month (RF-18, CU-08)
      description: >-
        Income is the sum of the approved payments attributed to the month plus the fines of the
        month (RF-19); expenses are the expenses of the month (RF-07); `net` is income minus
        expenses. A contract payment belongs to its period; a stay payment belongs to the month
        the stay starts (D-68). Pending, rejected or cancelled payments do not
        count. Guests and environments count whether active or inactive. A month without
        movements answers zeros. Amounts in soles with two decimals.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: month
          in: query
          required: true
          description: Month to summarize, YYYY-MM with a year from 0001 to 9999
          schema: { type: string, pattern: "^(?!0000)\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
      responses:
        "200":
          description: Monthly balance
          content:
            application/json:
              schema:
                type: object
                required: [month, totalIncome, incomeFromPayments, incomeFromFines, totalExpenses, net]
                properties:
                  month: { type: string, pattern: "^(?!0000)\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
                  totalIncome: { type: number, multipleOf: 0.01, description: "incomeFromPayments + incomeFromFines" }
                  incomeFromPayments: { type: number, multipleOf: 0.01, description: "Approved contract and stay payments attributed to the month" }
                  incomeFromFines: { type: number, multipleOf: 0.01, description: "Fines of the month" }
                  totalExpenses: { type: number, multipleOf: 0.01 }
                  net: { type: number, multipleOf: 0.01, description: "totalIncome - totalExpenses; negative when expenses are higher" }
        "400":
          description: "`VALIDATION_ERROR` with `field: month` when it is missing, not a YYYY-MM month or its year is 0000"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/payments:
    get:
      operationId: listPayments
      tags: [admin-payments]
      summary: Payment review queue (RF-05, CU-05) — oldest first, so the review is first in, first out
      description: >
        Each row carries the guest, the environment (or the temporary mark), the period and the
        upload date, and no amount: the administrator compares the declared amount with the
        voucher in `getPayment` before resolving (RN-16, A5).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Payment queue page
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedPaymentQueue" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createDirectPayment
      tags: [admin-payments]
      summary: >
        Register a direct payment (cash/manual) — admin uploads the
        voucher on the guest's behalf, auto-approved (RN-22, RN-23, CU-14).
        A voucher is always required, no exceptions (RN-22).
      description: >
        Rate limited per session user, checked before the file is read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, guestId, amount]
              description: >
                Send exactly one of `period` (a guest with a contract) or `stayId` (a temporary
                guest, whose single payment belongs to a stay, RN-03).
              oneOf:
                - type: object
                  required: [period]
                  properties:
                    period: { type: string }
                - type: object
                  required: [stayId]
                  properties:
                    stayId: { type: string }
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB, checked by content (RF-15)" }
                guestId: { type: string, format: uuid }
                period: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
                stayId: { type: string, format: uuid }
                amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
                paymentMethod: { type: string, maxLength: 50, description: "Optional free text, e.g. Yape/transfer/cash (RN-28)" }
      responses:
        "201":
          description: "Payment registered, status APPROVED immediately (RN-23)"
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSummary" } } }
        "400":
          description: >
            `VOUCHER_INVALID_FILE` (not JPG, PNG or PDF by content, or over 5 MB, RF-15) or
            `VALIDATION_ERROR` (any other field, with its `field`: amount, period, stayId, or both
            or neither of period and stayId)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "The guest (`GUEST_NOT_FOUND`) or the stay (`STAY_NOT_FOUND`) does not exist", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: >
            `GUEST_NOT_ACTIVE` (RN-35), `PAYMENT_ALREADY_EXISTS_FOR_PERIOD` (an approved payment
            already exists for the period or the stay, RN-02) or `VOUCHER_ALREADY_EXISTS` (a voucher
            is still pending for it: resolve it first)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestNotActiveError"
                  - $ref: "#/components/schemas/PaymentAlreadyExistsForPeriodError"
                  - $ref: "#/components/schemas/VoucherAlreadyExistsError"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /admin/payments/{id}:
    get:
      operationId: getPayment
      tags: [admin-payments]
      summary: Payment detail with the voucher to review (A5.2, RN-16)
      description: The voucher URL is signed when this is requested, expires in 15 minutes and forces the download
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: "Payment detail (never cacheable: it carries a freshly signed voucher URL)"
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }
    patch:
      operationId: resolvePayment
      tags: [admin-payments]
      summary: Approve or reject a payment (RF-05, CU-05)
      description: >
        A pending payment is resolved once. Rejecting does not close the period: the guest can
        upload a new voucher. A short payment is rejected with a reason and the guest uploads a
        voucher for the full amount (RN-16).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
                reason: { type: string, maxLength: 500, description: "Required when status=REJECTED, not blank (RN-05); shown to the guest in the app only" }
      responses:
        "200":
          description: Payment resolved (without the voucher URL; ask `getPayment` for it)
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSummary" } } }
        "400":
          description: "`PAYMENT_REASON_REQUIRED` (empty reason on rejection, RN-05) or `VALIDATION_ERROR`"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `PAYMENT_ALREADY_RESOLVED` (the payment is no longer pending: another process resolved
            it first), `PAYMENT_ALREADY_EXISTS_FOR_PERIOD` (approving it would leave two approved
            payments for the same period or stay) or `PAYMENT_PERIOD_NOT_PAYABLE` (approving a
            payment whose period the contract no longer charges, because it was terminated or expired
            first; the payment stays pending and can only be rejected with a reason)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PaymentAlreadyResolvedError"
                  - $ref: "#/components/schemas/PaymentAlreadyExistsForPeriodError"
                  - $ref: "#/components/schemas/PaymentPeriodNotPayableError"

  # ───────────────────────── ADMIN: EXPENSES (RF-07, CU-08) ─────────────────────────
  /admin/expenses:
    get:
      operationId: listExpenses
      tags: [admin-expenses]
      summary: List monthly expenses (RF-07, CU-08)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: One page of the expense list of the month, oldest first
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedExpenses" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createExpense
      tags: [admin-expenses]
      summary: Register expense (RF-07)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "201":
          description: Expense created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/expenses/{id}:
    patch:
      operationId: updateExpense
      tags: [admin-expenses]
      summary: Edit expense — replaces its category, amount, month and description; no audit restriction (RN-24)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseInput" } } }
      responses:
        "200":
          description: Expense updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConcurrentModification" }
    delete:
      operationId: deleteExpense
      tags: [admin-expenses]
      summary: Delete expense — no audit restriction (RN-24)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Expense deleted for good (RN-24) }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── ADMIN: FINES (RF-19, RN-30) ─────────────────────────
  /admin/fines:
    get:
      operationId: listFines
      tags: [admin-fines]
      summary: List monthly fines (RF-19)
      description: >
        Fines of the month, of any guest, active or inactive. The list is a plain array with no
        pagination: a month has few fines (RF-19).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
      responses:
        "200":
          description: Fines of the month, not paginated
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Fine" } } } }
        "400":
          description: "`VALIDATION_ERROR` with `field: month` (missing, or not a YYYY-MM month)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createFine
      tags: [admin-fines]
      summary: Register fine as income against a guest (RF-19, RN-30)
      description: >
        A fine is direct income of its month (RN-30): it takes no voucher and no approval, and it
        counts in the monthly balance as soon as it is created. It accepts any existing guest,
        active or inactive (a fine can be charged after the guest left). A fine is not edited:
        to change it, delete it and create it again (RN-24).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FineInput" }
      responses:
        "201":
          description: Fine created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Fine" } } }
        "400":
          description: >
            `VALIDATION_ERROR` with its `field`: `guestId` missing or not a UUID, `amount` missing,
            not greater than 0, over 99999999.99 or with more than two decimals, `month` missing or
            not a YYYY-MM month, or `description` over 500 characters
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { description: "The guest does not exist (`RESOURCE_NOT_FOUND`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /admin/fines/{id}:
    delete:
      operationId: deleteFine
      tags: [admin-fines]
      summary: Delete fine — no audit restriction (RN-24)
      description: >
        Deletes the fine for good (RN-24): it leaves the monthly balance at once. There is no
        edit operation; to correct a fine, delete it and create it again (RF-19, RN-30).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Fine deleted for good (RN-24) }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { description: "The fine does not exist (`RESOURCE_NOT_FOUND`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ───────────────────────── CONTRACT GUEST (RF-04, RF-06, RF-10, CU-16..20) ─────────────────────────
  /guest/account-status:
    get:
      operationId: getGuestAccountStatus
      tags: [guest]
      summary: Payment status by period — up to date/pending/overdue (RF-06, CU-16)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      responses:
        "200":
          description: Status per period
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PeriodStatus" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }

  /guest/contract:
    get:
      operationId: getOwnContract
      tags: [guest]
      summary: >
        Own contract, regardless of status — shown read-only even when
        EXPIRED or TERMINATED (CU-18, RN-26). A guest never loses visibility
        of their own contract; only the ability to act on it changes with
        status (e.g. voucher upload requires ACTIVE, see /guest/payments).
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      responses:
        "200":
          description: "Own contract, whatever its status (never cacheable: it carries a freshly signed file URL)"
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Contract" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "404": { description: "No contract was ever associated with this guest" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /guest/payments:
    get:
      operationId: listOwnPayments
      tags: [guest]
      summary: Own payment history (RF-10, CU-19) — own record only (RN-09), newest first, without the voucher URL
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Own payment history page
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedPayments" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
    post:
      operationId: uploadPaymentVoucher
      tags: [guest]
      summary: Upload monthly payment voucher (RF-04, CU-17)
      description: >
        Rate limited per session user, checked before the file is read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, period, amount]
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB, checked by content (RF-15)" }
                period: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09", description: "A month of the contract, up to the current month" }
                amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "Declared amount, in soles; the administrator compares it with the voucher (RN-16)" }
                paymentMethod: { type: string, maxLength: 50, description: "Optional free text, e.g. Yape/transfer/cash (RN-28)" }
      responses:
        "201":
          description: Voucher uploaded, payment set to PENDING
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSummary" } } }
        "400":
          description: >
            `VOUCHER_INVALID_FILE` (not JPG, PNG or PDF by content, or over 5 MB, RF-15) or
            `VALIDATION_ERROR` (any other field, with its `field`: amount, period)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >
            `VOUCHER_NO_ACTIVE_CONTRACT` (no active contract, RN-27),
            `AUTH_ONBOARDING_REQUIRED` (the onboarding is not complete, RN-33),
            `AUTH_PASSWORD_CHANGE_REQUIRED` (temporary password not changed,
            RF-12) or `AUTH_FORBIDDEN` (a guest of the other type, RN-09). On the multipart upload, `AUTH_FORBIDDEN` is also returned when the request carries neither an `Origin` header nor `Sec-Fetch-Site: same-origin` (ADR-006)
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [VOUCHER_NO_ACTIVE_CONTRACT, AUTH_ONBOARDING_REQUIRED, AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
                  message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        "409":
          description: >
            `GUEST_NOT_ACTIVE` (RN-35), `PAYMENT_ALREADY_EXISTS_FOR_PERIOD` (the period is already
            approved, RN-02, D-28) or `VOUCHER_ALREADY_EXISTS` (a voucher is pending for this period,
            RN-15)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestNotActiveError"
                  - $ref: "#/components/schemas/PaymentAlreadyExistsForPeriodError"
                  - $ref: "#/components/schemas/VoucherAlreadyExistsError"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /guest/profile:
    patch:
      operationId: updateOwnProfile
      tags: [guest]
      summary: Edit own personal and contact data (CU-20, RN-17)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateInput" }
      responses:
        "200":
          description: Profile updated
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestSummary" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "409": { $ref: "#/components/responses/GuestEmailTaken" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── GUEST ONBOARDING (RF-14, RF-20, CU-11, CU-24..26) ─────────────────────────
  # Open to a GUEST of either type. Until the onboarding is complete every other
  # /guest/** and /temporary-guest/** operation answers 403 AUTH_ONBOARDING_REQUIRED.
  /guest/onboarding:
    get:
      operationId: getOnboarding
      tags: [guest-onboarding]
      summary: Onboarding state — next step, saved data and the consent text in force (RF-20, CU-26)
      description: >
        Lets the guest resume where they left off. `nextStep` is the first
        pending step in the order PASSWORD, PERSONAL_DATA, DOCUMENTS, CONSENT
        (RN-33); the documents step is optional (RN-37) but is still offered
        once.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      responses:
        "200":
          description: Current onboarding state
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingState" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }

  /guest/onboarding/personal-data:
    put:
      operationId: savePersonalData
      tags: [guest-onboarding]
      summary: Save the personal data step (RF-20, CU-25)
      description: >
        Requires the password step to be done (RN-33). Only while the guest is
        in onboarding; afterwards the data is edited through the profile endpoint.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PersonalDataInput" } } }
      responses:
        "200":
          description: Step saved
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingDocumentsPending" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409":
          description: >
            An onboarding-state conflict (`ONBOARDING_STEP_OUT_OF_ORDER`, `ONBOARDING_ALREADY_COMPLETED`,
            see the `OnboardingConflict` response) or `GUEST_EMAIL_TAKEN` (the contact email
            already belongs to another guest, D-33)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/OnboardingConflictError"
                  - $ref: "#/components/schemas/GuestEmailTakenError"

  /guest/onboarding/documents:
    post:
      operationId: uploadOnboardingDocument
      tags: [guest-onboarding]
      summary: Upload one optional document (RN-37, RF-15, CU-25)
      description: >
        One file per call; repeat for more. At most 5 files per guest, each
        JPG, PNG or PDF of up to 5 MB, checked by real content (SEC-07). The
        guest never gets the file back: only the administrator sees it. The
        guest can neither delete nor replace a file. The only exception is an
        ARCO request of the holder or an upload error (RN-37): an administrator
        deletes or replaces the file (`POST
        /admin/guests/{id}/documents/{documentId}/deletion` and `PUT
        /admin/guests/{id}/documents/{documentId}`), and each action leaves an
        evidence entry with who and when (`GET /admin/guests/{id}/document-actions`).
        Rate limited per session user, checked before the file is read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB, checked by content (RF-15)" }
      responses:
        "201":
          description: Document stored
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestDocumentRef" } } }
        "400":
          description: "`DOCUMENT_INVALID_FILE` (type or size not allowed, RF-15)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409":
          description: >
            `DOCUMENT_LIMIT_REACHED` (the guest already has 5 files),
            `ONBOARDING_STEP_OUT_OF_ORDER` or `ONBOARDING_ALREADY_COMPLETED`
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /guest/onboarding/documents/done:
    post:
      operationId: finishDocumentsStep
      tags: [guest-onboarding]
      summary: Mark the documents step as finished, with files or skipped (RN-37, CU-25)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      responses:
        "200":
          description: Step finished
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingConsentPending" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409": { $ref: "#/components/responses/OnboardingConflict" }

  /guest/onboarding/consent:
    post:
      operationId: acceptConsent
      tags: [guest-onboarding]
      summary: Accept the personal data consent — closes the onboarding (RF-14, RN-14, CU-11)
      description: >
        Records the acceptance with date, time and the text version. With the
        password and personal data steps already done, the guest becomes
        ACTIVE (RN-33, RN-36). Accepting before the personal data step answers
        409 `ONBOARDING_STEP_OUT_OF_ORDER`.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConsentInput" } } }
      responses:
        "200":
          description: "Consent recorded and the guest is now ACTIVE: the onboarding is complete"
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingCompleted" } } }
        "400":
          description: >
            `CONSENT_NOT_ACCEPTED` (`accepted` is not true) or
            `VALIDATION_ERROR` with `field: consentVersion` if it is not the
            version in force
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409": { $ref: "#/components/responses/OnboardingConflict" }

  # ───────────────────────── TEMPORARY GUEST (RF-04, RF-06, CU-21, CU-22) ─────────────────────────
  /temporary-guest/payment-status:
    get:
      operationId: getTemporaryGuestPaymentStatus
      tags: [temporary-guest]
      summary: Payment status of the stay in force (CU-21)
      description: >
        The stay in force today, otherwise the next one, otherwise the last one (the same rule
        as the stay fields of the guest detail).
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType TEMPORARY
      responses:
        "200":
          description: Stay payment status
          content: { application/json: { schema: { $ref: "#/components/schemas/StayPaymentStatus" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "404": { description: "The guest has no stay yet (`RESOURCE_NOT_FOUND`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /temporary-guest/payments:
    post:
      operationId: uploadTemporaryVoucher
      tags: [temporary-guest]
      summary: >
        Upload the one-time payment voucher (RF-04, CU-22) — a stay allows
        exactly one voucher, pending or approved (RN-03: single non-recurring
        payment per stay). The guest keeps its record across visits and each visit is
        a stay (RN-13, RN-18, `POST /admin/guests/{id}/stays`). The guest does not choose
        the stay: the voucher belongs to the stay in force today, otherwise to the next one
        that has no pending or approved payment.
      description: >
        Rate limited per session user, checked before the file is read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType TEMPORARY
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, amount]
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB, checked by content (RF-15)" }
                amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "Declared amount, in soles; the administrator compares it with the voucher (RN-16)" }
                paymentMethod: { type: string, maxLength: 50, description: "Optional free text, e.g. Yape/transfer/cash (RN-28)" }
      responses:
        "201":
          description: Voucher uploaded, payment set to PENDING
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSummary" } } }
        "400":
          description: >
            `VOUCHER_INVALID_FILE` (not JPG, PNG or PDF by content, or over 5 MB, RF-15) or
            `VALIDATION_ERROR` (any other field, with its `field`: amount)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >
            `VOUCHER_NO_ACTIVE_STAY` (the guest has no stay in force or coming, CU-22),
            `AUTH_ONBOARDING_REQUIRED` (the onboarding is not complete, RN-33),
            `AUTH_PASSWORD_CHANGE_REQUIRED` (temporary password not changed, RF-12) or
            `AUTH_FORBIDDEN` (a guest of the other type, RN-09). On the multipart upload, `AUTH_FORBIDDEN` is also returned when the request carries neither an `Origin` header nor `Sec-Fetch-Site: same-origin` (ADR-006)
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [VOUCHER_NO_ACTIVE_STAY, AUTH_ONBOARDING_REQUIRED, AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
                  message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        "409":
          description: >
            `GUEST_NOT_ACTIVE` (RN-35), `PAYMENT_ALREADY_EXISTS_FOR_PERIOD` (the stay is already paid,
            RN-03) or `VOUCHER_ALREADY_EXISTS` (a voucher is pending for the stay, RN-03, RN-15)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestNotActiveError"
                  - $ref: "#/components/schemas/PaymentAlreadyExistsForPeriodError"
                  - $ref: "#/components/schemas/VoucherAlreadyExistsError"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /temporary-guest/profile:
    patch:
      operationId: updateOwnProfileTemporary
      tags: [temporary-guest]
      summary: Edit own personal and contact data (CU-23, RN-17)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType TEMPORARY
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateInput" }
      responses:
        "200":
          description: Profile updated
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestSummary" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "409": { $ref: "#/components/responses/GuestEmailTaken" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionToken
      description: JWT in an HttpOnly cookie, SameSite=Lax; Secure — same site, because Vercel rewrites /bff/* to the backend (RF-08). OpenAPI 3.0 only allows empty scope lists for this scheme, so the role that may call each operation is declared with the `x-roles` extension (ADMIN or GUEST); an operation without it accepts any authenticated session.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StayId:
      name: stayId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Items per page, from 1 to 100. A value out of range is a 400
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    After:
      name: after
      in: query
      description: >
        Opaque cursor: the `nextCursor` of the previous page. Absent for the
        first page. Do not build or edit it; a cursor that is not valid is a 400.
        Keyset pagination: the list keeps its order and the page starts right
        after the last item seen, so it costs the same on any page.
      schema: { type: string, minLength: 1, maxLength: 512 }

  headers:
    Location:
      description: Absolute path of the created resource, with its masked id (RFC 9110, 201 Created)
      required: true
      schema: { type: string }

  responses:
    ValidationFailed:
      description: Invalid input data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >
        The session is valid but its role cannot use the operation (RN-08, RN-09). On the
        multipart uploads it is also returned when the request carries neither an `Origin`
        header nor `Sec-Fetch-Site: same-origin` (ADR-006). The `code` is always `AUTH_FORBIDDEN`
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_FORBIDDEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    EnvironmentCodeTaken:
      description: Another environment already has that code (RF-01). The `code` is always `ENVIRONMENT_CODE_TAKEN` and `field` is always `code`
      content:
        application/json:
          schema:
            type: object
            required: [code, message, field]
            properties:
              code: { type: string, enum: [ENVIRONMENT_CODE_TAKEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
              field: { type: string, enum: [code] }
    ConcurrentModification:
      description: >
        Two edits of the same record collided (optimistic locking, BE-SPR-DAT-13):
        the record changed after the client loaded it. The client reloads the
        record and retries. The `code` is always `CONCURRENT_MODIFICATION`.
        Applies to environments, guests and expenses
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConcurrentModificationError" }
          example:
            code: CONCURRENT_MODIFICATION
            message: El registro cambió mientras lo editabas; vuelve a cargarlo e inténtalo de nuevo
    NoSession:
      description: No active session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCredentials:
      description: Incorrect document or password
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PasswordChangeRequired:
      description: >
        The session must change its password first (RF-12). Any endpoint except
        login and change-password answers `AUTH_PASSWORD_CHANGE_REQUIRED` until it does.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountDisabled:
      description: Account disabled (RN-12)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountLocked:
      description: >
        Account temporarily locked after 5 consecutive failed logins (SEG-06): the lock lasts
        15 minutes, expires by itself and is lifted by a password reset (RF-16). The `code` is
        always `AUTH_ACCOUNT_LOCKED`. The `Retry-After` header gives the seconds left, which is
        what the client counts down from (so a wrong clock on the device cannot skew it), and
        `lockedUntil` the instant the lock ends, to show the time of day
      headers:
        Retry-After:
          description: Seconds until the account can try again, rounded up (at least 1)
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            required: [code, message, lockedUntil]
            properties:
              code: { type: string, enum: [AUTH_ACCOUNT_LOCKED] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
              lockedUntil: { type: string, format: date-time, description: "UTC instant at which the lock ends; the UI shows it in America/Lima" }
    TooManyRequests:
      description: "Rate limit exceeded (SEC-01) — retry after the window in the `Retry-After` header"
      headers:
        Retry-After:
          description: Seconds until the client may retry
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OriginCheckForbidden:
      description: >
        `AUTH_FORBIDDEN`: the session is not an administrator (RN-08), or the request
        carries neither an `Origin` header nor `Sec-Fetch-Site: same-origin`, or they
        name another site (ADR-006). `replaceGuestDocument` is the sixth route of the
        exact set of multipart routes under that check: `createContract`,
        `createDirectPayment`, `uploadPaymentVoucher`, `uploadOnboardingDocument`,
        `uploadTemporaryVoucher` and `replaceGuestDocument`. `deleteGuestDocument`
        is the only JSON route under the same check, because it deletes personal
        data irreversibly
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_FORBIDDEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    AdministratorNotFound:
      description: >-
        The id does not exist or is not an ADMIN account (`ADMIN_NOT_FOUND`); both cases answer the
        same `message`
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [ADMIN_NOT_FOUND] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
          example:
            code: ADMIN_NOT_FOUND
            message: El administrador no existe
    GuestDocumentNotFound:
      description: >
        The guest does not exist, the document does not belong to that guest, or a
        concurrent action on the same document won (`RESOURCE_NOT_FOUND`). A single
        lookup by `(guest_id, id)` answers all cases with the same `message`, so the
        response does not reveal whether the guest or the document exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FileStorageUnavailable:
      description: "The file storage (R2) is not configured or failed; nothing was saved — retry later (`FILE_STORAGE_UNAVAILABLE`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FileStorageUnavailableError" }
    GuestInactive:
      description: >
        The guest is inactive (RN-12, RN-18). The `code` is always
        `GUEST_INACTIVE` and `guestId` lets the administrator reactivate it
        right from the notice (`POST /admin/guests/{id}/reactivate`, CU-28)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GuestInactiveError" }
    OnboardingAccessDenied:
      description: >
        A guest session that cannot use the onboarding operation. The `code` is
        `AUTH_PASSWORD_CHANGE_REQUIRED` while a temporary password has not been
        changed (RF-12) or `AUTH_FORBIDDEN` for the administrator. Never
        `AUTH_ONBOARDING_REQUIRED`: these are the routes an incomplete guest must reach. On the multipart upload, `AUTH_FORBIDDEN` is also returned when the request carries neither an `Origin` header nor `Sec-Fetch-Site: same-origin` (ADR-006)
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    GuestAccessDenied:
      description: >
        The guest session cannot use the operation yet or at all. The `code` is
        `AUTH_ONBOARDING_REQUIRED` while the onboarding is incomplete (RN-33: the
        client redirects to the first pending step, `nextStep` of `GET
        /guest/onboarding`), `AUTH_PASSWORD_CHANGE_REQUIRED` while a temporary
        password has not been changed (RF-12) and `AUTH_FORBIDDEN` for a guest
        of the other type (a CONTRACT guest on `/temporary-guest/**` or the
        reverse, RN-09)
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_ONBOARDING_REQUIRED, AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    OnboardingConflict:
      description: >
        `ONBOARDING_STEP_OUT_OF_ORDER` (a step was attempted before its
        predecessor, RN-33) or `ONBOARDING_ALREADY_COMPLETED` (the guest is
        already active: use the profile endpoint)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OnboardingConflictError" }
    GuestEmailTaken:
      description: >
        The contact email already belongs to another guest (D-33). The `code` is always
        `GUEST_EMAIL_TAKEN` and `field` is `contactEmail`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GuestEmailTakenError" }
  schemas:
    PagedEnvironments:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Environment" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    PagedGuests:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/GuestSummary" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    PagedExpenses:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Expense" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    NextCursor:
      type: string
      nullable: true
      description: Value for `after` to get the next page; `null` when this is the last one

    Error:
      type: object
      description: >
        BFF error shape — plain JSON, distinct from RFC 7807 (that is
        exclusive to the internal Core API, see SRS chapter "10 - APIs e
        Integraciones"). `code` is a stable English constant read by the
        frontend; `message` is the Spanish text shown to the end user.
      required: [code, message]
      properties:
        code: { type: string, description: "Stable error code, e.g. VOUCHER_ALREADY_EXISTS" }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        field: { type: string, description: "Field name if this is a validation error" }

    ConcurrentModificationError:
      type: object
      description: Optimistic-locking conflict (BE-SPR-DAT-13). The `code` is always `CONCURRENT_MODIFICATION`
      required: [code, message]
      properties:
        code: { type: string, enum: [CONCURRENT_MODIFICATION] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    EnvironmentInactiveError:
      type: object
      description: The environment is inactive and takes no new contract (RF-01). The `code` is always `ENVIRONMENT_INACTIVE`
      required: [code, message]
      properties:
        code: { type: string, enum: [ENVIRONMENT_INACTIVE] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    EnvironmentOccupiedError:
      type: object
      description: The environment has a contract in force (RN-12, RN-20). The `code` is always `ENVIRONMENT_OCCUPIED`
      required: [code, message]
      properties:
        code: { type: string, enum: [ENVIRONMENT_OCCUPIED] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    GuestInactiveError:
      type: object
      description: The guest is inactive (RN-12, RN-18). The `guestId` lets the administrator reactivate it
      required: [code, message, guestId]
      properties:
        code: { type: string, enum: [GUEST_INACTIVE] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        guestId: { type: string, format: uuid }

    OnboardingConflictError:
      type: object
      description: A step was attempted out of order, or the onboarding is already complete (RN-33)
      required: [code, message]
      properties:
        code: { type: string, enum: [ONBOARDING_STEP_OUT_OF_ORDER, ONBOARDING_ALREADY_COMPLETED] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    GuestNotActiveError:
      type: object
      description: The guest is not active, so it cannot take a new contract or payment (RN-35)
      required: [code, message, guestId]
      properties:
        code: { type: string, enum: [GUEST_NOT_ACTIVE] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        guestId: { type: string, format: uuid }

    GuestDocumentTakenError:
      type: object
      description: The document already belongs to another guest or to an administrator account (RN-18, D-34e)
      required: [code, message, field]
      properties:
        code: { type: string, enum: [GUEST_DOCUMENT_TAKEN] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        field: { type: string }

    GuestEmailTakenError:
      type: object
      description: The contact email already belongs to another guest (D-33); the account email is independent
      required: [code, message, field]
      properties:
        code: { type: string, enum: [GUEST_EMAIL_TAKEN] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        field: { type: string, enum: [contactEmail] }

    GuestHasActiveContractError:
      type: object
      description: The guest has a contract in force, so it cannot be deactivated (RN-12). Debt does not block it
      required: [code, message, contractId]
      properties:
        code: { type: string, enum: [GUEST_HAS_ACTIVE_CONTRACT] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        contractId: { type: string, format: uuid, description: "The contract in force, so the UI can link to it" }

    GuestHasPendingDebtError:
      type: object
      description: The guest owes periods (RN-25), so it cannot take a new contract or be reactivated until they are paid (RN-35)
      required: [code, message, periods]
      properties:
        code: { type: string, enum: [GUEST_HAS_PENDING_DEBT] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        periods:
          type: array
          minItems: 1
          description: The periods owed, oldest first, so the UI can list them and offer the direct payment (RN-23)
          items: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }

    Stay:
      type: object
      description: One visit of a temporary guest (RN-13); the stay of a guest is never edited into a new one, a new visit is a new row
      required: [id, startDate, endDate, agreedAmount]
      properties:
        id: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: "On or after startDate" }
        agreedAmount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }

    StayInput:
      type: object
      required: [startDate, endDate, agreedAmount]
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: "On or after startDate" }
        agreedAmount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }

    StayUpdateInput:
      type: object
      description: At least one field; the resulting dates must stay valid and may not overlap another stay of the guest
      minProperties: 1
      additionalProperties: false
      properties:
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        agreedAmount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }

    PagedStays:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Stay" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    StayOverlapError:
      type: object
      description: The dates cross another stay of the same guest. The `code` is always `STAY_OVERLAP`
      required: [code, message]
      properties:
        code: { type: string, enum: [STAY_OVERLAP] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    GuestNotTemporaryError:
      type: object
      description: Only temporary guests have stays (RN-13). The `code` is always `GUEST_NOT_TEMPORARY`
      required: [code, message]
      properties:
        code: { type: string, enum: [GUEST_NOT_TEMPORARY] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    DocumentType:
      type: string
      enum: [DNI, CE, PASSPORT]
      description: "DNI (national ID, 8 digits), CE (Carné de Extranjería), PASSPORT (foreign visitors without CE)"

    Environment:
      type: object
      required: [id, code, type, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        type: { type: string, enum: [ROOM, CABIN] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }

    SessionInfo:
      description: >
        Session data answered by login, link activation and `GET /auth/me`,
        in one of four shapes: the administrator, a guest that must still set its
        password (temporary password), a guest in onboarding with the password already
        set (with the step to go to) or an active guest. `name` is the guest's name;
        while the guest has not completed the personal data step it is the
        document in text (for example "DNI 12345678") so the field is always there.
      oneOf:
        - $ref: "#/components/schemas/AdminSession"
        - $ref: "#/components/schemas/GuestPasswordPendingSession"
        - $ref: "#/components/schemas/GuestOnboardingSession"
        - $ref: "#/components/schemas/GuestActiveSession"

    AdminSession:
      type: object
      required: [role, name, mustChangePassword]
      properties:
        role: { type: string, enum: [ADMIN] }
        name: { type: string }
        mustChangePassword: { type: boolean, description: "true until the administrator changes a temporary password (RF-12)" }

    GuestPasswordPendingSession:
      type: object
      description: A guest that logged in with a temporary password and must choose its own first (RF-12, RN-33)
      required: [role, guestType, name, mustChangePassword, guestStatus, nextOnboardingStep]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [true] }
        guestStatus: { type: string, enum: [ONBOARDING] }
        nextOnboardingStep: { type: string, enum: [PASSWORD] }

    GuestOnboardingSession:
      type: object
      description: A guest whose password is set and whose onboarding still has steps left (RN-33)
      required: [role, guestType, name, mustChangePassword, guestStatus, nextOnboardingStep]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [false] }
        guestStatus: { type: string, enum: [ONBOARDING] }
        nextOnboardingStep: { type: string, enum: [PERSONAL_DATA, DOCUMENTS, CONSENT], description: "First pending step, in the order of RN-33" }

    GuestActiveSession:
      type: object
      description: A guest that completed the onboarding (RN-36)
      required: [role, guestType, name, mustChangePassword, guestStatus]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, description: "true while a temporary password has not been changed (RF-12)" }
        guestStatus: { type: string, enum: [ACTIVE] }

    ActivatedOnboardingSession:
      type: object
      description: A guest that has just set its password through the activation link and still has onboarding steps left
      required: [role, guestType, name, mustChangePassword, guestStatus, nextOnboardingStep]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [false] }
        guestStatus: { type: string, enum: [ONBOARDING] }
        nextOnboardingStep: { type: string, enum: [PERSONAL_DATA, DOCUMENTS, CONSENT] }

    ActivatedActiveSession:
      type: object
      description: An already active guest that recovered its access with a new link
      required: [role, guestType, name, mustChangePassword, guestStatus]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [false] }
        guestStatus: { type: string, enum: [ACTIVE] }

    GuestStatus:
      type: string
      enum: [PENDING_ACTIVATION, ONBOARDING, ACTIVE, INACTIVE]
      description: "Guest lifecycle (RN-36). Inactive is reversible (RN-12)"

    AccessMode:
      type: string
      enum: [LINK, TEMPORARY_PASSWORD]
      description: "How the administrator delivers the access: an activation link or a temporary password (RN-32)"

    AccessGrant:
      description: >
        An access generated by the administrator. Valid 30 minutes and single
        use (RN-32). The secret is given only here, in clear, and cannot be
        read again, so each mode requires its own secret: `activationUrl` for
        LINK, `temporaryPassword` for TEMPORARY_PASSWORD.
      oneOf:
        - $ref: "#/components/schemas/LinkAccessGrant"
        - $ref: "#/components/schemas/PasswordAccessGrant"
      discriminator:
        propertyName: mode
        mapping:
          LINK: "#/components/schemas/LinkAccessGrant"
          TEMPORARY_PASSWORD: "#/components/schemas/PasswordAccessGrant"

    LinkAccessGrant:
      type: object
      required: [mode, activationUrl, expiresAt, emailSent, shareMessage]
      properties:
        mode: { type: string, enum: [LINK] }
        activationUrl: { type: string, description: "Single-use activation link (RN-32)" }
        expiresAt: { type: string, format: date-time }
        emailSent: { type: boolean, description: "true if the access (the link, or the temporary password) was sent to the guest's email (best-effort, RN-19)" }
        shareMessage: { type: string, description: "Spanish text ready to copy or to send by WhatsApp, with the link and the 30-minute notice" }

    PasswordAccessGrant:
      type: object
      required: [mode, temporaryPassword, expiresAt, emailSent, shareMessage]
      properties:
        mode: { type: string, enum: [TEMPORARY_PASSWORD] }
        temporaryPassword: { type: string, description: "Temporary password, valid 30 minutes (RN-32)" }
        expiresAt: { type: string, format: date-time }
        emailSent: { type: boolean, description: "true if the access (the link, or the temporary password) was sent to the guest's email (best-effort, RN-19)" }
        shareMessage: { type: string, description: "Spanish text ready to copy or to send by WhatsApp, with the password and the 30-minute notice" }

    AdministratorInput:
      type: object
      description: Data of the new administrator plus the re-authentication of the creator (RF-22, D-34c)
      required: [documentType, documentNumber, email, currentPassword]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string, minLength: 1, maxLength: 20 }
        email: { type: string, format: email, maxLength: 200, description: "Account email of the new administrator, where the access link goes" }
        currentPassword: { type: string, minLength: 1, maxLength: 128, writeOnly: true, description: "Password of the administrator who creates the account" }

    AdministratorCreated:
      type: object
      required: [id, emailSent]
      properties:
        id: { type: string, format: uuid }
        emailSent: { type: boolean, description: "true if the access link was sent to the new administrator (best-effort)" }

    AdministratorSummary:
      type: object
      description: An administrator in the list (TAR-127)
      required: [id, documentType, documentNumber, email, status, createdAt, self]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber:
          type: string
          description: "Masked: only the last 3 characters are shown, every other one is replaced by `*`"
          example: "*****678"
        email: { type: string, format: email, description: "Account email of the administrator" }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdAt: { type: string, format: date-time }
        self: { type: boolean, description: "true for the account of the session" }

    AdministratorReauthentication:
      type: object
      description: Re-authentication of the administrator who deactivates or reactivates another one (TAR-127)
      required: [currentPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128, writeOnly: true, description: "Password of the administrator who makes the change" }

    AdministratorDeactivationConflictError:
      type: object
      description: The deactivation is refused so that the system keeps at least one active administrator (TAR-127)
      required: [code, message]
      properties:
        code: { type: string, enum: [ADMIN_SELF_DEACTIVATION, LAST_ACTIVE_ADMIN] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    GuestInput:
      type: object
      description: Minimal registration by the administrator (RN-31)
      required: [documentType, documentNumber, type, accessMode]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string, minLength: 1, maxLength: 20 }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        phone: { type: string, maxLength: 30, description: "Optional, to notify the guest" }
        contactEmail: { type: string, format: email, maxLength: 200, description: "Optional: if present the access (the link or the temporary password, depending on accessMode) is also sent by email (RN-19)" }
        accessMode: { $ref: "#/components/schemas/AccessMode" }

    GuestCreated:
      type: object
      description: Answer of a registration that created the guest; it always carries the first access
      required: [guest, alreadyRegistered, access]
      properties:
        guest: { $ref: "#/components/schemas/PendingGuestSummary" }
        alreadyRegistered: { type: boolean, enum: [false] }
        access: { $ref: "#/components/schemas/AccessGrant" }

    NonInactiveGuestSummary:
      type: object
      description: "A guest that is not inactive: what the duplicate-document answer (RN-18) and a successful reactivation (RN-12) return"
      required: [id, documentType, documentNumber, name, type, status, hasLoginAccess]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        status: { type: string, enum: [PENDING_ACTIVATION, ONBOARDING, ACTIVE] }
        hasLoginAccess: { type: boolean }

    PendingGuestSummary:
      type: object
      description: "A guest just created by the administrator: always pending activation (RN-36) and still without a name (RN-31)"
      required: [id, documentType, documentNumber, name, type, status, hasLoginAccess]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, enum: [null], description: "Always null: the guest completes the personal data in the onboarding (RN-31)" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        status: { type: string, enum: [PENDING_ACTIVATION] }
        hasLoginAccess: { type: boolean }

    GuestAlreadyRegistered:
      type: object
      description: Answer when the document was already registered; the guest comes back unmodified and no access is generated (RN-18)
      required: [guest, alreadyRegistered]
      properties:
        guest: { $ref: "#/components/schemas/NonInactiveGuestSummary" }
        alreadyRegistered: { type: boolean, enum: [true] }

    EmergencyContact:
      type: object
      description: Optional, never blocks guest registration (RN-29)
      properties:
        name: { type: string }
        relationship: { type: string }
        phone: { type: string }

    GuestUpdateInput:
      type: object
      description: >
        What the administrator may change: the document, only while the guest
        is pending activation (RN-36). The stays of a temporary guest are managed
        through `/admin/guests/{id}/stays` (RN-13, RN-17). Personal and contact
        data are the guest's alone (RN-17).
      minProperties: 1
      additionalProperties: false
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string, minLength: 1, maxLength: 20 }

    PersonalDataInput:
      type: object
      description: Personal data step of the onboarding (RN-33)
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        contactEmail: { type: string, format: email, maxLength: 200, description: "Optional; without it the password can only be recovered through the administrator (RF-16, RF-17)" }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }

    ProfileUpdateInput:
      type: object
      description: >
        The guest edits their own data; every field is optional and an absent field
        keeps its value (RN-17). The document, the contract and the stays are not
        editable here.
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        contactEmail: { type: string, format: email, maxLength: 200 }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }

    ConsentInput:
      type: object
      required: [accepted, consentVersion]
      properties:
        accepted: { type: boolean, enum: [true], description: "Must be true (RN-14); anything else is answered 400 CONSENT_NOT_ACCEPTED" }
        consentVersion: { type: string, description: "Version of the text being accepted; must be the one in `OnboardingState.consent.version`" }

    GuestSummary:
      type: object
      required: [id, documentType, documentNumber, name, type, status, hasLoginAccess]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        status: { $ref: "#/components/schemas/GuestStatus" }
        hasLoginAccess: { type: boolean }

    OnboardingProgress:
      type: string
      enum: [NOT_STARTED, PASSWORD_SET, PERSONAL_DATA_SAVED, DOCUMENTS_DONE, COMPLETED]
      description: >
        Ordered onboarding progress of a guest (RN-33): the password is chosen,
        then the personal data saved, then the documents step finished or
        skipped, then the consent accepted (COMPLETED, which is what an ACTIVE
        guest always has). One value, so impossible combinations cannot be expressed.

    GuestDetail:
      description: >
        Guest 360 detail. `status` and `onboardingProgress` go together
        (RN-33, RN-36): pending activation has not started, an onboarding
        guest is anywhere before the consent, an active guest is always
        COMPLETED and an inactive one keeps the progress it had.
      oneOf:
        - $ref: "#/components/schemas/PendingGuestDetail"
        - $ref: "#/components/schemas/OnboardingGuestDetail"
        - $ref: "#/components/schemas/OnboardingPersonalDataSavedGuestDetail"
        - $ref: "#/components/schemas/ActiveGuestDetail"
        - $ref: "#/components/schemas/InactiveGuestDetail"

    PendingGuestDetail:
      type: object
      required: [id, documentType, documentNumber, name, type, hasLoginAccess, documentCount, paymentHistory, status, onboardingProgress]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        hasLoginAccess: { type: boolean }
        phone: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }
        stayStartDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        stayEndDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        agreedAmount: { type: number, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        documentCount: { type: integer, minimum: 0, maximum: 5 }
        accessExpiresAt: { type: string, format: date-time, nullable: true, description: "Expiry of the current unused access, if there is one" }
        contract: { $ref: "#/components/schemas/Contract" }
        paymentHistory:
          type: array
          items: { $ref: "#/components/schemas/PaymentSummary" }
        status: { type: string, enum: [PENDING_ACTIVATION] }
        onboardingProgress: { type: string, enum: [NOT_STARTED] }

    OnboardingGuestDetail:
      type: object
      description: "Onboarding guest whose personal data is not saved yet (the name and phone may be missing)"
      required: [id, documentType, documentNumber, name, type, hasLoginAccess, documentCount, paymentHistory, status, onboardingProgress]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        hasLoginAccess: { type: boolean }
        phone: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }
        stayStartDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        stayEndDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        agreedAmount: { type: number, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        documentCount: { type: integer, minimum: 0, maximum: 5 }
        accessExpiresAt: { type: string, format: date-time, nullable: true, description: "Expiry of the current unused access, if there is one" }
        contract: { $ref: "#/components/schemas/Contract" }
        paymentHistory:
          type: array
          items: { $ref: "#/components/schemas/PaymentSummary" }
        status: { type: string, enum: [ONBOARDING] }
        onboardingProgress: { type: string, enum: [NOT_STARTED, PASSWORD_SET] }

    OnboardingPersonalDataSavedGuestDetail:
      type: object
      description: "Onboarding guest whose personal data is saved, so the name and phone are always there (RN-33)"
      required: [id, documentType, documentNumber, name, type, hasLoginAccess, documentCount, paymentHistory, status, onboardingProgress, phone]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        hasLoginAccess: { type: boolean }
        phone: { type: string }
        contactEmail: { type: string, nullable: true }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }
        stayStartDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        stayEndDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        agreedAmount: { type: number, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        documentCount: { type: integer, minimum: 0, maximum: 5 }
        accessExpiresAt: { type: string, format: date-time, nullable: true, description: "Expiry of the current unused access, if there is one" }
        contract: { $ref: "#/components/schemas/Contract" }
        paymentHistory:
          type: array
          items: { $ref: "#/components/schemas/PaymentSummary" }
        status: { type: string, enum: [ONBOARDING] }
        onboardingProgress: { type: string, enum: [PERSONAL_DATA_SAVED, DOCUMENTS_DONE] }

    ActiveGuestDetail:
      type: object
      description: "Active guest, so the onboarding is complete and the name and phone are always there (RN-33, RN-36)"
      required: [id, documentType, documentNumber, name, type, hasLoginAccess, documentCount, paymentHistory, status, onboardingProgress, phone]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        hasLoginAccess: { type: boolean }
        phone: { type: string }
        contactEmail: { type: string, nullable: true }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }
        stayStartDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        stayEndDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        agreedAmount: { type: number, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        documentCount: { type: integer, minimum: 0, maximum: 5 }
        accessExpiresAt: { type: string, format: date-time, nullable: true, description: "Expiry of the current unused access, if there is one" }
        contract: { $ref: "#/components/schemas/Contract" }
        paymentHistory:
          type: array
          items: { $ref: "#/components/schemas/PaymentSummary" }
        status: { type: string, enum: [ACTIVE] }
        onboardingProgress: { type: string, enum: [COMPLETED] }

    InactiveGuestDetail:
      type: object
      required: [id, documentType, documentNumber, name, type, hasLoginAccess, documentCount, paymentHistory, status, onboardingProgress]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        hasLoginAccess: { type: boolean }
        phone: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }
        stayStartDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        stayEndDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        agreedAmount: { type: number, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        documentCount: { type: integer, minimum: 0, maximum: 5 }
        accessExpiresAt: { type: string, format: date-time, nullable: true, description: "Expiry of the current unused access, if there is one" }
        contract: { $ref: "#/components/schemas/Contract" }
        paymentHistory:
          type: array
          items: { $ref: "#/components/schemas/PaymentSummary" }
        status: { type: string, enum: [INACTIVE] }
        onboardingProgress: { $ref: "#/components/schemas/OnboardingProgress" }

    GuestDocumentRef:
      type: object
      description: "A document as the guest sees it, without a link: only the administrator can open the file (RN-37)"
      required: [id, originalName, contentType, sizeBytes, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        uploadedAt: { type: string, format: date-time }

    GuestDocument:
      type: object
      description: "A document as the administrator sees it: with a short-lived signed link (RN-37)"
      required: [id, originalName, contentType, sizeBytes, uploadedAt, url, urlExpiresAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        uploadedAt: { type: string, format: date-time }
        url: { type: string, description: "R2 signed URL, expires 5 minutes after the response (RN-37)" }
        urlExpiresAt: { type: string, format: date-time }

    DocumentActionReason:
      type: string
      enum: [ARCO_REQUEST, UPLOAD_ERROR]
      description: "Why an administrator deleted or replaced a document: an ARCO request of the holder or an upload error (RN-37)"

    DocumentRequestChannel:
      type: string
      enum: [WHATSAPP, EMAIL, IN_PERSON, OTHER]
      description: Channel through which the holder made the ARCO request

    DocumentRequestedAt:
      type: string
      format: date
      description: >
        Date the holder made the ARCO request, on or before today (America/Lima).
        Required with `ARCO_REQUEST`; not allowed with `UPLOAD_ERROR`

    DocumentActionNote:
      type: string
      maxLength: 500
      description: >
        Only a reference (ticket or channel); no personal data of the holder. It
        is never logged. Empty or whitespace only counts as absent (stored as null)

    DocumentActionRequest:
      type: object
      description: >
        Why a document is deleted or replaced (RN-37). OpenAPI 3.0 cannot express
        the conditions, so they are listed here; each one broken is a 400
        `VALIDATION_ERROR` with its `field`. With `ARCO_REQUEST`, `requestedAt`
        and `requestChannel` are both required. With `UPLOAD_ERROR`, neither may
        be sent. `requestedAt` is on or before today (America/Lima). An empty or
        whitespace-only `note` counts as null.
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/DocumentActionReason" }
        requestedAt: { $ref: "#/components/schemas/DocumentRequestedAt" }
        requestChannel: { $ref: "#/components/schemas/DocumentRequestChannel" }
        note: { $ref: "#/components/schemas/DocumentActionNote" }

    GuestDocumentAction:
      type: object
      description: >
        Evidence of one deletion or replacement of a guest document (RN-37). Never
        carries the file name, the storage key or the content.
      required: [id, action, documentId, replacementDocumentId, reason, requestedAt, requestChannel, note, contentType, sizeBytes, actorId, performedAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [DELETE, REPLACE] }
        documentId: { type: string, format: uuid, description: "The document deleted or replaced" }
        replacementDocumentId: { type: string, format: uuid, nullable: true, description: "The new document of a REPLACE; null for a DELETE" }
        reason: { $ref: "#/components/schemas/DocumentActionReason" }
        requestedAt: { type: string, format: date, nullable: true, description: "Date the holder made the request; null for UPLOAD_ERROR" }
        requestChannel: { type: string, nullable: true, enum: [WHATSAPP, EMAIL, IN_PERSON, OTHER, null], description: "null for UPLOAD_ERROR" }
        note: { type: string, nullable: true, maxLength: 500, description: "Only a reference (ticket or channel); null when absent or blank" }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf], description: "Type of the deleted or replaced file" }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880, description: "Size of the deleted or replaced file" }
        actorId: { type: string, format: uuid, description: "The administrator who performed the action" }
        performedAt: { type: string, format: date-time }

    PagedGuestDocumentActions:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/GuestDocumentAction" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    OnboardingState:
      description: >
        Onboarding state. While the guest is in onboarding `nextStep` names the
        step to go to; once active there is no `nextStep` (RN-33, RN-36).
      oneOf:
        - $ref: "#/components/schemas/OnboardingInProgress"
        - $ref: "#/components/schemas/OnboardingCompleted"

    OnboardingInProgress:
      description: >
        Onboarding still open (the password is already chosen). Before the personal
        data step is saved the data is not there yet; from the documents step on it
        is always returned.
      oneOf:
        - $ref: "#/components/schemas/OnboardingPersonalDataPending"
        - $ref: "#/components/schemas/OnboardingDocumentsPending"
        - $ref: "#/components/schemas/OnboardingConsentPending"

    OnboardingPersonalDataPending:
      type: object
      required: [status, nextStep, documents, consent]
      properties:
        status: { type: string, enum: [ONBOARDING] }
        nextStep: { type: string, enum: [PERSONAL_DATA], description: "The password step is already done: a guest that still must change its temporary password cannot reach the onboarding operations (RF-12)" }
        documents:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/PendingConsentState" }

    OnboardingDocumentsPending:
      type: object
      description: "Personal data saved; the optional documents step is next (the answer of saving the personal data)"
      required: [status, nextStep, personalData, documents, consent]
      properties:
        status: { type: string, enum: [ONBOARDING] }
        nextStep: { type: string, enum: [DOCUMENTS] }
        personalData: { $ref: "#/components/schemas/PersonalDataInput" }
        documents:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/PendingConsentState" }

    OnboardingConsentPending:
      type: object
      description: "Documents step finished or skipped; only the consent is left (the answer of finishing the documents step)"
      required: [status, nextStep, personalData, documents, consent]
      properties:
        status: { type: string, enum: [ONBOARDING] }
        nextStep: { type: string, enum: [CONSENT] }
        personalData: { $ref: "#/components/schemas/PersonalDataInput" }
        documents:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/PendingConsentState" }

    OnboardingCompleted:
      type: object
      required: [status, personalData, documents, consent]
      properties:
        status: { type: string, enum: [ACTIVE] }
        personalData: { $ref: "#/components/schemas/PersonalDataInput" }
        documents:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/AcceptedConsentState" }

    PendingConsentState:
      type: object
      description: The consent in force, not yet accepted (the guest is still in onboarding)
      required: [version, text, accepted]
      properties:
        version: { type: string }
        text: { type: string, description: "Consent text in force, in Spanish" }
        accepted: { type: boolean, enum: [false] }

    AcceptedConsentState:
      type: object
      description: The consent the guest accepted, which is what completes the onboarding (RN-14, RN-36)
      required: [version, text, accepted]
      properties:
        version: { type: string }
        text: { type: string, description: "Consent text that was accepted, in Spanish" }
        accepted: { type: boolean, enum: [true] }

    Contract:
      type: object
      required: [id, environmentId, guestId, monthlyAmount, paymentDay, graceDays, startDate, status, fileUrl]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        monthlyAmount: { type: number }
        paymentDay: { type: integer }
        graceDays: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: "null means an open-ended contract (RN-07)" }
        status: { type: string, enum: [ACTIVE, EXPIRED, TERMINATED] }
        fileUrl: { type: string, description: "R2 signed URL, expires in 15 min; signed when the contract is requested, never stored" }

    ContractSummary:
      type: object
      description: A contract in a list, without the signed file URL
      required: [id, environmentId, guestId, monthlyAmount, paymentDay, graceDays, startDate, status, expiringSoon]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        monthlyAmount: { type: number }
        paymentDay: { type: integer }
        graceDays: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: "null means an open-ended contract (RN-07)" }
        status: { type: string, enum: [ACTIVE, EXPIRED, TERMINATED] }
        expiringSoon: { type: boolean, description: "ACTIVE with 30 days or fewer to the end date (RF-09, D-27); false when open-ended" }

    PagedContracts:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/ContractSummary" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    GuestNotContractError:
      type: object
      description: Only a guest of type CONTRACT takes a contract (RN-13). The `code` is always `GUEST_NOT_CONTRACT`
      required: [code, message]
      properties:
        code: { type: string, enum: [GUEST_NOT_CONTRACT] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    FileStorageUnavailableError:
      type: object
      description: The file storage could not store or sign the file. The `code` is always `FILE_STORAGE_UNAVAILABLE`
      required: [code, message]
      properties:
        code: { type: string, enum: [FILE_STORAGE_UNAVAILABLE] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    PaymentSummary:
      type: object
      description: A payment without its voucher URL — what lists and the guest's own responses carry
      required: [id, guestId, contractId, stayId, period, amount, status, createdAt]
      oneOf:
        - description: A period of a contract (guest with a contract)
          additionalProperties: true
          properties:
            contractId: { type: string }
            period: { type: string }
            stayId: { type: string, nullable: true, enum: [null] }
        - description: The stay of a temporary guest
          additionalProperties: true
          properties:
            stayId: { type: string }
            contractId: { type: string, nullable: true, enum: [null] }
            period: { type: string, nullable: true, enum: [null] }
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        contractId: { type: string, format: uuid, nullable: true, description: "The contract the period belongs to; null for a temporary guest" }
        stayId: { type: string, format: uuid, nullable: true, description: "The stay a temporary guest paid for; null for a guest with a contract" }
        period: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09", description: "null for a temporary guest (RN-03)" }
        amount: { type: number, description: "Declared amount, in soles" }
        paymentMethod: { type: string, nullable: true, description: "Free text per payment (RN-28)" }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejectionReason: { type: string, nullable: true, description: "Shown to the guest in the app only, never by email (D-34d)" }
        reviewedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    Payment:
      type: object
      description: A payment with its signed voucher URL (admin detail, `getPayment`)
      required: [id, guestId, contractId, stayId, period, amount, status, voucherUrl, createdAt]
      oneOf:
        - description: A period of a contract (guest with a contract)
          additionalProperties: true
          properties:
            contractId: { type: string }
            period: { type: string }
            stayId: { type: string, nullable: true, enum: [null] }
        - description: The stay of a temporary guest
          additionalProperties: true
          properties:
            stayId: { type: string }
            contractId: { type: string, nullable: true, enum: [null] }
            period: { type: string, nullable: true, enum: [null] }
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        contractId: { type: string, format: uuid, nullable: true }
        stayId: { type: string, format: uuid, nullable: true }
        period: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        amount: { type: number, description: "Declared amount, in soles" }
        paymentMethod: { type: string, nullable: true, description: "Free text per payment (RN-28)" }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejectionReason: { type: string, nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        voucherUrl: { type: string, description: "R2 signed URL, expires in 15 min; signed when the payment is requested, never stored — every payment has a voucher, no exceptions (RN-22, includes admin-direct payments per RN-23)" }
        createdAt: { type: string, format: date-time }

    PagedPayments:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/PaymentSummary" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    PaymentQueueItem:
      type: object
      description: A row of the review queue (A5); it does not show the amount
      required: [id, guestId, guestName, documentNumber, guestType, environmentCode, period, status, createdAt]
      oneOf:
        - description: A guest with a contract, with its environment and period
          additionalProperties: true
          properties:
            guestType: { type: string, enum: [CONTRACT] }
            environmentCode: { type: string }
            period: { type: string }
        - description: A temporary guest, with no environment and no period (shown as Temporal)
          additionalProperties: true
          properties:
            guestType: { type: string, enum: [TEMPORARY] }
            environmentCode: { type: string, nullable: true, enum: [null] }
            period: { type: string, nullable: true, enum: [null] }
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        guestName: { type: string, nullable: true, description: "null while the guest has not given a name in the onboarding" }
        documentNumber: { type: string }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        environmentCode: { type: string, nullable: true, description: "null for a temporary guest (shown as Temporal)" }
        period: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        createdAt: { type: string, format: date-time, description: "When the voucher was uploaded" }

    PagedPaymentQueue:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/PaymentQueueItem" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    PeriodStatus:
      type: object
      required: [period, status, dueDate, amount, contractId]
      properties:
        period: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        status: { type: string, enum: [PAID, UNDER_REVIEW, UNPAID, OVERDUE] }
        dueDate: { type: string, format: date, description: "Payment day of the month, or its last day when the month is shorter (RN-10); the grace days come on top" }
        amount: { type: number, description: "Monthly amount of the contract" }
        contractId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid, nullable: true, description: "The live or last payment of the period, if any" }
        rejectionReason: { type: string, nullable: true, description: "Reason of the last rejected voucher while no other payment is alive (D-34d); a rejected period stays UNPAID or OVERDUE" }

    StayPaymentStatus:
      type: object
      description: Payment status of one stay of a temporary guest (CU-21)
      required: [stayId, startDate, endDate, status, agreedAmount]
      properties:
        stayId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [PAID, UNDER_REVIEW, UNPAID, OVERDUE], description: "OVERDUE once the exit date has passed without an approved payment" }
        agreedAmount: { type: number }
        paymentId: { type: string, format: uuid, nullable: true }
        rejectionReason: { type: string, nullable: true }

    VoucherAlreadyExistsError:
      type: object
      description: A voucher is already pending for the period or the stay (RN-15, RN-03). The `code` is always `VOUCHER_ALREADY_EXISTS`
      required: [code, message]
      properties:
        code: { type: string, enum: [VOUCHER_ALREADY_EXISTS] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    PaymentAlreadyExistsForPeriodError:
      type: object
      description: The period or the stay already has an approved payment (RN-02, D-28). The `code` is always `PAYMENT_ALREADY_EXISTS_FOR_PERIOD`
      required: [code, message]
      properties:
        code: { type: string, enum: [PAYMENT_ALREADY_EXISTS_FOR_PERIOD] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    PaymentAlreadyResolvedError:
      type: object
      description: Another process resolved the payment first. The `code` is always `PAYMENT_ALREADY_RESOLVED`
      required: [code, message]
      properties:
        code: { type: string, enum: [PAYMENT_ALREADY_RESOLVED] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    PaymentPeriodNotPayableError:
      type: object
      description: >
        The payment's period is no longer charged by the contract (it was terminated or expired
        before the approval), so it cannot be approved. The payment stays pending and can only be
        rejected with a reason. The `code` is always `PAYMENT_PERIOD_NOT_PAYABLE`
      required: [code, message]
      properties:
        code: { type: string, enum: [PAYMENT_PERIOD_NOT_PAYABLE] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    ExpenseInput:
      type: object
      required: [category, amount, month]
      properties:
        category: { type: string, enum: [UTILITIES, MAINTENANCE, CLEANING_SUPPLIES, TAXES_FEES], description: "UTILITIES: electricity, water, internet. MAINTENANCE: maintenance and repairs. CLEANING_SUPPLIES: cleaning and supplies. TAXES_FEES: taxes and fees (D-26)" }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09", description: "Month the expense belongs to" }
        description: { type: string, maxLength: 500, description: "Optional; blank means none" }

    FineInput:
      type: object
      required: [guestId, amount, month]
      properties:
        guestId: { type: string, format: uuid, description: "Any existing guest, active or inactive" }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09", description: "Month the fine counts as income (RN-30)" }
        description: { type: string, maxLength: 500, description: "Optional; blank means none" }

    Fine:
      type: object
      description: A fine as the BFF answers it; the fields of `FineInput`, with the same constraints, plus its `id`. The description is left out when there is none.
      required: [id, guestId, amount, month]
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        description: { type: string, maxLength: 500 }

    Expense:
      type: object
      description: An expense as the BFF answers it; the fields of `ExpenseInput`, with the same constraints, plus its `id`. The description is left out when there is none.
      required: [id, category, amount, month]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [UTILITIES, MAINTENANCE, CLEANING_SUPPLIES, TAXES_FEES], description: "UTILITIES: electricity, water, internet. MAINTENANCE: maintenance and repairs. CLEANING_SUPPLIES: cleaning and supplies. TAXES_FEES: taxes and fees (D-26)" }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        description: { type: string, maxLength: 500 }
