        "409":
          description: "`DOCUMENT_LIMIT_REACHED` (the guest already has 5 files, RN-37)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionToken
      description: JWT in an HttpOnly cookie, SameSite=Lax; Secure — same site, because Vercel rewrites /bff/* to the backend (RF-08). OpenAPI 3.0 only allows empty scope lists for this scheme, so the role that may call each operation is declared with the `x-roles` extension (ADMIN or GUEST); an operation without it accepts any authenticated session.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StayId:
      name: stayId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Limit:
      name: limit
      in: query
      description: Items per page, from 1 to 100. A value out of range is a 400
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    After:
      name: after
      in: query
      description: >
        Opaque cursor: the `nextCursor` of the previous page. Absent for the
        first page. Do not build or edit it; a cursor that is not valid is a 400.
        Keyset pagination: the list keeps its order and the page starts right
        after the last item seen, so it costs the same on any page.
      schema: { type: string, minLength: 1, maxLength: 512 }

  headers:
    Location:
      description: Absolute path of the created resource, with its masked id (RFC 9110, 201 Created)
      required: true
      schema: { type: string }

  responses:
    ValidationFailed:
      description: Invalid input data
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: >
        The session is valid but its role cannot use the operation (RN-08, RN-09). On the
        multipart uploads it is also returned when the request carries neither an `Origin`
        header nor `Sec-Fetch-Site: same-origin` (ADR-006). The `code` is always `AUTH_FORBIDDEN`
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_FORBIDDEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    EnvironmentCodeTaken:
      description: Another environment already has that code (RF-01). The `code` is always `ENVIRONMENT_CODE_TAKEN` and `field` is always `code`
      content:
        application/json:
          schema:
            type: object
            required: [code, message, field]
            properties:
              code: { type: string, enum: [ENVIRONMENT_CODE_TAKEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
              field: { type: string, enum: [code] }
    ConcurrentModification:
      description: >
        Two edits of the same record collided (optimistic locking, BE-SPR-DAT-13):
        the record changed after the client loaded it. The client reloads the
        record and retries. The `code` is always `CONCURRENT_MODIFICATION`.
        Applies to environments, guests and expenses
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ConcurrentModificationError" }
          example:
            code: CONCURRENT_MODIFICATION
            message: El registro cambió mientras lo editabas; vuelve a cargarlo e inténtalo de nuevo
    NoSession:
      description: No active session
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidCredentials:
      description: Incorrect document or password
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PasswordChangeRequired:
      description: >
        The session must change its password first (RF-12). Any endpoint except
        login and change-password answers `AUTH_PASSWORD_CHANGE_REQUIRED` until it does.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountDisabled:
      description: Account disabled (RN-12)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    AccountLocked:
      description: >
        Account temporarily locked after 5 consecutive failed logins (SEG-06): the lock lasts
        15 minutes, expires by itself and is lifted by a password reset (RF-16). The `code` is
        always `AUTH_ACCOUNT_LOCKED`. The `Retry-After` header gives the seconds left, which is
        what the client counts down from (so a wrong clock on the device cannot skew it), and
        `lockedUntil` the instant the lock ends, to show the time of day
      headers:
        Retry-After:
          description: Seconds until the account can try again, rounded up (at least 1)
          required: true
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema:
            type: object
            required: [code, message, lockedUntil]
            properties:
              code: { type: string, enum: [AUTH_ACCOUNT_LOCKED] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
              lockedUntil: { type: string, format: date-time, description: "UTC instant at which the lock ends; the UI shows it in America/Lima" }
    TooManyRequests:
      description: "Rate limit exceeded (SEC-01) — retry after the window in the `Retry-After` header"
      headers:
        Retry-After:
          description: Seconds until the client may retry
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    OriginCheckForbidden:
      description: >
        `AUTH_FORBIDDEN`: the session is not an administrator (RN-08), or the request
        carries neither an `Origin` header nor `Sec-Fetch-Site: same-origin`, or they
        name another site (ADR-006). `replaceGuestDocument` is one route of the
        exact set of multipart routes under that check: `createContract`,
        `createDirectPayment`, `uploadPaymentVoucher`, `uploadOnboardingDocument`,
        `uploadTemporaryVoucher`, `uploadOwnDocument`, `uploadTemporaryOwnDocument`, `replaceGuestDocument`, and the corrections of a payment
        (TAR-239): `correctPaymentByAdmin`, `correctOwnPayment` and `correctOwnPaymentTemporary`. `deleteGuestDocument`
        is the only JSON route under the same check, because it deletes personal
        data irreversibly
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_FORBIDDEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    AdministratorNotFound:
      description: >-
        The id does not exist or is not an ADMIN account (`ADMIN_NOT_FOUND`); both cases answer the
        same `message`
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [ADMIN_NOT_FOUND] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
          example:
            code: ADMIN_NOT_FOUND
            message: El administrador no existe
    GuestDocumentNotFound:
      description: >
        The guest does not exist, the document does not belong to that guest, or a
        concurrent action on the same document won (`RESOURCE_NOT_FOUND`; for a
        deletion, only a replacement that won: an already deleted document is a 204). A single
        lookup by `(guest_id, id)` answers all cases with the same `message`, so the
        response does not reveal whether the guest or the document exists
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    FileStorageUnavailable:
      description: "The file storage (R2) is not configured or failed; nothing was saved — retry later (`FILE_STORAGE_UNAVAILABLE`)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FileStorageUnavailableError" }
    GuestInactive:
      description: >
        The guest is inactive (RN-12, RN-18). The `code` is always
        `GUEST_INACTIVE` and `guestId` lets the administrator reactivate it
        right from the notice (`POST /admin/guests/{id}/reactivate`, CU-28)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GuestInactiveError" }
    OnboardingAccessDenied:
      description: >
        A guest session that cannot use the onboarding operation. The `code` is
        `AUTH_PASSWORD_CHANGE_REQUIRED` while a temporary password has not been
        changed (RF-12) or `AUTH_FORBIDDEN` for the administrator. Never
        `AUTH_ONBOARDING_REQUIRED`: these are the routes an incomplete guest must reach. On the multipart upload, `AUTH_FORBIDDEN` is also returned when the request carries neither an `Origin` header nor `Sec-Fetch-Site: same-origin` (ADR-006)
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    GuestAccessDenied:
      description: >
        The guest session cannot use the operation yet or at all. The `code` is
        `AUTH_ONBOARDING_REQUIRED` while the onboarding is incomplete (RN-33: the
        client redirects to the first pending step, `nextStep` of `GET
        /guest/onboarding`), `AUTH_PASSWORD_CHANGE_REQUIRED` while a temporary
        password has not been changed (RF-12) and `AUTH_FORBIDDEN` for a guest
        of the other type (a CONTRACT guest on `/temporary-guest/**` or the
        reverse, RN-09)
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string, enum: [AUTH_ONBOARDING_REQUIRED, AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
              message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
    OnboardingConflict:
      description: >
        `ONBOARDING_STEP_OUT_OF_ORDER` (a step was attempted before its
        predecessor, RN-33) or `ONBOARDING_ALREADY_COMPLETED` (the guest is
        already active: use the profile endpoint)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/OnboardingConflictError" }
    GuestEmailTaken:
      description: >
        The contact email already belongs to another guest (D-33). The `code` is always
        `GUEST_EMAIL_TAKEN` and `field` is `contactEmail`
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GuestEmailTakenError" }
  schemas:
    PagedEnvironments:
      type: object
      required: [content, nextCursor, freeCount]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Environment" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
        freeCount: { type: integer, minimum: 0, description: "Active environments free today and with nothing coming, across all pages (the A2 notice)" }

    PagedGuests:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/GuestSummary" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    PagedExpenses:
      type: object
      required: [content, nextCursor, totalCount]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Expense" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
        totalCount: { type: integer, minimum: 0, description: "Expenses of the month, for «Mostrando X de Y» (A6, TAR-240)" }

    NextCursor:
      type: string
      nullable: true
      description: Value for `after` to get the next page; `null` when this is the last one

    Error:
      type: object
      description: >
        BFF error shape — plain JSON, distinct from RFC 7807 (that is
        exclusive to the internal Core API, see SRS chapter "10 - APIs e
        Integraciones"). `code` is a stable English constant read by the
        frontend; `message` is the Spanish text shown to the end user.
      required: [code, message]
      properties:
        code: { type: string, description: "Stable error code, e.g. VOUCHER_ALREADY_EXISTS" }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        field: { type: string, description: "Field name if this is a validation error" }

    ConcurrentModificationError:
      type: object
      description: Optimistic-locking conflict (BE-SPR-DAT-13). The `code` is always `CONCURRENT_MODIFICATION`
      required: [code, message]
      properties:
        code: { type: string, enum: [CONCURRENT_MODIFICATION] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    EnvironmentInactiveError:
      type: object
      description: The environment is inactive and takes no new contract (RF-01). The `code` is always `ENVIRONMENT_INACTIVE`
      required: [code, message]
      properties:
        code: { type: string, enum: [ENVIRONMENT_INACTIVE] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    EnvironmentOccupiedError:
      type: object
      description: >
        The environment is occupied in those dates by a contract in force or a stay, now or later
        (RN-12, RN-20, TAR-237). `occupant` says by whom, for the dialog and its link. The `code`
        is always `ENVIRONMENT_OCCUPIED`
      required: [code, message]
      properties:
        code: { type: string, enum: [ENVIRONMENT_OCCUPIED] }
        occupant: { $ref: "#/components/schemas/Occupant" }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    GuestInactiveError:
      type: object
      description: The guest is inactive (RN-12, RN-18). The `guestId` lets the administrator reactivate it
      required: [code, message, guestId]
      properties:
        code: { type: string, enum: [GUEST_INACTIVE] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        guestId: { type: string, format: uuid }

    OnboardingConflictError:
      type: object
      description: A step was attempted out of order, or the onboarding is already complete (RN-33)
      required: [code, message]
      properties:
        code: { type: string, enum: [ONBOARDING_STEP_OUT_OF_ORDER, ONBOARDING_ALREADY_COMPLETED] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    GuestNotActiveError:
      type: object
      description: The guest is not active, so it cannot take a new contract or payment (RN-35)
      required: [code, message, guestId]
      properties:
        code: { type: string, enum: [GUEST_NOT_ACTIVE] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        guestId: { type: string, format: uuid }

    GuestDocumentTakenError:
      type: object
      description: The document already belongs to another guest or to an administrator account (RN-18, D-34e)
      required: [code, message, field]
      properties:
        code: { type: string, enum: [GUEST_DOCUMENT_TAKEN] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        field: { type: string }

    AccountEmailTakenError:
      type: object
      description: The email is already the account email of another account, administrator or guest (a guest contact email is not an account email, D-33)
      required: [code, message, field]
      properties:
        code: { type: string, enum: [ACCOUNT_EMAIL_TAKEN] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        field: { type: string, enum: [contactEmail, email] }

    GuestEmailTakenError:
      type: object
      description: The contact email already belongs to another guest (D-33); the account email is independent
      required: [code, message, field]
      properties:
        code: { type: string, enum: [GUEST_EMAIL_TAKEN] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        field: { type: string, enum: [contactEmail] }

    GuestHasActiveContractError:
      type: object
      description: The guest has a contract in force, so it cannot be deactivated (RN-12). Debt does not block it
      required: [code, message, contractId]
      properties:
        code: { type: string, enum: [GUEST_HAS_ACTIVE_CONTRACT] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        contractId: { type: string, format: uuid, description: "The contract in force, so the UI can link to it" }

    GuestHasPendingDebtError:
      type: object
      description: The guest owes periods (RN-25), so it cannot take a new contract or be reactivated until they are paid (RN-35)
      required: [code, message, periods]
      properties:
        code: { type: string, enum: [GUEST_HAS_PENDING_DEBT] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        periods:
          type: array
          minItems: 1
          description: The periods owed, oldest first, so the UI can list them and offer the direct payment (RN-23)
          items: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        debts:
          type: array
          description: Everything owed with its amount, oldest first, including the unpaid stays of a temporary guest (TAR-237)
          items:
            type: object
            required: [period, stayId, stayStartDate, stayEndDate, amountDue]
            properties:
              period: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
              stayId: { type: string, format: uuid, nullable: true }
              stayStartDate: { type: string, format: date, nullable: true }
              stayEndDate: { type: string, format: date, nullable: true }
              amountDue: { type: number }

    Stay:
      type: object
      description: >
        One visit of a temporary guest (RN-13); the stay of a guest is never edited into a new one,
        a new visit is a new row. It occupies its environment during its dates like a contract
        (RN-20, TAR-237); stays registered before carry no environment
      required: [id, environmentId, environmentCode, startDate, endDate, agreedAmount, paymentStatus, paymentId]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid, nullable: true, description: "null for a stay registered before TAR-237 («Sin ambiente»)" }
        environmentCode: { type: string, nullable: true }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: "On or after startDate" }
        agreedAmount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
        paymentStatus: { type: string, enum: [PAID, UNDER_REVIEW, UNPAID, OVERDUE], description: "As in StayPaymentStatus: OVERDUE once the exit date passed without an approved payment (A3.2)" }
        paymentId: { type: string, format: uuid, nullable: true, description: "Its payment, if any" }

    StayInput:
      type: object
      required: [environmentId, startDate, endDate, agreedAmount]
      properties:
        environmentId: { type: string, format: uuid, description: "An active environment free for the whole stay (RN-20, TAR-237); see listEnvironments with freeFrom and freeTo" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, description: "On or after startDate" }
        agreedAmount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }

    StayUpdateInput:
      type: object
      description: At least one field; the resulting dates must stay valid and may not overlap another stay of the guest
      minProperties: 1
      additionalProperties: false
      properties:
        environmentId: { type: string, format: uuid, description: "Moves the stay to another free environment (RN-20)" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        agreedAmount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "Can be corrected even when the stay has a payment: the review compares with the new amount (decided 2026-10-30)" }

    PagedStays:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Stay" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    StayOverlapError:
      type: object
      description: The dates cross another stay of the same guest. The `code` is always `STAY_OVERLAP`
      required: [code, message]
      properties:
        code: { type: string, enum: [STAY_OVERLAP] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    GuestNotTemporaryError:
      type: object
      description: Only temporary guests have stays (RN-13). The `code` is always `GUEST_NOT_TEMPORARY`
      required: [code, message]
      properties:
        code: { type: string, enum: [GUEST_NOT_TEMPORARY] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    DocumentType:
      type: string
      enum: [DNI, CE, PASSPORT]
      description: "DNI (national ID, 8 digits), CE (Carné de Extranjería), PASSPORT (foreign visitors without CE)"

    Environment:
      type: object
      required: [id, code, type, status, occupant, nextOccupant, freeSince]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        type: { type: string, enum: [ROOM, CABIN] }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        occupant: { type: object, allOf: [{ $ref: "#/components/schemas/Occupant" }], nullable: true, description: "Who occupies it today; null when free (derived from contracts and stays, RN-20)" }
        nextOccupant: { type: object, allOf: [{ $ref: "#/components/schemas/Occupant" }], nullable: true, description: "A contract or a stay that starts after today; with occupant null, A2 shows «Libre hasta <startDate>»" }
        freeSince: { type: string, format: date, nullable: true, description: "When it became free (end of the last contract or stay, or the creation of the environment); null when occupied" }
        deactivatedAt: { type: string, format: date-time, nullable: true, description: "When it was deactivated; null when active" }

    Occupant:
      type: object
      description: A contract or a stay that occupies an environment (RN-20, TAR-237)
      required: [kind, guestId, guestName, contractId, stayId, startDate, endDate]
      properties:
        kind: { type: string, enum: [CONTRACT, STAY] }
        guestId: { type: string, format: uuid }
        guestName: { type: string, nullable: true }
        contractId: { type: string, format: uuid, nullable: true, description: "Set when kind=CONTRACT («Ver contrato vigente»)" }
        stayId: { type: string, format: uuid, nullable: true, description: "Set when kind=STAY («Ver huésped»)" }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: "null for a contract without end date" }

    EnvironmentRef:
      type: object
      description: The environment a guest occupies, with its validity (A3 column Ambiente)
      required: [code, type, kind, startDate, endDate]
      properties:
        code: { type: string }
        type: { type: string, enum: [ROOM, CABIN] }
        kind: { type: string, enum: [CONTRACT, STAY] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }

    SessionInfo:
      description: >
        Session data answered by login, link activation and `GET /auth/me`,
        in one of four shapes: the administrator, a guest that must still set its
        password (temporary password), a guest in onboarding with the password already
        set (with the step to go to) or an active guest. `name` is the guest's name;
        while the guest has not completed the personal data step it is the
        document in text (for example "DNI 12345678") so the field is always there.
      oneOf:
        - $ref: "#/components/schemas/AdminSession"
        - $ref: "#/components/schemas/GuestPasswordPendingSession"
        - $ref: "#/components/schemas/GuestOnboardingSession"
        - $ref: "#/components/schemas/GuestActiveSession"

    AdminSession:
      type: object
      required: [role, name, mustChangePassword]
      properties:
        role: { type: string, enum: [ADMIN] }
        name: { type: string }
        mustChangePassword: { type: boolean, description: "true until the administrator changes a temporary password (RF-12)" }

    GuestPasswordPendingSession:
      type: object
      description: A guest that logged in with a temporary password and must choose its own first (RF-12, RN-33)
      required: [role, guestType, name, mustChangePassword, guestStatus, nextOnboardingStep]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [true] }
        guestStatus: { type: string, enum: [ONBOARDING] }
        nextOnboardingStep: { type: string, enum: [PASSWORD] }

    GuestOnboardingSession:
      type: object
      description: A guest whose password is set and whose onboarding still has steps left (RN-33)
      required: [role, guestType, name, mustChangePassword, guestStatus, nextOnboardingStep]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [false] }
        guestStatus: { type: string, enum: [ONBOARDING] }
        nextOnboardingStep: { type: string, enum: [PERSONAL_DATA, DOCUMENTS, CONSENT], description: "First pending step, in the order of RN-33" }

    GuestActiveSession:
      type: object
      description: A guest that completed the onboarding (RN-36)
      required: [role, guestType, name, mustChangePassword, guestStatus]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, description: "true while a temporary password has not been changed (RF-12)" }
        guestStatus: { type: string, enum: [ACTIVE] }

    ActivatedOnboardingSession:
      type: object
      description: A guest that has just set its password through the activation link and still has onboarding steps left
      required: [role, guestType, name, mustChangePassword, guestStatus, nextOnboardingStep]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [false] }
        guestStatus: { type: string, enum: [ONBOARDING] }
        nextOnboardingStep: { type: string, enum: [PERSONAL_DATA, DOCUMENTS, CONSENT] }

    ActivatedActiveSession:
      type: object
      description: An already active guest that recovered its access with a new link
      required: [role, guestType, name, mustChangePassword, guestStatus]
      properties:
        role: { type: string, enum: [GUEST] }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        name: { type: string }
        mustChangePassword: { type: boolean, enum: [false] }
        guestStatus: { type: string, enum: [ACTIVE] }

    GuestStatus:
      type: string
      enum: [PENDING_ACTIVATION, ONBOARDING, ACTIVE, INACTIVE]
      description: "Guest lifecycle (RN-36). Inactive is reversible (RN-12)"

    AccessMode:
      type: string
      enum: [LINK, TEMPORARY_PASSWORD]
      description: "How the administrator delivers the access: an activation link or a temporary password (RN-32)"

    AccessGrant:
      description: >
        An access generated by the administrator. Valid 30 minutes and single
        use (RN-32). The secret is given only here, in clear, and cannot be
        read again, so each mode requires its own secret: `activationUrl` for
        LINK, `temporaryPassword` for TEMPORARY_PASSWORD.
      oneOf:
        - $ref: "#/components/schemas/LinkAccessGrant"
        - $ref: "#/components/schemas/PasswordAccessGrant"
      discriminator:
        propertyName: mode
        mapping:
          LINK: "#/components/schemas/LinkAccessGrant"
          TEMPORARY_PASSWORD: "#/components/schemas/PasswordAccessGrant"

    LinkAccessGrant:
      type: object
      required: [mode, activationUrl, expiresAt, emailSent, shareMessage]
      properties:
        mode: { type: string, enum: [LINK] }
        activationUrl: { type: string, description: "Single-use activation link (RN-32)" }
        expiresAt: { type: string, format: date-time }
        emailSent: { type: boolean, description: "true if the access (the link, or the temporary password) was sent to the guest's email (best-effort, RN-19)" }
        shareMessage: { type: string, description: "Spanish text ready to copy or to send by WhatsApp, with the link and the 30-minute notice" }

    PasswordAccessGrant:
      type: object
      required: [mode, temporaryPassword, expiresAt, emailSent, shareMessage]
      properties:
        mode: { type: string, enum: [TEMPORARY_PASSWORD] }
        temporaryPassword: { type: string, description: "Temporary password, valid 30 minutes (RN-32)" }
        expiresAt: { type: string, format: date-time }
        emailSent: { type: boolean, description: "true if the access (the link, or the temporary password) was sent to the guest's email (best-effort, RN-19)" }
        shareMessage: { type: string, description: "Spanish text ready to copy or to send by WhatsApp, with the password and the 30-minute notice" }

    AdministratorInput:
      type: object
      description: Data of the new administrator plus the re-authentication of the creator (RF-22, D-34c)
      required: [documentType, documentNumber, email, currentPassword]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string, minLength: 1, maxLength: 20 }
        email: { type: string, format: email, maxLength: 200, description: "Account email of the new administrator, where the access link goes" }
        currentPassword: { type: string, minLength: 1, maxLength: 128, writeOnly: true, description: "Password of the administrator who creates the account" }

    AdministratorCreated:
      type: object
      required: [id, emailSent]
      properties:
        id: { type: string, format: uuid }
        emailSent: { type: boolean, description: "true if the access link was sent to the new administrator (best-effort)" }

    AdministratorSummary:
      type: object
      description: An administrator in the list (TAR-127)
      required: [id, name, documentType, documentNumber, email, status, createdAt, self]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, nullable: true, description: "Full name the administrator wrote when activating the account (A0.5); null while it has not activated it («Sin activar» in A7)" }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber:
          type: string
          description: "Masked: only the last 3 characters are shown, every other one is replaced by `*`"
          example: "*****678"
        email: { type: string, format: email, description: "Account email of the administrator" }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        createdAt: { type: string, format: date-time }
        self: { type: boolean, description: "true for the account of the session" }

    AdministratorReauthentication:
      type: object
      description: Re-authentication of the administrator who deactivates or reactivates another one (TAR-127)
      required: [currentPassword]
      properties:
        currentPassword: { type: string, minLength: 1, maxLength: 128, writeOnly: true, description: "Password of the administrator who makes the change" }

    AdministratorDeactivationConflictError:
      type: object
      description: The deactivation is refused so that the system keeps at least one active administrator (TAR-127)
      required: [code, message]
      properties:
        code: { type: string, enum: [ADMIN_SELF_DEACTIVATION, LAST_ACTIVE_ADMIN] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    GuestInput:
      type: object
      description: Minimal registration by the administrator (RN-31)
      required: [documentType, documentNumber, type, accessMode]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string, minLength: 1, maxLength: 20, pattern: "^[A-Za-z0-9-]{1,20}$", description: "A DNI is exactly 8 digits; a CE or a passport, letters, digits or hyphen. A DNI with another shape is 400 VALIDATION_ERROR with field documentNumber (TAR-237)" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        phone: { type: string, maxLength: 30, pattern: "^\\+?[0-9][0-9 -]{5,28}$", description: "Optional, to notify the guest: digits, spaces and hyphens, with an optional + prefix" }
        contactEmail: { type: string, format: email, maxLength: 200, description: "Optional: if present the access (the link or the temporary password, depending on accessMode) is also sent by email (RN-19)" }
        accessMode: { $ref: "#/components/schemas/AccessMode" }

    GuestCreated:
      type: object
      description: Answer of a registration that created the guest; it always carries the first access
      required: [guest, alreadyRegistered, access]
      properties:
        guest: { $ref: "#/components/schemas/PendingGuestSummary" }
        alreadyRegistered: { type: boolean, enum: [false] }
        access: { $ref: "#/components/schemas/AccessGrant" }

    NonInactiveGuestSummary:
      type: object
      description: "A guest that is not inactive: what the duplicate-document answer (RN-18) and a successful reactivation (RN-12) return"
      required: [id, documentType, documentNumber, name, type, status, hasLoginAccess]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        status: { type: string, enum: [PENDING_ACTIVATION, ONBOARDING, ACTIVE] }
        hasLoginAccess: { type: boolean }

    PendingGuestSummary:
      type: object
      description: "A guest just created by the administrator: always pending activation (RN-36) and still without a name (RN-31)"
      required: [id, documentType, documentNumber, name, type, status, hasLoginAccess]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, enum: [null], description: "Always null: the guest completes the personal data in the onboarding (RN-31)" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        status: { type: string, enum: [PENDING_ACTIVATION] }
        hasLoginAccess: { type: boolean }

    GuestAlreadyRegistered:
      type: object
      description: Answer when the document was already registered; the guest comes back unmodified and no access is generated (RN-18)
      required: [guest, alreadyRegistered]
      properties:
        guest: { $ref: "#/components/schemas/NonInactiveGuestSummary" }
        alreadyRegistered: { type: boolean, enum: [true] }

    EmergencyContact:
      type: object
      description: Optional, never blocks guest registration (RN-29)
      properties:
        name: { type: string }
        relationship: { type: string }
        phone: { type: string }

    GuestUpdateInput:
      type: object
      description: >
        What the administrator may change: the document, only while the guest
        is pending activation (RN-36). The stays of a temporary guest are managed
        through `/admin/guests/{id}/stays` (RN-13, RN-17). Personal and contact
        data are the guest's alone (RN-17).
      minProperties: 1
      additionalProperties: false
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string, minLength: 1, maxLength: 20 }

    PersonalDataInput:
      type: object
      description: Personal data step of the onboarding (RN-33)
      required: [name, phone]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        contactEmail: { type: string, format: email, maxLength: 200, description: "Optional contact email, independent of the account email used to recover the password (D-76, RF-16, A3.9)" }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }

    OwnProfile:
      type: object
      description: The guest's own data for «Mis datos» (H5, T3)
      required: [documentType, documentNumber, name, phone, contactEmail, emergencyContact, accountEmail, documents, documentsLimit]
      properties:
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string }
        phone: { type: string, nullable: true }
        contactEmail: { type: string, format: email, nullable: true }
        emergencyContact: { type: object, nullable: true, allOf: [{ $ref: "#/components/schemas/EmergencyContact" }] }
        accountEmail: { type: string, format: email, nullable: true, description: "Where the password recovery link goes (RF-16); read-only for the guest, the administration changes it (A3.9). Null when it has none" }
        documents: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/GuestDocumentRef" } }
        documentsLimit: { type: integer, minimum: 1, description: "How many documents a guest may have (5, RN-37)" }

    ProfileUpdateInput:
      type: object
      description: >
        The guest edits their own data; every field is optional and an absent field
        keeps its value (RN-17). The document, the contract and the stays are not
        editable here.
      minProperties: 1
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        phone: { type: string, minLength: 1, maxLength: 30 }
        contactEmail: { type: string, format: email, maxLength: 200 }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }

    ConsentInput:
      type: object
      required: [accepted, consentVersion]
      properties:
        accepted: { type: boolean, enum: [true], description: "Must be true (RN-14); anything else is answered 400 CONSENT_NOT_ACCEPTED" }
        consentVersion: { type: string, description: "Version of the text being accepted; must be the one in `OnboardingState.consent.version`" }

    GuestSummary:
      type: object
      required: [id, documentType, documentNumber, name, type, status, hasLoginAccess]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        status: { $ref: "#/components/schemas/GuestStatus" }
        hasLoginAccess: { type: boolean }
        environment: { type: object, allOf: [{ $ref: "#/components/schemas/EnvironmentRef" }], nullable: true, description: "Environment it occupies (contract in force or stay, including a coming one), or the last one for an inactive guest; null without any (A3, TAR-237). Only in the administrator's lists" }

    OnboardingProgress:
      type: string
      enum: [NOT_STARTED, PASSWORD_SET, PERSONAL_DATA_SAVED, DOCUMENTS_DONE, COMPLETED]
      description: >
        Ordered onboarding progress of a guest (RN-33): the password is chosen,
        then the personal data saved, then the documents step finished or
        skipped, then the consent accepted (COMPLETED, which is what an ACTIVE
        guest always has). One value, so impossible combinations cannot be expressed.

    GuestDetail:
      description: >
        Guest 360 detail. `status` and `onboardingProgress` go together
        (RN-33, RN-36): pending activation has not started, an onboarding
        guest is anywhere before the consent, an active guest is always
        COMPLETED and an inactive one keeps the progress it had.
      oneOf:
        - $ref: "#/components/schemas/PendingGuestDetail"
        - $ref: "#/components/schemas/OnboardingGuestDetail"
        - $ref: "#/components/schemas/OnboardingPersonalDataSavedGuestDetail"
        - $ref: "#/components/schemas/ActiveGuestDetail"
        - $ref: "#/components/schemas/InactiveGuestDetail"

    PendingGuestDetail:
      type: object
      required: [id, documentType, documentNumber, name, type, hasLoginAccess, documentCount, paymentHistory, status, onboardingProgress]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        hasLoginAccess: { type: boolean }
        phone: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        accountEmail: { type: string, nullable: true, description: "Email of the account, for the password recovery (A3.9, PUT …/account-email); independent of the contact email (D-76)" }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }
        stayStartDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        stayEndDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        agreedAmount: { type: number, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        documentCount: { type: integer, minimum: 0, maximum: 5 }
        accessExpiresAt: { type: string, format: date-time, nullable: true, description: "Expiry of the current unused access, if there is one" }
        contract: { $ref: "#/components/schemas/Contract" }
        paymentHistory:
          type: array
          items: { $ref: "#/components/schemas/PaymentSummary" }
        status: { type: string, enum: [PENDING_ACTIVATION] }
        onboardingProgress: { type: string, enum: [NOT_STARTED] }

    OnboardingGuestDetail:
      type: object
      description: "Onboarding guest whose personal data is not saved yet (the name and phone may be missing)"
      required: [id, documentType, documentNumber, name, type, hasLoginAccess, documentCount, paymentHistory, status, onboardingProgress]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        hasLoginAccess: { type: boolean }
        phone: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        accountEmail: { type: string, nullable: true, description: "Email of the account, for the password recovery (A3.9, PUT …/account-email); independent of the contact email (D-76)" }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }
        stayStartDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        stayEndDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        agreedAmount: { type: number, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        documentCount: { type: integer, minimum: 0, maximum: 5 }
        accessExpiresAt: { type: string, format: date-time, nullable: true, description: "Expiry of the current unused access, if there is one" }
        contract: { $ref: "#/components/schemas/Contract" }
        paymentHistory:
          type: array
          items: { $ref: "#/components/schemas/PaymentSummary" }
        status: { type: string, enum: [ONBOARDING] }
        onboardingProgress: { type: string, enum: [NOT_STARTED, PASSWORD_SET] }

    OnboardingPersonalDataSavedGuestDetail:
      type: object
      description: "Onboarding guest whose personal data is saved, so the name and phone are always there (RN-33)"
      required: [id, documentType, documentNumber, name, type, hasLoginAccess, documentCount, paymentHistory, status, onboardingProgress, phone]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        hasLoginAccess: { type: boolean }
        phone: { type: string }
        contactEmail: { type: string, nullable: true }
        accountEmail: { type: string, nullable: true, description: "Email of the account, for the password recovery (A3.9, PUT …/account-email); independent of the contact email (D-76)" }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }
        stayStartDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        stayEndDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        agreedAmount: { type: number, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        documentCount: { type: integer, minimum: 0, maximum: 5 }
        accessExpiresAt: { type: string, format: date-time, nullable: true, description: "Expiry of the current unused access, if there is one" }
        contract: { $ref: "#/components/schemas/Contract" }
        paymentHistory:
          type: array
          items: { $ref: "#/components/schemas/PaymentSummary" }
        status: { type: string, enum: [ONBOARDING] }
        onboardingProgress: { type: string, enum: [PERSONAL_DATA_SAVED, DOCUMENTS_DONE] }

    ActiveGuestDetail:
      type: object
      description: "Active guest, so the onboarding is complete and the name and phone are always there (RN-33, RN-36)"
      required: [id, documentType, documentNumber, name, type, hasLoginAccess, documentCount, paymentHistory, status, onboardingProgress, phone]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        hasLoginAccess: { type: boolean }
        phone: { type: string }
        contactEmail: { type: string, nullable: true }
        accountEmail: { type: string, nullable: true, description: "Email of the account, for the password recovery (A3.9, PUT …/account-email); independent of the contact email (D-76)" }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }
        stayStartDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        stayEndDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        agreedAmount: { type: number, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        documentCount: { type: integer, minimum: 0, maximum: 5 }
        accessExpiresAt: { type: string, format: date-time, nullable: true, description: "Expiry of the current unused access, if there is one" }
        contract: { $ref: "#/components/schemas/Contract" }
        paymentHistory:
          type: array
          items: { $ref: "#/components/schemas/PaymentSummary" }
        status: { type: string, enum: [ACTIVE] }
        onboardingProgress: { type: string, enum: [COMPLETED] }

    InactiveGuestDetail:
      type: object
      required: [id, documentType, documentNumber, name, type, hasLoginAccess, documentCount, paymentHistory, status, onboardingProgress]
      properties:
        id: { type: string, format: uuid }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        name: { type: string, nullable: true, description: "null until the guest completes the personal data step" }
        type: { type: string, enum: [CONTRACT, TEMPORARY] }
        hasLoginAccess: { type: boolean }
        phone: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        accountEmail: { type: string, nullable: true, description: "Email of the account, for the password recovery (A3.9, PUT …/account-email); independent of the contact email (D-76)" }
        emergencyContact: { $ref: "#/components/schemas/EmergencyContact" }
        stayStartDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        stayEndDate: { type: string, format: date, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        agreedAmount: { type: number, description: "Deprecated, read-only: taken from the stay in course today, else the next one, else the latest; read the stays at /admin/guests/{id}/stays. Only when type=TEMPORARY", deprecated: true }
        documentCount: { type: integer, minimum: 0, maximum: 5 }
        accessExpiresAt: { type: string, format: date-time, nullable: true, description: "Expiry of the current unused access, if there is one" }
        contract: { $ref: "#/components/schemas/Contract" }
        paymentHistory:
          type: array
          items: { $ref: "#/components/schemas/PaymentSummary" }
        status: { type: string, enum: [INACTIVE] }
        onboardingProgress: { $ref: "#/components/schemas/OnboardingProgress" }
        deactivatedAt: { type: string, format: date-time, nullable: true, description: "When it was deactivated (A3.2 «inactivo desde …», TAR-237)" }

    GuestDocumentRef:
      type: object
      description: "A document as the guest sees it, without a link: only the administrator can open the file (RN-37)"
      required: [id, originalName, contentType, sizeBytes, uploadedAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        uploadedAt: { type: string, format: date-time }

    GuestDocument:
      type: object
      description: "A document as the administrator sees it: with a short-lived signed link (RN-37)"
      required: [id, originalName, contentType, sizeBytes, uploadedAt, url, urlExpiresAt]
      properties:
        id: { type: string, format: uuid }
        originalName: { type: string }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880 }
        uploadedAt: { type: string, format: date-time }
        url: { type: string, description: "R2 signed URL, expires 5 minutes after the response (RN-37)" }
        urlExpiresAt: { type: string, format: date-time }

    DocumentActionReason:
      type: string
      enum: [ARCO_REQUEST, UPLOAD_ERROR]
      description: "Why an administrator deleted or replaced a document: an ARCO request of the holder or an upload error (RN-37)"

    DocumentRequestChannel:
      type: string
      enum: [WHATSAPP, EMAIL, IN_PERSON, OTHER]
      description: Channel through which the holder made the ARCO request

    DocumentRequestedAt:
      type: string
      format: date
      description: >
        Date the holder made the ARCO request, on or before today (America/Lima).
        Required with `ARCO_REQUEST`; not allowed with `UPLOAD_ERROR`

    DocumentActionNote:
      type: string
      maxLength: 500
      description: >
        Only a reference (ticket or channel); no personal data of the holder. It
        is never logged. Empty or whitespace only counts as absent (stored as null)

    DocumentActionRequest:
      type: object
      description: >
        Why a document is deleted or replaced (RN-37). OpenAPI 3.0 cannot express
        the conditions, so they are listed here; each one broken is a 400
        `VALIDATION_ERROR` with its `field`. With `ARCO_REQUEST`, `requestedAt`
        and `requestChannel` are both required. With `UPLOAD_ERROR`, neither may
        be sent. `requestedAt` is on or before today (America/Lima). An empty or
        whitespace-only `note` counts as null.
      required: [reason]
      additionalProperties: false
      properties:
        reason: { $ref: "#/components/schemas/DocumentActionReason" }
        requestedAt: { $ref: "#/components/schemas/DocumentRequestedAt" }
        requestChannel: { $ref: "#/components/schemas/DocumentRequestChannel" }
        note: { $ref: "#/components/schemas/DocumentActionNote" }

    GuestDocumentAction:
      type: object
      description: >
        Evidence of one deletion or replacement of a guest document (RN-37). Never
        carries the file name, the storage key or the content.
      required: [id, action, documentId, replacementDocumentId, reason, requestedAt, requestChannel, note, contentType, sizeBytes, actorId, performedAt]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [DELETE, REPLACE] }
        documentId: { type: string, format: uuid, description: "The document deleted or replaced" }
        replacementDocumentId: { type: string, format: uuid, nullable: true, description: "The new document of a REPLACE; null for a DELETE" }
        reason: { $ref: "#/components/schemas/DocumentActionReason" }
        requestedAt: { type: string, format: date, nullable: true, description: "Date the holder made the request; null for UPLOAD_ERROR" }
        requestChannel: { type: string, nullable: true, enum: [WHATSAPP, EMAIL, IN_PERSON, OTHER, null], description: "null for UPLOAD_ERROR" }
        note: { type: string, nullable: true, maxLength: 500, description: "Only a reference (ticket or channel); null when absent or blank" }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf], description: "Type of the deleted or replaced file" }
        sizeBytes: { type: integer, minimum: 1, maximum: 5242880, description: "Size of the deleted or replaced file" }
        actorId: { type: string, format: uuid, description: "The administrator who performed the action" }
        actorName: { type: string, description: "Name of that administrator (A3.8, TAR-237)" }
        performedAt: { type: string, format: date-time }

    PagedGuestDocumentActions:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/GuestDocumentAction" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    OnboardingState:
      description: >
        Onboarding state. While the guest is in onboarding `nextStep` names the
        step to go to; once active there is no `nextStep` (RN-33, RN-36).
      oneOf:
        - $ref: "#/components/schemas/OnboardingInProgress"
        - $ref: "#/components/schemas/OnboardingCompleted"

    OnboardingInProgress:
      description: >
        Onboarding still open (the password is already chosen). Before the personal
        data step is saved the data is not there yet; from the documents step on it
        is always returned.
      oneOf:
        - $ref: "#/components/schemas/OnboardingPersonalDataPending"
        - $ref: "#/components/schemas/OnboardingDocumentsPending"
        - $ref: "#/components/schemas/OnboardingConsentPending"

    OnboardingPersonalDataPending:
      type: object
      required: [status, nextStep, documents, consent]
      properties:
        status: { type: string, enum: [ONBOARDING] }
        nextStep: { type: string, enum: [PERSONAL_DATA], description: "The password step is already done: a guest that still must change its temporary password cannot reach the onboarding operations (RF-12)" }
        documents:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/PendingConsentState" }

    OnboardingDocumentsPending:
      type: object
      description: "Personal data saved; the optional documents step is next (the answer of saving the personal data)"
      required: [status, nextStep, personalData, documents, consent]
      properties:
        status: { type: string, enum: [ONBOARDING] }
        nextStep: { type: string, enum: [DOCUMENTS] }
        personalData: { $ref: "#/components/schemas/PersonalDataInput" }
        documents:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/PendingConsentState" }

    OnboardingConsentPending:
      type: object
      description: "Documents step finished or skipped; only the consent is left (the answer of finishing the documents step)"
      required: [status, nextStep, personalData, documents, consent]
      properties:
        status: { type: string, enum: [ONBOARDING] }
        nextStep: { type: string, enum: [CONSENT] }
        personalData: { $ref: "#/components/schemas/PersonalDataInput" }
        documents:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/PendingConsentState" }

    OnboardingCompleted:
      type: object
      required: [status, personalData, documents, consent]
      properties:
        status: { type: string, enum: [ACTIVE] }
        personalData: { $ref: "#/components/schemas/PersonalDataInput" }
        documents:
          type: array
          maxItems: 5
          items: { $ref: "#/components/schemas/GuestDocumentRef" }
        consent: { $ref: "#/components/schemas/AcceptedConsentState" }

    PendingConsentState:
      type: object
      description: The consent in force, not yet accepted (the guest is still in onboarding)
      required: [version, text, accepted]
      properties:
        version: { type: string }
        text: { type: string, description: "Consent text in force, in Spanish" }
        accepted: { type: boolean, enum: [false] }

    AcceptedConsentState:
      type: object
      description: The consent the guest accepted, which is what completes the onboarding (RN-14, RN-36)
      required: [version, text, accepted]
      properties:
        version: { type: string }
        text: { type: string, description: "Consent text that was accepted, in Spanish" }
        accepted: { type: boolean, enum: [true] }

    Contract:
      type: object
      required: [id, environmentId, guestId, guestName, documentType, documentNumber, environmentCode, environmentType, monthlyAmount, paymentDay, graceDays, startDate, status, expiringSoon, terminatedAt, file, fileUrl]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        guestName: { type: string, nullable: true, description: "null while the guest has not given a name (TAR-237)" }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        environmentCode: { type: string, description: "«201»; with environmentType, «Habitación 201» (A4, A3.2, H2)" }
        environmentType: { type: string, enum: [ROOM, CABIN] }
        monthlyAmount: { type: number }
        paymentDay: { type: integer }
        graceDays: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: "null means an open-ended contract (RN-07)" }
        status: { type: string, enum: [ACTIVE, EXPIRED, TERMINATED] }
        expiringSoon: { type: boolean, description: "ACTIVE with 30 days or fewer to the end date (RF-09, D-27); false when open-ended (H2 «Próximo a vencer», TAR-237)" }
        terminatedAt: { type: string, format: date, nullable: true, description: "When it was terminated (RN-21); null unless TERMINATED" }
        file:
          type: object
          description: The PDF of the contract (A4.2, H2)
          required: [name, sizeBytes, uploadedAt]
          properties:
            name: { type: string }
            sizeBytes: { type: integer, minimum: 1 }
            uploadedAt: { type: string, format: date-time }
        fileUrl: { type: string, nullable: true, description: "R2 signed URL, expires in 15 min; signed when the contract is requested, never stored. null when the storage could not sign it: the rest of the contract still comes, and «Ver contrato» shows the storage notice (TAR-237)" }

    ContractSummary:
      type: object
      description: A contract in a list, without the signed file URL
      required: [id, environmentId, guestId, guestName, documentType, documentNumber, environmentCode, environmentType, monthlyAmount, paymentDay, graceDays, startDate, status, expiringSoon, terminatedAt]
      properties:
        id: { type: string, format: uuid }
        environmentId: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        guestName: { type: string, nullable: true, description: "null while the guest has not given a name (TAR-237)" }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        environmentCode: { type: string, description: "«201»; with environmentType, «Habitación 201» (A4, A3.2, H2)" }
        environmentType: { type: string, enum: [ROOM, CABIN] }
        monthlyAmount: { type: number }
        paymentDay: { type: integer }
        graceDays: { type: integer }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true, description: "null means an open-ended contract (RN-07)" }
        status: { type: string, enum: [ACTIVE, EXPIRED, TERMINATED] }
        expiringSoon: { type: boolean, description: "ACTIVE with 30 days or fewer to the end date (RF-09, D-27); false when open-ended" }
        terminatedAt: { type: string, format: date, nullable: true, description: "When it was terminated (RN-21); null unless TERMINATED" }

    PagedContracts:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/ContractSummary" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    GuestNotContractError:
      type: object
      description: Only a guest of type CONTRACT takes a contract (RN-13). The `code` is always `GUEST_NOT_CONTRACT`
      required: [code, message]
      properties:
        code: { type: string, enum: [GUEST_NOT_CONTRACT] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    FileStorageUnavailableError:
      type: object
      description: The file storage could not store or sign the file. The `code` is always `FILE_STORAGE_UNAVAILABLE`
      required: [code, message]
      properties:
        code: { type: string, enum: [FILE_STORAGE_UNAVAILABLE] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    ProofKind:
      type: string
      enum: [VOUCHER, CASH]
      description: "VOUCHER: an image or PDF (RF-15). CASH: an amount in cash without a voucher (RN-22)"

    ProofInput:
      type: object
      description: >
        One proof of a payment being sent (RN-22). A VOUCHER points to its file with `fileIndex`,
        the position of the file in the `files` part (0-based); a CASH proof has no file
      required: [kind, amount]
      additionalProperties: false
      properties:
        kind: { $ref: "#/components/schemas/ProofKind" }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "Declared amount of this proof, in soles (RN-16)" }
        method: { type: string, maxLength: 50, description: "Optional free text, e.g. Yape or transfer (RN-28); a CASH proof is recorded as cash" }
        fileIndex: { type: integer, minimum: 0, maximum: 4, description: "Required for VOUCHER, absent for CASH" }

    ProofEdit:
      type: object
      description: >
        One proof in a correction. With `id`, an existing proof of the payment that is kept (its
        amount or method can change, and `fileIndex` replaces its file); without `id`, a new proof
      required: [kind, amount]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProofKind" }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01 }
        method: { type: string, maxLength: 50 }
        fileIndex: { type: integer, minimum: 0, maximum: 4, description: "Required for a new VOUCHER; optional for a kept one (replaces its file)" }

    GuestPaymentUpload:
      type: object
      description: "Multipart body of `uploadPaymentVoucher`: the month, the proofs as a JSON part and their files"
      required: [period, proofs]
      properties:
        period: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09", description: "A month of the contract, up to the current month" }
        proofs: { type: array, minItems: 1, maxItems: 5, items: { $ref: "#/components/schemas/ProofInput" } }
        files: { type: array, maxItems: 5, items: { type: string, format: binary }, description: "JPG/PNG/PDF, ≤5MB each, checked by content (RF-15); one per VOUCHER proof" }

    StayPaymentUpload:
      type: object
      description: "Multipart body of `uploadTemporaryVoucher`: the proofs as a JSON part and their files"
      required: [proofs]
      properties:
        proofs: { type: array, minItems: 1, maxItems: 5, items: { $ref: "#/components/schemas/ProofInput" } }
        files: { type: array, maxItems: 5, items: { type: string, format: binary }, description: "JPG/PNG/PDF, ≤5MB each, checked by content (RF-15); one per VOUCHER proof" }

    DirectPaymentUpload:
      type: object
      description: >
        Multipart body of `createDirectPayment`. Send exactly one of `period` (a guest with a
        contract) or `stayId` (a temporary guest, whose single payment belongs to a stay, RN-03)
      required: [guestId, proofs]
      properties:
        guestId: { type: string, format: uuid }
        period: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        stayId: { type: string, format: uuid }
        receivedOn: { type: string, format: date, description: "When the money was received; optional, by default the day of the registration; not in the future. It does not change the month the payment counts in (RF-18)" }
        proofs: { type: array, minItems: 1, maxItems: 5, items: { $ref: "#/components/schemas/ProofInput" } }
        files: { type: array, maxItems: 5, items: { type: string, format: binary }, description: "JPG/PNG/PDF, ≤5MB each, checked by content (RF-15); one per VOUCHER proof" }

    ProofsCorrection:
      type: object
      description: "Multipart body of a correction: the whole new set of proofs as a JSON part and the new files"
      required: [proofs]
      properties:
        proofs: { type: array, minItems: 1, maxItems: 5, items: { $ref: "#/components/schemas/ProofEdit" } }
        files: { type: array, maxItems: 5, items: { type: string, format: binary }, description: "JPG/PNG/PDF, ≤5MB each, checked by content (RF-15)" }

    ProofFileInfo:
      type: object
      description: The file of a voucher, without its URL
      required: [name, contentType, sizeBytes]
      properties:
        name: { type: string, description: "Sanitized file name" }
        contentType: { type: string, enum: [image/jpeg, image/png, application/pdf] }
        sizeBytes: { type: integer, minimum: 1 }

    GuestProof:
      type: object
      description: A proof of a payment as its own guest sees it (no voucher URL)
      required: [id, kind, declaredAmount, verifiedAmount, uploadedBy, addedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProofKind" }
        method: { type: string, nullable: true }
        declaredAmount: { type: number, description: "What was declared for this proof, in soles" }
        verifiedAmount: { type: number, nullable: true, description: "What the administrator verified (RN-16); null until the payment is approved" }
        uploadedBy: { type: string, enum: [GUEST, ADMIN], description: "Who added the proof (RN-22)" }
        addedAt: { type: string, format: date-time }
        receivedOn: { type: string, format: date, nullable: true, description: "When the administration received the money (direct payments only)" }
        file: { type: object, allOf: [{ $ref: "#/components/schemas/ProofFileInfo" }], nullable: true, description: "null for CASH" }

    AdminProof:
      type: object
      description: A proof of a payment in the administrator's detail, with its signed voucher URL
      required: [id, kind, declaredAmount, verifiedAmount, uploadedBy, addedAt, fileUrl]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProofKind" }
        method: { type: string, nullable: true }
        declaredAmount: { type: number }
        verifiedAmount: { type: number, nullable: true }
        uploadedBy: { type: string, enum: [GUEST, ADMIN] }
        addedAt: { type: string, format: date-time }
        receivedOn: { type: string, format: date, nullable: true }
        file: { type: object, allOf: [{ $ref: "#/components/schemas/ProofFileInfo" }], nullable: true, description: "null for CASH" }
        fileUrl: { type: string, nullable: true, description: "R2 signed URL, expires in 15 min, forces the download; null for CASH" }

    PaymentReview:
      type: object
      description: One decision on a payment (payment_reviews)
      required: [decision, at]
      properties:
        decision: { type: string, enum: [APPROVED, REJECTED] }
        reason: { type: string, nullable: true }
        at: { type: string, format: date-time }

    ReviewerRef:
      type: object
      description: The administrator who resolved a payment (TAR-230); only in the administrator's views
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    PaymentSurplus:
      type: object
      description: What was left over when the payment was approved (RN-38, RN-39)
      required: [amount, outcome]
      properties:
        amount: { type: number }
        outcome: { type: string, enum: [CREDIT, REFUND_PENDING, REFUNDED], description: "CREDIT: discounted from the next period. REFUND_PENDING / REFUNDED: last period of a contract or a stay, returned by Quipu" }

    PaymentSummary:
      type: object
      description: A payment without its proofs' URLs — what lists and the guest's own responses carry
      required: [id, guestId, contractId, stayId, period, amount, verifiedAmount, status, proofCount, voucherCount, hasCash, submittedAt, createdAt]
      oneOf:
        - description: A period of a contract (guest with a contract)
          additionalProperties: true
          properties:
            contractId: { type: string }
            period: { type: string }
            stayId: { type: string, nullable: true, enum: [null] }
        - description: The stay of a temporary guest
          additionalProperties: true
          properties:
            stayId: { type: string }
            contractId: { type: string, nullable: true, enum: [null] }
            period: { type: string, nullable: true, enum: [null] }
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        contractId: { type: string, format: uuid, nullable: true, description: "The contract the period belongs to; null for a temporary guest" }
        stayId: { type: string, format: uuid, nullable: true, description: "The stay a temporary guest paid for; null for a guest with a contract" }
        period: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09", description: "null for a temporary guest (RN-03)" }
        amount: { type: number, description: "Sum of the declared amounts of its proofs, in soles" }
        verifiedAmount: { type: number, nullable: true, description: "Sum of the verified amounts (RN-16); null until approved" }
        paymentMethod: { type: string, nullable: true, deprecated: true, description: "Method of its first proof; each proof carries its own method now (TAR-239)" }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejectionReason: { type: string, nullable: true, description: "Shown to the guest in the app only, never by email (D-34d)" }
        proofCount: { type: integer, minimum: 1, maximum: 5 }
        voucherCount: { type: integer, minimum: 0, maximum: 5 }
        hasCash: { type: boolean }
        reviewedAt: { type: string, format: date-time, nullable: true }
        submittedAt: { type: string, format: date-time, description: "Last time it was sent (a corrected payment is sent again)" }
        createdAt: { type: string, format: date-time }

    Payment:
      type: object
      description: >
        A payment in the administrator's detail (`getPayment`): what is being paid, its proofs with
        their signed URLs and its reviews (A5.2, TAR-239)
      required: [id, guestId, guestName, documentNumber, guestType, environmentCode, contractId, stayId, period, stayStartDate, stayEndDate, expectedAmount, creditApplied, amountDue, lastPeriod, amount, verifiedAmount, status, reviewedBy, submittedAt, createdAt, proofs, reviews]
      oneOf:
        - description: A period of a contract (guest with a contract)
          additionalProperties: true
          properties:
            contractId: { type: string }
            period: { type: string }
            stayId: { type: string, nullable: true, enum: [null] }
        - description: The stay of a temporary guest
          additionalProperties: true
          properties:
            stayId: { type: string }
            contractId: { type: string, nullable: true, enum: [null] }
            period: { type: string, nullable: true, enum: [null] }
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        guestName: { type: string, nullable: true, description: "null while the guest has not given a name in the onboarding" }
        documentNumber: { type: string }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        environmentCode: { type: string, nullable: true, description: "null for a stay without environment (TAR-237)" }
        contractId: { type: string, format: uuid, nullable: true }
        stayId: { type: string, format: uuid, nullable: true }
        period: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        stayStartDate: { type: string, format: date, nullable: true, description: "Stay dates; null for a guest with a contract" }
        stayEndDate: { type: string, format: date, nullable: true }
        expectedAmount: { type: number, description: "Monthly amount of the contract or agreed amount of the stay" }
        creditApplied: { type: number, minimum: 0, description: "Credit of the guest discounted from this period (RN-38); 0 for a stay" }
        amountDue: { type: number, description: "expectedAmount - creditApplied: what the verified sum must cover to approve" }
        lastPeriod: { type: boolean, description: "Last period of the contract, or a stay: what is left over is refunded instead of kept as credit (RN-38)" }
        amount: { type: number, description: "Sum of the declared amounts" }
        verifiedAmount: { type: number, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        rejectionReason: { type: string, nullable: true }
        surplus: { type: object, allOf: [{ $ref: "#/components/schemas/PaymentSurplus" }], nullable: true }
        reviewedAt: { type: string, format: date-time, nullable: true }
        reviewedBy: { type: object, allOf: [{ $ref: "#/components/schemas/ReviewerRef" }], nullable: true, description: "Who resolved it last (TAR-230); null while pending" }
        submittedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        proofs: { type: array, minItems: 1, maxItems: 5, items: { $ref: "#/components/schemas/AdminProof" } }
        reviews: { type: array, items: { $ref: "#/components/schemas/PaymentReview" }, description: "Oldest first" }

    PagedPayments:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/PaymentSummary" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    DashboardCharge:
      type: object
      description: A row of «Cobros del mes» in A1 (TAR-236)
      required: [guestId, guestName, documentType, documentNumber, guestType, environmentCode, contractId, stayId, period, stayStartDate, stayEndDate, amount, dueDate, status, paymentId]
      properties:
        guestId: { type: string, format: uuid }
        guestName: { type: string, nullable: true }
        documentType: { $ref: "#/components/schemas/DocumentType" }
        documentNumber: { type: string }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        environmentCode: { type: string, nullable: true, description: "Null for an old stay without environment (TAR-237)" }
        contractId: { type: string, format: uuid, nullable: true }
        stayId: { type: string, format: uuid, nullable: true }
        period: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", description: "Period of a contract; null for a stay" }
        stayStartDate: { type: string, format: date, nullable: true }
        stayEndDate: { type: string, format: date, nullable: true }
        amount: { type: number, description: "Monthly amount or agreed amount of the stay, minus the credit applied (RN-38)" }
        dueDate: { type: string, format: date, description: "Payment day of the period (RN-10) or the check-out date of the stay" }
        status: { type: string, enum: [PAID, UNDER_REVIEW, UNPAID, OVERDUE] }
        paymentId: { type: string, format: uuid, nullable: true, description: "The live payment when UNDER_REVIEW, to open A5.2" }

    DashboardChargeRef:
      type: object
      required: [guestId, guestName, environmentCode, period, stayStartDate, stayEndDate, dueDate, amount]
      properties:
        guestId: { type: string, format: uuid }
        guestName: { type: string, nullable: true }
        environmentCode: { type: string, nullable: true }
        period: { type: string, nullable: true }
        stayStartDate: { type: string, format: date, nullable: true }
        stayEndDate: { type: string, format: date, nullable: true }
        dueDate: { type: string, format: date }
        amount: { type: number }

    DashboardOverdue:
      type: object
      description: Overdue charges, of this month or earlier (RN-10, RN-25)
      required: [count, total, first]
      properties:
        count: { type: integer, minimum: 0 }
        total: { type: number, minimum: 0 }
        first: { type: array, maxItems: 3, description: "The oldest ones first", items: { $ref: "#/components/schemas/DashboardChargeRef" } }

    DashboardRejected:
      type: object
      description: Payments rejected that nobody has corrected yet (RN-05, A5 Rechazados)
      required: [count, oldest]
      properties:
        count: { type: integer, minimum: 0 }
        oldest:
          type: object
          nullable: true
          required: [paymentId, guestName, period, stayStartDate, stayEndDate, rejectedAt]
          properties:
            paymentId: { type: string, format: uuid }
            guestName: { type: string, nullable: true }
            period: { type: string, nullable: true }
            stayStartDate: { type: string, format: date, nullable: true }
            stayEndDate: { type: string, format: date, nullable: true }
            rejectedAt: { type: string, format: date-time }

    DashboardRefunds:
      type: object
      description: Credit to refund (RN-38, RN-39); the detail is in GET /admin/credits?pending=true
      required: [count, total]
      properties:
        count: { type: integer, minimum: 0, description: "Guests with credit to refund" }
        total: { type: number, minimum: 0 }

    DashboardExpiringContracts:
      type: object
      description: Active contracts that end in 30 days or less (RN-07, expiringSoon)
      required: [count, first]
      properties:
        count: { type: integer, minimum: 0 }
        first:
          type: object
          nullable: true
          description: The one that ends first
          required: [contractId, guestName, environmentCode, endDate]
          properties:
            contractId: { type: string, format: uuid }
            guestName: { type: string, nullable: true }
            environmentCode: { type: string }
            endDate: { type: string, format: date }

    DashboardGuestsNotActivated:
      type: object
      description: Guests pending activation (RN-32, RN-36)
      required: [count, expired, first]
      properties:
        count: { type: integer, minimum: 0 }
        expired: { type: integer, minimum: 0, description: "How many of them have their access expired" }
        first:
          type: object
          nullable: true
          description: An expired one first, otherwise the one whose access ends first
          required: [guestId, documentType, documentNumber, accessExpiresAt]
          properties:
            guestId: { type: string, format: uuid }
            documentType: { $ref: "#/components/schemas/DocumentType" }
            documentNumber: { type: string }
            accessExpiresAt: { type: string, format: date-time, nullable: true }

    GuestPayment:
      type: object
      description: One own payment as the guest sees it (H3 «Tu pago», H4), without voucher URLs nor who reviewed it
      required: [id, contractId, stayId, period, status, amount, verifiedAmount, creditApplied, amountDue, submittedAt, createdAt, proofs, reviews]
      properties:
        id: { type: string, format: uuid }
        contractId: { type: string, format: uuid, nullable: true }
        stayId: { type: string, format: uuid, nullable: true }
        period: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
        stayStartDate: { type: string, format: date, nullable: true }
        stayEndDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        amount: { type: number, description: "Sum of the declared amounts" }
        verifiedAmount: { type: number, nullable: true }
        creditApplied: { type: number, minimum: 0 }
        amountDue: { type: number }
        surplus: { type: object, allOf: [{ $ref: "#/components/schemas/PaymentSurplus" }], nullable: true }
        rejectionReason: { type: string, nullable: true }
        submittedAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        proofs: { type: array, minItems: 1, maxItems: 5, items: { $ref: "#/components/schemas/GuestProof" } }
        reviews: { type: array, items: { $ref: "#/components/schemas/PaymentReview" }, description: "What happened, oldest first («Lo que pasó» in H4)" }

    GuestRefund:
      type: object
      description: A refund Quipu made to the guest (RN-39), shown in H4 with the label Devuelto
      required: [id, date, method, amount, fromPaymentId]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        method: { type: string }
        amount: { type: number }
        fromPaymentId: { type: string, format: uuid, description: "The payment whose surplus was refunded" }
        fromPeriod: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }

    GuestHistoryItem:
      type: object
      description: "An item of the guest's history: a payment or a refund, by `kind`"
      required: [kind, payment, refund]
      properties:
        kind: { type: string, enum: [PAYMENT, REFUND] }
        payment: { type: object, allOf: [{ $ref: "#/components/schemas/GuestPayment" }], nullable: true, description: "Set when kind=PAYMENT" }
        refund: { type: object, allOf: [{ $ref: "#/components/schemas/GuestRefund" }], nullable: true, description: "Set when kind=REFUND" }

    PagedGuestHistory:
      type: object
      required: [content, nextCursor, creditBalance]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/GuestHistoryItem" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
        creditBalance: { type: number, minimum: 0, description: "Credit the guest has now, to be discounted from the next period (RN-38)" }

    PaymentQueueItem:
      type: object
      description: A row of the review queue (A5); it does not show the amount
      required: [id, guestId, guestName, documentNumber, guestType, environmentCode, period, stayStartDate, stayEndDate, status, proofCount, voucherCount, hasCash, submittedAt, createdAt]
      oneOf:
        - description: A guest with a contract, with its environment and period
          additionalProperties: true
          properties:
            guestType: { type: string, enum: [CONTRACT] }
            environmentCode: { type: string }
            period: { type: string }
        - description: A temporary guest, with no environment and no period (shown as Temporal until TAR-237)
          additionalProperties: true
          properties:
            guestType: { type: string, enum: [TEMPORARY] }
            environmentCode: { type: string, nullable: true, enum: [null] }
            period: { type: string, nullable: true, enum: [null] }
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        guestName: { type: string, nullable: true, description: "null while the guest has not given a name in the onboarding" }
        documentNumber: { type: string }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        environmentCode: { type: string, nullable: true, description: "null for a temporary guest (shown as Temporal)" }
        period: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        stayStartDate: { type: string, format: date, nullable: true, description: "Stay dates of a temporary guest («20 – 31 oct»); null for a contract" }
        stayEndDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        proofCount: { type: integer, minimum: 1, maximum: 5 }
        voucherCount: { type: integer, minimum: 0, maximum: 5, description: "With hasCash, the Comprobantes column («2 vouchers», «1 voucher y efectivo»)" }
        hasCash: { type: boolean }
        reviewedBy: { type: object, allOf: [{ $ref: "#/components/schemas/ReviewerRef" }], nullable: true, description: "Who resolved it (TAR-230); null while pending" }
        submittedAt: { type: string, format: date-time, description: "Last time it was sent; orders the queue" }
        createdAt: { type: string, format: date-time, description: "When the payment was first sent" }

    PagedPaymentQueue:
      type: object
      required: [content, nextCursor]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/PaymentQueueItem" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }

    PeriodStatus:
      type: object
      required: [period, status, dueDate, amount, creditApplied, amountDue, contractId]
      properties:
        period: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        status: { type: string, enum: [PAID, UNDER_REVIEW, UNPAID, OVERDUE] }
        dueDate: { type: string, format: date, description: "Payment day of the month, or its last day when the month is shorter (RN-10); the grace days come on top" }
        amount: { type: number, description: "Monthly amount of the contract" }
        creditApplied: { type: number, minimum: 0, description: "Credit of the guest discounted from this period (RN-38), at most `amount`" }
        amountDue: { type: number, minimum: 0, description: "amount - creditApplied: what is left to pay (H1 «S/ 750.00»). When the credit covers the whole period it is 0 and the period is PAID without a payment (`paymentId` null); the credit left passes on to the next period, month by month (RN-38, decided 2026-11-01)" }
        contractId: { type: string, format: uuid }
        paymentId: { type: string, format: uuid, nullable: true, description: "The live or last payment of the period, if any; null for a period paid with credit only" }
        rejectionReason: { type: string, nullable: true, description: "Reason of the last rejection while the payment stays rejected (D-34d); a rejected period stays UNPAID or OVERDUE" }

    GuestCredit:
      type: object
      description: Credit of a guest with a contract (RN-38, RN-39)
      required: [balance, toRefund, lastRefund]
      properties:
        balance: { type: number, minimum: 0, description: "Credit the guest has now; 0 when none" }
        toRefund: { type: boolean, description: "true when no period is left where to use it, so Quipu refunds it (A6.5)" }
        lastRefund:
          type: object
          nullable: true
          description: The last refund Quipu made to the guest (H1 «Te devolvimos S/ 120.00 el 3 de noviembre por Yape»)
          required: [amount, date, method]
          properties:
            amount: { type: number }
            date: { type: string, format: date }
            method: { type: string }

    StayPaymentStatus:
      type: object
      description: Payment status of one stay of a temporary guest (CU-21)
      required: [stayId, startDate, endDate, status, agreedAmount, surplus]
      properties:
        stayId: { type: string, format: uuid }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [PAID, UNDER_REVIEW, UNPAID, OVERDUE], description: "OVERDUE once the exit date has passed without an approved payment" }
        agreedAmount: { type: number }
        paymentId: { type: string, format: uuid, nullable: true }
        rejectionReason: { type: string, nullable: true }
        surplus:
          type: object
          nullable: true
          description: "What was paid over the agreed amount: a stay keeps no credit, it is refunded (RN-38, RN-39, T1)"
          required: [amount, refundStatus]
          properties:
            amount: { type: number }
            refundStatus: { type: string, enum: [PENDING, REFUNDED] }
            refundedOn: { type: string, format: date, nullable: true }
            refundMethod: { type: string, nullable: true }

    PayablePeriod:
      type: object
      description: A period or a stay of the guest for a direct payment (A5.1)
      required: [contractId, period, stayId, stayStartDate, stayEndDate, status, dueDate, expectedAmount, creditApplied, amountDue, lastPeriod, paymentId]
      properties:
        contractId: { type: string, format: uuid, nullable: true }
        period: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
        stayId: { type: string, format: uuid, nullable: true }
        stayStartDate: { type: string, format: date, nullable: true }
        stayEndDate: { type: string, format: date, nullable: true }
        status: { type: string, enum: [UNPAID, OVERDUE, UNDER_REVIEW, REJECTED], description: "UNPAID and OVERDUE take a direct payment; UNDER_REVIEW and REJECTED are completed in A5.2" }
        dueDate: { type: string, format: date, description: "Payment day of the period, or exit date of the stay" }
        expectedAmount: { type: number }
        creditApplied: { type: number, minimum: 0 }
        amountDue: { type: number }
        lastPeriod: { type: boolean }
        paymentId: { type: string, format: uuid, nullable: true, description: "Set when UNDER_REVIEW or REJECTED" }

    PaymentNotCorrectableError:
      type: object
      description: >
        The payment cannot be corrected in its state: the guest corrects only a REJECTED payment,
        the administrator a PENDING or REJECTED one. The `code` is always `PAYMENT_NOT_CORRECTABLE`
      required: [code, message]
      properties:
        code: { type: string, enum: [PAYMENT_NOT_CORRECTABLE] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    VoucherAlreadyExistsError:
      type: object
      description: A voucher is already pending for the period or the stay (RN-15, RN-03). The `code` is always `VOUCHER_ALREADY_EXISTS`
      required: [code, message]
      properties:
        code: { type: string, enum: [VOUCHER_ALREADY_EXISTS] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    PaymentAlreadyExistsForPeriodError:
      type: object
      description: The period or the stay already has an approved payment (RN-02, D-28). The `code` is always `PAYMENT_ALREADY_EXISTS_FOR_PERIOD`
      required: [code, message]
      properties:
        code: { type: string, enum: [PAYMENT_ALREADY_EXISTS_FOR_PERIOD] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    PaymentAlreadyResolvedError:
      type: object
      description: Another process resolved the payment first. The `code` is always `PAYMENT_ALREADY_RESOLVED`
      required: [code, message]
      properties:
        code: { type: string, enum: [PAYMENT_ALREADY_RESOLVED] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    PaymentPeriodNotPayableError:
      type: object
      description: >
        The payment's period is no longer charged by the contract (it was terminated or expired
        before the approval), so it cannot be approved. The payment stays pending and can only be
        rejected with a reason. The `code` is always `PAYMENT_PERIOD_NOT_PAYABLE`
      required: [code, message]
      properties:
        code: { type: string, enum: [PAYMENT_PERIOD_NOT_PAYABLE] }
        message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }

    RefundInput:
      type: object
      required: [guestId, amount, date, method]
      additionalProperties: false
      properties:
        guestId: { type: string, format: uuid }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles; at most the pending credit of the guest (RN-38)" }
        date: { type: string, format: date, description: "When the money was returned; not in the future. The refund counts in this date's month (RN-39)" }
        method: { type: string, minLength: 1, maxLength: 50, pattern: '\S', description: "Free text, e.g. Yape or transfer; required (RN-39)" }
        note: { type: string, maxLength: 500, description: "Optional; blank means none" }

    Refund:
      type: object
      description: A refund as the BFF answers it, with the guest it went to
      required: [id, guestId, guestName, environmentCode, amount, date, method, createdAt]
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        guestName: { type: string, nullable: true }
        environmentCode: { type: string, nullable: true, description: "The environment of the contract or stay the credit came from; null for a stay without environment (TAR-237)" }
        amount: { type: number }
        date: { type: string, format: date }
        method: { type: string }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    PagedRefunds:
      type: object
      required: [content, nextCursor, totalCount]
      properties:
        content: { type: array, items: { $ref: "#/components/schemas/Refund" } }
        nextCursor: { $ref: "#/components/schemas/NextCursor" }
        totalCount: { type: integer, minimum: 0, description: "Refunds of the month, for «Mostrando X de Y»" }

    PendingCredit:
      type: object
      description: Credit of a guest that has to be refunded (RN-38)
      required: [guestId, guestName, guestType, environmentCode, amount, origin]
      properties:
        guestId: { type: string, format: uuid }
        guestName: { type: string, nullable: true }
        guestType: { type: string, enum: [CONTRACT, TEMPORARY] }
        environmentCode: { type: string, nullable: true }
        amount: { type: number, description: "Pending credit, after any partial refund" }
        origin:
          type: object
          description: Where the credit came from («Sobró del pago de octubre; su contrato terminó el 15 oct»)
          required: [paymentId, period, stayStartDate, stayEndDate, contractEndedOn]
          properties:
            paymentId: { type: string, format: uuid }
            period: { type: string, nullable: true, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
            stayStartDate: { type: string, format: date, nullable: true }
            stayEndDate: { type: string, format: date, nullable: true }
            contractEndedOn: { type: string, format: date, nullable: true, description: "End or termination date when the contract is over; null otherwise" }

    ExpenseInput:
      type: object
      required: [category, amount, month]
      properties:
        category: { type: string, enum: [UTILITIES, MAINTENANCE, CLEANING_SUPPLIES, TAXES_FEES], description: "UTILITIES: electricity, water, internet. MAINTENANCE: maintenance and repairs. CLEANING_SUPPLIES: cleaning and supplies. TAXES_FEES: taxes and fees (D-26)" }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09", description: "Month the expense belongs to" }
        description: { type: string, maxLength: 500, description: "Optional; blank means none" }

    FineInput:
      type: object
      required: [guestId, amount, month]
      properties:
        guestId: { type: string, format: uuid, description: "Any existing guest, active or inactive" }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09", description: "Month the fine counts as income (RN-30)" }
        description: { type: string, maxLength: 500, description: "Optional; blank means none" }

    Fine:
      type: object
      description: A fine as the BFF answers it; the fields of `FineInput`, with the same constraints, plus its `id` and who it was charged to. The description is left out when there is none.
      required: [id, guestId, guestName, environmentCode, amount, month]
      properties:
        id: { type: string, format: uuid }
        guestId: { type: string, format: uuid }
        guestName: { type: string, nullable: true, description: "For the Multas table of A6 (TAR-240)" }
        environmentCode: { type: string, nullable: true, description: "The guest's environment when the fine was charged, or its last one; null if it never had one" }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        description: { type: string, maxLength: 500 }

    Expense:
      type: object
      description: An expense as the BFF answers it; the fields of `ExpenseInput`, with the same constraints, plus its `id`. The description is left out when there is none.
      required: [id, category, amount, month]
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [UTILITIES, MAINTENANCE, CLEANING_SUPPLIES, TAXES_FEES], description: "UTILITIES: electricity, water, internet. MAINTENANCE: maintenance and repairs. CLEANING_SUPPLIES: cleaning and supplies. TAXES_FEES: taxes and fees (D-26)" }
        amount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
        month: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        description: { type: string, maxLength: 500 }
