openapi: 3.0.3
info:
  title: Quipu — BFF API
  description: >
    Contract-first spec for the BFF (`/bff/**`) consumed by the Angular
    frontend. Source of truth for the contract — designed BEFORE
    implementation (see SRS chapter "10 - APIs e Integraciones", section
    "Estrategia de contrato: BFF vs. Core API"). Any new endpoint or
    response shape change is reflected here first; the Spring Boot
    implementation is validated against this spec with contract tests
    (MockMvc, SRS chapter "13 - Plan de Pruebas").
    Plain JSON, no HATEOAS `_links` (that is exclusive to the internal Core
    API). Language convention: identifiers (paths, fields, enums, error
    codes) are English per project convention; the SRS chapters that
    reference this spec stay in Spanish (formal documentation). User-facing
    error `message` values stay in Spanish — the end users (Tarimat Wasi
    family and guests) read Spanish, not English.
    Every `format: uuid` id is masked per session (TAR-227): the same
    resource has a different id in each session, so ids must not be stored
    or shared across sessions; an id obtained in another session answers 404,
    like an unknown one. A pagination cursor may embed such ids: use it only
    in the session that received it (one from another session can be a 400).
  version: "1.0"
  license:
    name: Proprietary - all rights reserved (Tarimat Wasi)
servers:
  - url: /bff

tags:
  - name: auth
    description: Login, link activation, session and password recovery (RF-08, RF-11, RF-12, RF-16)
  - name: admin-environments
    description: Rentable environment inventory (RF-01, RF-13)
  - name: admin-administrators
    description: Additional administrators created by an administrator (RF-22, CU-30, D-34c)
  - name: admin-guests
    description: Guest minimal registration, detail, access generation and onboarding documents (RF-02, RF-11, RF-13, RF-17)
  - name: admin-contracts
    description: Contract upload, validity and termination (RF-03, RF-09)
  - name: admin-payments
    description: Payment review queue, proofs, direct payments and payable periods (RF-05, RF-06, RN-22, TAR-239)
  - name: admin-fines
    description: Fines charged to guests, counted as income (RF-19, RN-30)
  - name: admin-expenses
    description: Operating expenses (RF-07)
  - name: admin-dashboard
    description: Home summary and monthly income/expense balance (RF-18)
  - name: admin-refunds
    description: Credit left over and refunds of Quipu to guests (RF-24, RN-38, RN-39)
  - name: guest-onboarding
    description: Mandatory, resumable onboarding of a new guest of either type (RF-14, RF-20)
  - name: guest
    description: Self-service for a guest with an active contract (RF-04, RF-06, RF-10)
  - name: temporary-guest
    description: Self-service for a guest with a one-time stay (RF-04, RF-06)

paths:
  # ───────────────────────── AUTH (RF-08, RF-11, RF-12, RF-16, RF-17) ─────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in (RF-08, CU-15)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentType, documentNumber, password]
              properties:
                documentType: { $ref: "#/components/schemas/DocumentType" }
                documentNumber: { type: string, maxLength: 20 }
                password: { type: string, maxLength: 128 }
      responses:
        "200":
          description: "Session started — HttpOnly JWT cookie issued (SameSite=Lax; Secure)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401":
          description: >
            `AUTH_INVALID_CREDENTIALS` (incorrect document or password) or
            `AUTH_TEMPORARY_PASSWORD_EXPIRED` (the temporary password was
            correct but its 30 minutes are over, RN-32: the guest asks the
            administrator for a new access). The expired code is only given
            when the password matched, so it never reveals whether a document
            exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "423": { $ref: "#/components/responses/AccountLocked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      security: [{ cookieAuth: [] }]
      responses:
        "204": { description: "Session closed, cookie invalidated" }
        "401": { $ref: "#/components/responses/NoSession" }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Current session
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          description: >
            Active session data, read from the account in the database (not
            from the token), so the client can restore the session after a reload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionInfo" }
        "401": { $ref: "#/components/responses/NoSession" }

  /auth/activate:
    post:
      operationId: activateAccess
      tags: [auth]
      summary: Activate access with the single-use link and choose the password (RF-11, RF-12, CU-24)
      description: >
        The administrator hands the guest a link (RN-32) whose token is
        single-use and expires 30 minutes after it was generated. The guest
        opens it and chooses their own password; the session starts right
        away. It also serves an already active guest whose password was lost:
        the administrator generates a new access (`POST
        /admin/guests/{id}/access`) and the guest sets a new password with it;
        the previous password stays valid until the link is used.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string, description: "Single-use token from the activation link" }
                newPassword: { type: string, minLength: 8, description: "At most 72 bytes in UTF-8 (bcrypt limit)" }
      responses:
        "200":
          description: >
            Access activated — HttpOnly JWT cookie issued. Always a guest
            session with the password already set: the guest goes on to the
            onboarding (never back to the password step) or, if it was already
            active (administrator-assisted recovery), straight to the home
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ActivatedOnboardingSession"
                  - $ref: "#/components/schemas/ActivatedActiveSession"
        "400":
          description: >
            `AUTH_INVALID_OR_EXPIRED_CODE` (unknown, expired, revoked or
            already used token: one generic answer for all of them),
            `AUTH_WEAK_PASSWORD` (with `field: newPassword`: too short, too long or
            equal to a live link or temporary password of the account; the token
            is not consumed) or `VALIDATION_ERROR` if a field is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/AccountDisabled" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password — mandatory on first login (RF-12)
      description: >
        `currentPassword` is optional only while the session still has the
        password change pending (first login with a temporary password) and
        required otherwise (A0.6, any administrator or guest from the account
        menu). On success the response sets a fresh `sessionToken` cookie
        without the pending mark, and every other session of the account stops
        being valid (decided 2026-11-01). A new password equal to the current
        (or temporary) one is rejected. Rate limited per session user.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                currentPassword: { type: string, maxLength: 128, description: "Optional when coming from the forced first-login flow" }
                newPassword: { type: string, minLength: 8, maxLength: 128, description: "At most 72 bytes in UTF-8 (bcrypt limit)" }
      responses:
        "204": { description: Password updated; Set-Cookie replaces the session }
        "400":
          description: >
            `AUTH_WEAK_PASSWORD` (shorter than 8 characters, longer than 72
            bytes, or equal to a live link or temporary password of the account)
            or `AUTH_PASSWORD_UNCHANGED` (same as the current one), both
            with `field: newPassword`; `VALIDATION_ERROR` if the field is missing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >
            `AUTH_INVALID_CREDENTIALS` with `field: currentPassword` when the current password is
            wrong (A0.6, as in the re-authentication of the administrators, TAR-127)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Request password recovery (RF-16)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: >
            Always 202, whether the email exists or not (generic response
            by design — never reveals account existence, RF-16). When the
            account exists and is active, the email carries a link with a
            single-use code that expires in 30 minutes (SEG-05).
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password with a single-use code (RF-16)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, newPassword]
              properties:
                code: { type: string, maxLength: 100, description: "Single-use code from the link in the recovery email" }
                newPassword: { type: string, minLength: 8, maxLength: 128, description: "At most 72 bytes in UTF-8 (bcrypt limit)" }
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  pattern: '\S'
                  description: >
                    Full name of an administrator that activates the account created by another one
                    (RF-22, A0.5, decided 2026-11-01): required while the account has no name, and
                    ignored once it has one. The email of an account without name links to the
                    administrator activation screen instead of the recovery one.
      responses:
        "204": { description: Password reset; the code can no longer be used }
        "400":
          description: >
            `AUTH_INVALID_OR_EXPIRED_CODE` (unknown, expired or already used
            code, or a disabled account: one generic answer for all of them),
            `AUTH_WEAK_PASSWORD` (with `field: newPassword`: too short, too long or
            equal to a live link or temporary password of the account; the code
            is not consumed) or `VALIDATION_ERROR` if a field is missing (also
            `field: name` for an administrator account without name; the code is
            not consumed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── ADMIN: ENVIRONMENTS (RF-01, RF-13, CU-01, CU-10) ─────────────────────────
  /admin/environments:
    get:
      operationId: listEnvironments
      tags: [admin-environments]
      summary: List environments (RF-01), with their occupancy (RN-20, TAR-237)
      description: >
        Each environment says who occupies it today (a contract in force or a stay of a temporary
        guest), who comes next (a contract or a stay that starts later: A2 shows «Libre hasta …»)
        and, when it is free, since when. With `freeFrom` and `freeTo` the list keeps only the
        environments free for the whole range, to choose one for a stay (A3.5) or a contract (A4.1);
        `freeTo` absent means open-ended (a contract without end date).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - name: freeFrom
          in: query
          description: First day the environment must be free
          schema: { type: string, format: date }
        - name: freeTo
          in: query
          description: Last day the environment must be free; requires `freeFrom`
          schema: { type: string, format: date }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: One page of the environment list, ordered by code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedEnvironments" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createEnvironment
      tags: [admin-environments]
      summary: Create environment (RF-01, CU-01)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type]
              properties:
                code: { type: string, minLength: 1, maxLength: 50, pattern: '^(?=.*\S)[A-Za-z0-9 ._/-]{1,50}$', description: "Unique, e.g. \"201\". Only letters, digits, space and . _ / - (decided 2026-10-31, TAR-237); surrounding spaces are ignored; at least one character is not a space" }
                type: { type: string, enum: [ROOM, CABIN] }
      responses:
        "201":
          description: Environment created, always ACTIVE
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Environment" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409": { $ref: "#/components/responses/EnvironmentCodeTaken" }

  /admin/environments/{id}:
    get:
      operationId: getEnvironment
      tags: [admin-environments]
      summary: Environment detail
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Environment detail
          content: { application/json: { schema: { $ref: "#/components/schemas/Environment" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateEnvironment
      tags: [admin-environments]
      summary: Edit environment
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                code: { type: string, minLength: 1, maxLength: 50, pattern: '^(?=.*\S)[A-Za-z0-9 ._/-]{1,50}$', description: "Same rule as on creation" }
                type: { type: string, enum: [ROOM, CABIN] }
      responses:
        "200":
          description: Environment updated (status is not changed here, see deactivate and reactivate)
          content: { application/json: { schema: { $ref: "#/components/schemas/Environment" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `ENVIRONMENT_CODE_TAKEN` (another environment already has that
            code, with `field: code`, RF-01) or `CONCURRENT_MODIFICATION` (the
            record changed while it was being edited, see the
            `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [code, message, field]
                    properties:
                      code: { type: string, enum: [ENVIRONMENT_CODE_TAKEN] }
                      message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
                      field: { type: string, enum: [code] }
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/environments/{id}/deactivate:
    post:
      operationId: deactivateEnvironment
      tags: [admin-environments]
      summary: Soft-deactivate environment (RF-13, RN-12, CU-10)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: "Environment deactivated, history preserved; deactivating an inactive one changes nothing" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `ENVIRONMENT_OCCUPIED` (the environment has a contract in force or a stay, now or later, RN-12, RN-20) or
            `CONCURRENT_MODIFICATION` (see the `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/EnvironmentOccupiedError"
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/environments/{id}/reactivate:
    post:
      operationId: reactivateEnvironment
      tags: [admin-environments]
      summary: Reactivate a previously deactivated environment (RN-12)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: "Environment reactivated, visible in active listings again; reactivating an active one changes nothing" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConcurrentModification" }

  /admin/environments/{id}/account-status:
    get:
      operationId: getEnvironmentAccountStatus
      tags: [admin-environments]
      summary: Payment status by period of the environment's current contract, admin view (RF-06, D-66)
      description: >-
        Every period of the environment's current contract (status `ACTIVE`, RN-07), classified as in
        `getGuestAccountStatus` (paid, pending review, unpaid or overdue by payment day plus grace days,
        RN-10), in the same order. An environment without a current contract (none, expired or terminated)
        answers an empty list. Works for active and inactive environments.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Status per period of the environment's current contract
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PeriodStatus" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/administrators:
    get:
      operationId: listAdministrators
      tags: [admin-administrators]
      summary: List the administrators, active and inactive (RF-22, TAR-127)
      description: >-
        Every ADMIN account, active and inactive, ordered by `createdAt` (oldest first). Not paginated:
        there are never more than the configurable maximum of administrators (5). The document number
        comes masked and `self` marks the account of the session. Never cacheable
        (`Cache-Control: no-store`).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      responses:
        "200":
          description: The administrators
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdministratorSummary" } }
              example:
                - id: 3f2b8c1e-7a4d-4e6b-9c0a-1d2e3f4a5b6c
                  name: Rosa Quispe
                  documentType: DNI
                  documentNumber: "*****678"
                  email: admin.uno@example.com
                  status: ACTIVE
                  createdAt: "2026-01-15T14:00:00Z"
                  self: true
                - id: 8a7b6c5d-4e3f-4a1b-8c2d-3e4f5a6b7c8d
                  name: null
                  documentType: CE
                  documentNumber: "******321"
                  email: admin.dos@example.com
                  status: INACTIVE
                  createdAt: "2026-03-02T16:30:00Z"
                  self: false
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >-
            Not an administrator (`AUTH_FORBIDDEN`) or the session still has the password change
            pending (`AUTH_PASSWORD_CHANGE_REQUIRED`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createAdministrator
      tags: [admin-administrators]
      summary: An administrator creates another administrator (RF-22, CU-30)
      description: >-
        Creates an active ADMIN account with an unusable random password and emails the new
        administrator a single-use link that expires in 30 minutes to set their own password
        (the same flow as the first administrator, RF-16, SEG-05). No password, code or link is ever
        returned. The creator re-authenticates with `currentPassword`. Administrators are equals,
        without hierarchy (SRS 03). At most 5 administrators may exist (configurable). Every other
        active administrator is notified by email. If the email cannot be sent the account still
        exists, `emailSent` is false and the new administrator can use "forgot password" later.
        Administrators are listed with `listAdministrators` and deactivated or reactivated with
        `deactivateAdministrator` and `reactivateAdministrator` (TAR-127).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdministratorInput" }
      responses:
        "201":
          description: Administrator created
          content: { application/json: { schema: { $ref: "#/components/schemas/AdministratorCreated" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >-
            Not an administrator (`AUTH_FORBIDDEN`), the session still has the password change
            pending (`AUTH_PASSWORD_CHANGE_REQUIRED`), or `currentPassword` is wrong (`AUTH_INVALID_CREDENTIALS` with
            `field: currentPassword`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >-
            `ACCOUNT_DOCUMENT_TAKEN` (the document already belongs to an account, administrator or
            guest, `field: documentNumber`), `ACCOUNT_EMAIL_TAKEN` (the email, case-insensitive, already
            belongs to an account, `field: email`; a guest contact email is not an account email, D-33)
            or `ADMIN_LIMIT_REACHED` (the maximum number of administrators already exists)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/administrators/{id}/deactivate:
    post:
      operationId: deactivateAdministrator
      tags: [admin-administrators]
      summary: Deactivate an administrator (RF-22, TAR-127)
      description: >-
        Deactivates another ADMIN account, effective immediately: its session stops being valid from
        its next request on and it cannot log in until it is reactivated. Its history is kept. The
        caller re-authenticates with `currentPassword`, checked before anything else. An administrator
        cannot deactivate their own account (`ADMIN_SELF_DEACTIVATION`) and the last active
        administrator cannot be deactivated (`LAST_ACTIVE_ADMIN`): the system always keeps at least
        one active ADMIN. Deactivating an inactive administrator is idempotent: 204 and nothing
        changes. When the account changes, every other active administrator is notified by email
        (best-effort). Its own rate limit: 3 requests per minute per session user.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdministratorReauthentication" }
      responses:
        "204": { description: "Administrator deactivated; deactivating an inactive one changes nothing" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >-
            Not an administrator (`AUTH_FORBIDDEN`), the session still has the password change
            pending (`AUTH_PASSWORD_CHANGE_REQUIRED`), or `currentPassword` is wrong (`AUTH_INVALID_CREDENTIALS` with
            `field: currentPassword`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/AdministratorNotFound" }
        "409":
          description: >-
            `ADMIN_SELF_DEACTIVATION` (the target is the account of the session) or `LAST_ACTIVE_ADMIN`
            (deactivating it would leave no active administrator)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdministratorDeactivationConflictError" }
              example:
                code: LAST_ACTIVE_ADMIN
                message: No puedes desactivar al último administrador activo
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/administrators/{id}/reactivate:
    post:
      operationId: reactivateAdministrator
      tags: [admin-administrators]
      summary: Reactivate a previously deactivated administrator (RF-22, TAR-127)
      description: >-
        Reactivates an inactive ADMIN account, effective immediately: it can log in again. The caller
        re-authenticates with `currentPassword`, checked before anything else. Reactivating an
        active administrator is idempotent: 204 and nothing changes. When the account changes,
        every other active administrator is notified by email (best-effort). Its own rate limit:
        3 requests per minute per session user.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdministratorReauthentication" }
      responses:
        "204": { description: "Administrator reactivated; reactivating an active one changes nothing" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >-
            Not an administrator (`AUTH_FORBIDDEN`), the session still has the password change
            pending (`AUTH_PASSWORD_CHANGE_REQUIRED`), or `currentPassword` is wrong (`AUTH_INVALID_CREDENTIALS` with
            `field: currentPassword`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/AdministratorNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── ADMIN: GUESTS (RF-02, RF-13, RF-14, RF-17, CU-02, CU-06, CU-10, CU-11, CU-13) ─────────────────────────
  /admin/guests:
    get:
      operationId: listGuests
      tags: [admin-guests]
      summary: List guests (RF-02)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [CONTRACT, TEMPORARY] }
        - name: status
          in: query
          description: "CURRENT is every guest except the inactive ones (pending activation, onboarding and active)"
          schema: { type: string, enum: [CURRENT, PENDING_ACTIVATION, ONBOARDING, ACTIVE, INACTIVE, ALL], default: CURRENT }
        - name: withoutContract
          in: query
          description: "true: only guests without a contract in force, to choose one when loading a contract (A4.1, TAR-237)"
          schema: { type: boolean }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: One page of the guest list, ordered by document type and number
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PagedGuests" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createGuest
      tags: [admin-guests]
      summary: Register guest with the minimal data and generate their access (RF-02, RF-11, CU-02, CU-09)
      description: >
        The administrator registers only the document type and number and the
        guest type (RN-31); optionally a phone or an email to notify. The guest
        completes everything else in the onboarding (RF-20). The guest is
        created pending activation and the response carries the first access
        (link or temporary password, valid 30 minutes, RN-32). If an email was
        given, the access is also sent to it by email, best-effort: the activation
        link in LINK mode, the temporary password itself in TEMPORARY_PASSWORD mode. If the document is
        already registered nothing is created or modified: the existing guest
        comes back with `alreadyRegistered: true` and a 200 (RN-18).
        The response is never cacheable (`Cache-Control: no-store`) because it
        carries the access in clear.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GuestInput" }
      responses:
        "201":
          description: Guest created pending activation, with its first access
          headers:
            Location: { $ref: "#/components/headers/Location" }
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestCreated" }
        "200":
          description: "The document was already registered: the existing guest, unmodified, with `alreadyRegistered: true` and no `access` (RN-18)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GuestAlreadyRegistered" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "409":
          description: >
            `GUEST_INACTIVE` (the document belongs to an inactive guest, RN-12, RN-18),
            `GUEST_DOCUMENT_TAKEN` (the document belongs to an administrator account, D-34e) or
            `GUEST_EMAIL_TAKEN` (the contact email already belongs to another guest, D-33) or
            `ACCOUNT_EMAIL_TAKEN` (the contact email, case-insensitive, is already the account email of
            another account, administrator or guest; nothing is created, so the guest never ends up
            without an account email in silence, RF-02, D-77)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestInactiveError"
                  - $ref: "#/components/schemas/GuestDocumentTakenError"
                  - $ref: "#/components/schemas/GuestEmailTakenError"
                  - $ref: "#/components/schemas/AccountEmailTakenError"

  /admin/guests/{id}:
    get:
      operationId: getGuestDetail
      tags: [admin-guests]
      summary: Guest 360 detail (CU-06) — personal data, contract, payment history
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Consolidated guest view
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestDetail" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateGuest
      tags: [admin-guests]
      summary: >
        Correct the document (only while pending activation, RN-36). The
        stays are managed through `/admin/guests/{id}/stays` (RN-17). The personal and contact data belong to the
        guest alone and are edited through the guest's own endpoints.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        content: { application/json: { schema: { $ref: "#/components/schemas/GuestUpdateInput" } } }
      responses:
        "200":
          description: Guest updated
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestSummary" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `GUEST_DOCUMENT_LOCKED` (the document can only be corrected while
            the guest is pending activation, RN-36) or `GUEST_DOCUMENT_TAKEN`
            (the corrected document already belongs to another guest or to an administrator account, RN-18, D-34e),
            both with the `field` that caused it; or `CONCURRENT_MODIFICATION`
            (the record changed while it was being edited, see the
            `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [code, message, field]
                    properties:
                      code: { type: string, enum: [GUEST_DOCUMENT_LOCKED] }
                      message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
                      field: { type: string }
                  - type: object
                    required: [code, message, field]
                    properties:
                      code: { type: string, enum: [GUEST_DOCUMENT_TAKEN] }
                      message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
                      field: { type: string }
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/guests/{id}/deactivate:
    post:
      operationId: deactivateGuest
      tags: [admin-guests]
      summary: Soft-deactivate guest — loses login access (RF-13, RN-12, CU-10)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Guest deactivated }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `GUEST_HAS_ACTIVE_CONTRACT` (the guest has a contract in force; debt does not block,
            RN-12) or `CONCURRENT_MODIFICATION` (see the `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestHasActiveContractError"
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/guests/{id}/reactivate:
    post:
      operationId: reactivateGuest
      tags: [admin-guests]
      summary: Reactivate a previously deactivated guest — restores login access and the state it had when deactivated (RF-13, RN-12, CU-28)
      description: >
        Answers the guest as it stands after reactivating: if the access it
        had expired meanwhile the guest comes back pending activation and the
        administrator offers to generate a new access.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: "Guest reactivated, login access restored"
          content: { application/json: { schema: { $ref: "#/components/schemas/NonInactiveGuestSummary" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `GUEST_HAS_PENDING_DEBT` (the guest owes periods; it is reactivated once they are
            paid, RN-25, RN-35) or `CONCURRENT_MODIFICATION` (see the `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestHasPendingDebtError"
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/guests/{id}/stays:
    get:
      operationId: listGuestStays
      tags: [admin-guests]
      summary: Stay history of a temporary guest, newest first (RN-13, CU-06, CU-31)
      description: >
        Every visit keeps its dates and agreed amount; a new stay is a new row of the same guest, never a new guest (RN-13, RN-18).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/After" }
      responses:
        "200":
          description: One page of the stays of the guest
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedStays" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      operationId: createGuestStay
      tags: [admin-guests]
      summary: Register a stay of a temporary guest (RN-13, RN-17, CU-31)
      description: >
        Only for an active temporary guest. The dates may not overlap another stay of the same guest;
        a stay in the future may be registered while the previous one is still running.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StayInput" } } }
      responses:
        "201":
          description: Stay registered
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Stay" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `GUEST_NOT_ACTIVE` (the guest is not active, RN-35), `GUEST_NOT_TEMPORARY` (only temporary
            guests have stays), `STAY_OVERLAP` (the dates cross another stay of the guest) or
            `ENVIRONMENT_OCCUPIED` (the environment is taken in those dates by a contract or another
            stay, or it is inactive; message «El ambiente ya está ocupado en esas fechas», TAR-237)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestNotActiveError"
                  - $ref: "#/components/schemas/GuestNotTemporaryError"
                  - $ref: "#/components/schemas/StayOverlapError"
                  - $ref: "#/components/schemas/EnvironmentOccupiedError"

  /admin/guests/{id}/stays/{stayId}:
    patch:
      operationId: updateGuestStay
      tags: [admin-guests]
      summary: Correct the environment, the dates or the agreed amount of a stay (RN-17, CU-31, TAR-237)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/StayId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/StayUpdateInput" } } }
      responses:
        "200":
          description: Stay updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Stay" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `STAY_OVERLAP` (the new dates cross another stay of the guest), `ENVIRONMENT_OCCUPIED`
            (the environment is taken in the new dates, TAR-237) or `CONCURRENT_MODIFICATION`
            (see the `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/StayOverlapError"
                  - $ref: "#/components/schemas/EnvironmentOccupiedError"
                  - $ref: "#/components/schemas/ConcurrentModificationError"

  /admin/guests/{id}/account-email:
    put:
      operationId: setGuestAccountEmail
      tags: [admin-guests]
      summary: Set or change the account email of a guest, the one password recovery writes to (RF-16, D-76)
      description: >
        The account email is the one `requestPasswordReset` writes to; the
        contact email of the guest (onboarding, profile) stays independent
        (D-33). The administrator sets it when the guest has none or changes
        it. Pending password-reset codes of the account stop working, and if
        the account had another email a notice is sent to it, best-effort.
        The guest must not be inactive.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 200 }
      responses:
        "204": { description: Account email saved (unchanged if it was already that one) }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `ACCOUNT_EMAIL_TAKEN` (the email, case-insensitive, already belongs to another
            account, `field: email`) or `GUEST_INACTIVE` (the guest is inactive, RN-12)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AccountEmailTakenError"
                  - $ref: "#/components/schemas/GuestInactiveError"
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/guests/{id}/access:
    post:
      operationId: generateGuestAccess
      tags: [admin-guests]
      summary: Generate a new access (link or temporary password) for a guest — invalidates the previous one (RF-17, CU-13)
      description: >
        Covers an expired, lost or undelivered access, and a guest without
        email. Any guest that is not inactive qualifies, active ones
        included (an administrator-assisted password recovery). Generating
        a new access revokes the previous one, but the guest's current password
        stays valid until the new link or temporary password is used. The
        response carries the access in clear and is never cacheable
        (`Cache-Control: no-store`).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessMode]
              properties:
                accessMode: { $ref: "#/components/schemas/AccessMode" }
      responses:
        "200":
          description: New access generated; the previous one is revoked
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessGrant" }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `GUEST_INACTIVE` (the guest is inactive, RN-12, RN-18; `guestId`
            lets the administrator reactivate it, CU-28) or
            `CONCURRENT_MODIFICATION` (the guest row changed while the access
            was generated, see the `ConcurrentModification` response)
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    required: [code, message, guestId]
                    properties:
                      code: { type: string, enum: [GUEST_INACTIVE] }
                      message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
                      guestId: { type: string, format: uuid }
                  - $ref: "#/components/schemas/ConcurrentModificationError"
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/guests/{id}/documents:
    get:
      operationId: listGuestDocuments
      tags: [admin-guests]
      summary: Documents the guest uploaded in the onboarding, with a short-lived signed link (RN-37, CU-27)
      description: >
        Only the administrator sees these files. Each `url` is a signed R2
        link that expires 5 minutes after the response; ask again for a new one.
        A document is never deleted or replaced, except on an ARCO request of
        the holder or an upload error (RN-37), only by an administrator and
        with evidence (`deleteGuestDocument`, `replaceGuestDocument`,
        `listGuestDocumentActions`).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Documents of the guest (empty if none was uploaded)
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema: { type: array, maxItems: 5, items: { $ref: "#/components/schemas/GuestDocument" } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/guests/{id}/documents/{documentId}:
    put:
      operationId: replaceGuestDocument
      tags: [admin-guests]
      summary: Replace a document of the guest on an ARCO request or an upload error, with evidence (RN-37)
      description: >
        Only for an ARCO request of the holder or an upload error (RN-37). The
        fields `reason`, `requestedAt`, `requestChannel` and `note` follow the
        rules of `DocumentActionRequest`; an empty multipart field
        (`requestedAt=""`, `requestChannel=""`, `note=""` or whitespace only) counts
        as absent. A file over 5 MB is a 400 `DOCUMENT_INVALID_FILE`, never a 413.
        Order and atomicity: (1) the new object is uploaded to the storage; if
        that fails the answer is 503 `FILE_STORAGE_UNAVAILABLE` and nothing
        changes. (2) In a single transaction the document row is swapped for the
        new one (new `id`) and the evidence entry (`REPLACE`) is inserted; if the
        transaction fails the new object is deleted and nothing changes. (3) After
        the commit the old object is deleted, with a persistent retry; no row
        references it any more, so no new signed URL is issued for it. A signed URL
        already handed out for the old object (`listGuestDocuments`) may keep
        opening it until it expires (at most 5 minutes) or until the old object is
        deleted, whichever comes first.
        Concurrency: of two actions on the same `documentId` (replace or delete)
        only one wins; the row is taken by `(guest_id, id)` with a row lock or a
        conditional delete, and the loser gets 404 `RESOURCE_NOT_FOUND`.
        Never cacheable (`Cache-Control: no-store`).
        Rate limited per session user, checked before the file is read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/DocumentId" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, reason]
              additionalProperties: false
              description: >
                The fields other than `file` follow the rules of `DocumentActionRequest`
                (OpenAPI 3.0 cannot express the conditions). An empty field counts as
                absent. An unknown field is a 400 `DOCUMENT_INVALID_FILE`.
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB, checked by content (RF-15); over 5 MB is a 400 DOCUMENT_INVALID_FILE, not a 413" }
                reason: { $ref: "#/components/schemas/DocumentActionReason" }
                requestedAt: { $ref: "#/components/schemas/DocumentRequestedAt" }
                requestChannel: { $ref: "#/components/schemas/DocumentRequestChannel" }
                note: { $ref: "#/components/schemas/DocumentActionNote" }
      responses:
        "200":
          description: Document replaced; the response is the new document, with a new `id`
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestDocument" } } }
        "400":
          description: >
            `DOCUMENT_INVALID_FILE` (not JPG, PNG or PDF by content, over 5 MB, or an
            unknown multipart field, RF-15) or `VALIDATION_ERROR` with its `field`:
            `reason` missing or unknown; with `ARCO_REQUEST`, `requestedAt` or
            `requestChannel` missing; with `UPLOAD_ERROR`, `requestedAt` or
            `requestChannel` present; `requestedAt` after today (America/Lima); `note`
            over 500 characters
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OriginCheckForbidden" }
        "404": { $ref: "#/components/responses/GuestDocumentNotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /admin/guests/{id}/documents/{documentId}/deletion:
    post:
      operationId: deleteGuestDocument
      tags: [admin-guests]
      summary: Delete a document of the guest on an ARCO request or an upload error, with evidence (RN-37)
      description: >
        Only for an ARCO request of the holder or an upload error (RN-37). A `POST`
        with a JSON body instead of a `DELETE` with a body, because proxies and
        rewrites may drop the body of a `DELETE`. It deletes personal data
        irreversibly and a `POST` can be sent cross-site without a preflight, so
        it is under the same `Origin`/`Sec-Fetch-Site` check as the multipart
        routes (ADR-006, 403), and it only accepts `Content-Type:
        application/json` (anything else is a 415).
        Order and atomicity: (1) the object is deleted from the storage; if that
        fails the answer is 503 `FILE_STORAGE_UNAVAILABLE`, nothing is deleted and
        no evidence is written. An object that is already missing counts as
        deleted, so a retry never gets stuck in 503. (2) If it succeeds, in a
        single transaction the document row is deleted and the evidence entry
        (`DELETE`) is inserted; if that transaction fails the answer is 500 and the
        row stays, so the administrator repeats the action and it completes
        (idempotent: step 1 finds the object missing and goes on to step 2).
        Concurrency: of two actions on the same `documentId` (delete or replace)
        only one wins; the row is taken by `(guest_id, id)` with a row lock or a
        conditional delete. A deletion of a document that is already deleted
        (another deletion won at the same time, or the document was deleted
        before) is answered 204 as well: the document is gone, and the evidence
        keeps only the first deletion (who asked, when and why); the repeated
        one writes nothing. A deletion that loses to a replacement gets 404
        `RESOURCE_NOT_FOUND`, as does a document that never belonged to that guest.
        Never cacheable (`Cache-Control: no-store`).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/DocumentId" }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/DocumentActionRequest" } } }
      responses:
        "204":
          description: >
            File and row deleted, evidence entry recorded; or the document was
            already deleted, and its first evidence entry stays as it was
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
        "400":
          description: >
            `VALIDATION_ERROR` with its `field`: `reason` missing or unknown; with
            `ARCO_REQUEST`, `requestedAt` or `requestChannel` missing; with
            `UPLOAD_ERROR`, `requestedAt` or `requestChannel` present; `requestedAt`
            after today (America/Lima); `note` over 500 characters; or an unknown property
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OriginCheckForbidden" }
        "404": { $ref: "#/components/responses/GuestDocumentNotFound" }
        "415":
          description: "The `Content-Type` is not exactly `application/json` (`UNSUPPORTED_MEDIA_TYPE`)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500":
          description: >
            The object was deleted from the storage but the transaction that deletes
            the row and writes the evidence failed; the row stays. Repeat the action:
            it is idempotent and completes
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /admin/guests/{id}/document-actions:
    get:
      operationId: listGuestDocumentActions
      tags: [admin-guests]
      summary: Evidence of the deletions and replacements of the guest's documents, newest first (RN-37)
      description: >
        Who deleted or replaced which document, when and why. Never carries the
        file name, the storage key or the content.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/After" }
      responses:
        "200":
          description: One page of the document actions of the guest, newest first (empty if there is none)
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedGuestDocumentActions" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/guests/{id}/payments:
    get:
      operationId: listGuestPaymentsByAdmin
      tags: [admin-guests]
      summary: A guest's payment history, admin view (RF-10) — newest first, without the voucher URL (ask `getPayment` for it)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Payment history page for the given guest
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedPayments" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/guests/{id}/account-status:
    get:
      operationId: getGuestAccountStatusByAdmin
      tags: [admin-guests]
      summary: A guest's payment status by period, admin view (RF-06) — the same classification the guest sees in `getGuestAccountStatus`
      description: >-
        Every period of the guest's contracts, current or past, classified as in `getGuestAccountStatus`
        (paid, pending review, unpaid or overdue by payment day plus grace days, RN-10), in the same order.
        A guest without contracts, such as a temporary guest, answers an empty list. Works for active and
        inactive guests.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Status per period of the given guest
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PeriodStatus" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/guests/{id}/payable-periods:
    get:
      operationId: listPayablePeriods
      tags: [admin-payments]
      summary: What the guest can pay or has pending, for a direct payment (A5.1, CU-14, CU-28, RN-27, RN-38)
      description: >-
        For a guest with a contract, every period its contracts charge up to the current month
        (RN-27) that is not paid; for a temporary guest, every stay without an approved payment.
        Each one says its state, what is due after the credit applied (RN-38) and, when a payment
        already exists (pending or rejected), its id: that one is completed in
        `correctPaymentByAdmin`, not with a new direct payment. Works for active and inactive guests
        (CU-28). Oldest first.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Periods or stays that can receive a payment, or that have one pending or rejected
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PayablePeriod" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── ADMIN: CONTRACTS (RF-03, RF-09, CU-03, CU-07, CU-12) ─────────────────────────
  /admin/contracts:
    get:
      operationId: listContracts
      tags: [admin-contracts]
      summary: List contracts with validity status (RF-09, CU-07)
      description: >
        Newest first. The list carries no `fileUrl` (a signed URL per row would sign N files);
        ask `getContract` for the file of one contract. `status` is derived from the dates at
        the time of the request (America/Lima), so EXPIRED needs no job (RN-07).
        With `expiringSoon=true` only the ACTIVE contracts with 30 days or fewer to their end
        date come, ordered by end date, soonest first: A4 «Lo que toca ahora» (how many, whose
        and when) and its «Por vencer» filter take them from here, so the notice is right
        whatever page the list is on (D-27).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [ACTIVE, EXPIRED, TERMINATED] }
        - name: expiringSoon
          in: query
          description: "true: only ACTIVE contracts with 30 days or fewer to the end date, soonest first (implies status=ACTIVE; with another status the answer is 400 `VALIDATION_ERROR`)"
          schema: { type: boolean, default: false }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Contract page
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedContracts" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createContract
      tags: [admin-contracts]
      summary: Upload contract (RF-03, CU-03)
      description: >
        Rate limited per session user, checked before the file is read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, environmentId, guestId, monthlyAmount, paymentDay, graceDays, startDate]
              properties:
                file: { type: string, format: binary, description: "PDF, ≤10MB, checked by content (RF-15)" }
                environmentId: { type: string, format: uuid }
                guestId: { type: string, format: uuid }
                monthlyAmount: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles, greater than 0, at most two decimals" }
                paymentDay: { type: integer, minimum: 1, maximum: 31 }
                graceDays: { type: integer, minimum: 0, maximum: 31 }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date, description: "optional; omitted means an open-ended contract (RN-07); when present it must be after `startDate`" }
      responses:
        "201":
          description: Contract created
          content: { application/json: { schema: { $ref: "#/components/schemas/Contract" } } }
        "400":
          description: >
            `CONTRACT_INVALID_FILE` (not a PDF by content, or over 10 MB, RF-15),
            `CONTRACT_INVALID_DATES` (the end date is not after the start date, RF-03) or
            `VALIDATION_ERROR` (any other field, with its `field`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "The environment (`ENVIRONMENT_NOT_FOUND`) or the guest (`GUEST_NOT_FOUND`) does not exist", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: >
            `GUEST_NOT_ACTIVE` (the guest is not active, RN-35), `GUEST_NOT_CONTRACT` (only a
            guest of type CONTRACT takes a contract, the temporary one has stays, RN-13),
            `GUEST_HAS_PENDING_DEBT` (the guest owes periods, RN-25), `ENVIRONMENT_INACTIVE` (the
            environment is inactive and takes no new contract, RF-01) or `ENVIRONMENT_OCCUPIED`
            (the dates cross another contract not terminated or a stay of the environment, RN-20; a
            renewal that starts after the end of the contract in force is accepted, decided
            2026-10-31). The check order is: guest
            state, guest type, debt, environment state, environment occupancy
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestNotActiveError"
                  - $ref: "#/components/schemas/GuestNotContractError"
                  - $ref: "#/components/schemas/GuestHasPendingDebtError"
                  - $ref: "#/components/schemas/EnvironmentInactiveError"
                  - $ref: "#/components/schemas/EnvironmentOccupiedError"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /admin/contracts/{id}:
    get:
      operationId: getContract
      tags: [admin-contracts]
      summary: Contract detail
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: "Contract detail (never cacheable: it carries a freshly signed file URL, null if the storage could not sign it)"
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Contract" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  /admin/contracts/{id}/terminate:
    post:
      operationId: terminateContract
      tags: [admin-contracts]
      summary: Manually terminate contract (RN-25, CU-12) — the debt does not block it, and the guest keeps owing the periods until they are paid
      description: Idempotent — a contract that is already terminated or expired answers 204 and stays as it is
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Contract terminated }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── ADMIN: PAYMENTS (RF-05, RF-06, CU-04, CU-05, CU-14) ─────────────────────────
  /admin/dashboard:
    get:
      operationId: getAdminDashboard
      tags: [admin-dashboard]
      summary: Administrator home summary (HU-A04, CU-04)
      description: >
        One state per active contract (its period of the current month, America/Lima,
        RN-10) and per temporary guest whose stay covers today: `PAID` counts as up to
        date, `UNDER_REVIEW` as under review, `UNPAID` not yet overdue as pending and
        `OVERDUE` as overdue (RN-06). The vouchers awaiting review come oldest first,
        at most 20, as rows of the review queue (A5): who the guest is and its
        environment, without the amount; `pendingVouchersTotal` gives how many there are.
        `charges` are the rows of «Cobros del mes» (one per active contract and per stay in
        force today) and the other blocks feed «Lo que toca ahora» and «También pendiente»
        (A1, decided 2026-11-01): overdue charges, payments rejected and not yet corrected,
        refunds to register (RN-38, RN-39), contracts expiring in 30 days or less (RN-07) and
        guests that have not activated their account (RN-32).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                type: object
                required: [paymentsUpToDate, paymentsUnderReview, paymentsPending, paymentsOverdue, pendingVouchers, pendingVouchersTotal, charges, overdue, rejected, refunds, expiringContracts, guestsNotActivated]
                properties:
                  paymentsUpToDate: { type: integer, minimum: 0, description: "PAID" }
                  paymentsUnderReview: { type: integer, minimum: 0, description: "UNDER_REVIEW" }
                  paymentsPending: { type: integer, minimum: 0, description: "UNPAID, not yet overdue" }
                  paymentsOverdue: { type: integer, minimum: 0, description: "OVERDUE" }
                  pendingVouchers:
                    type: array
                    maxItems: 20
                    items: { $ref: "#/components/schemas/PaymentQueueItem" }
                  pendingVouchersTotal: { type: integer, minimum: 0 }
                  charges:
                    type: array
                    description: One per active contract (its period of the current month) and per stay in force today; not paginated (a few dozen at most)
                    items: { $ref: "#/components/schemas/DashboardCharge" }
                  overdue: { $ref: "#/components/schemas/DashboardOverdue" }
                  rejected: { $ref: "#/components/schemas/DashboardRejected" }
                  refunds: { $ref: "#/components/schemas/DashboardRefunds" }
                  expiringContracts: { $ref: "#/components/schemas/DashboardExpiringContracts" }
                  guestsNotActivated: { $ref: "#/components/schemas/DashboardGuestsNotActivated" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/finance:
    get:
      operationId: getFinanceSummary
      tags: [admin-dashboard]
      summary: Income vs. expenses balance for a month (RF-18, CU-08)
      description: >-
        Income is the sum of the approved payments attributed to the month, by their verified
        amounts (RN-16), plus the fines of the month (RF-19), minus the refunds dated in the month
        (RN-39, TAR-240); expenses are the expenses of the month (RF-07); `net` is income minus
        expenses. Each part carries how many movements it adds up, for the A6 breakdown. A contract payment belongs to its period; a stay payment belongs to the month
        the stay starts (D-68). Pending, rejected or cancelled payments do not
        count. Guests and environments count whether active or inactive. A month without
        movements answers zeros. Amounts in soles with two decimals.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: month
          in: query
          required: true
          description: Month to summarize, YYYY-MM with a year from 0001 to 9999
          schema: { type: string, pattern: "^(?!0000)\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
      responses:
        "200":
          description: Monthly balance
          content:
            application/json:
              schema:
                type: object
                required: [month, totalIncome, incomeFromPayments, paymentsCount, incomeFromFines, finesCount, refundsTotal, refundsCount, totalExpenses, expensesCount, net]
                properties:
                  month: { type: string, pattern: "^(?!0000)\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
                  totalIncome: { type: number, multipleOf: 0.01, description: "incomeFromPayments + incomeFromFines - refundsTotal (RN-11, RN-39)" }
                  incomeFromPayments: { type: number, multipleOf: 0.01, description: "Approved contract and stay payments attributed to the month, by their verified amounts" }
                  paymentsCount: { type: integer, minimum: 0 }
                  incomeFromFines: { type: number, multipleOf: 0.01, description: "Fines of the month" }
                  finesCount: { type: integer, minimum: 0 }
                  refundsTotal: { type: number, multipleOf: 0.01, minimum: 0, description: "Refunds dated in the month (RN-39)" }
                  refundsCount: { type: integer, minimum: 0 }
                  totalExpenses: { type: number, multipleOf: 0.01 }
                  expensesCount: { type: integer, minimum: 0 }
                  net: { type: number, multipleOf: 0.01, description: "totalIncome - totalExpenses; negative when expenses are higher" }
        "400":
          description: "`VALIDATION_ERROR` with `field: month` when it is missing, not a YYYY-MM month or its year is 0000"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/payments:
    get:
      operationId: listPayments
      tags: [admin-payments]
      summary: Payment review queue (RF-05, CU-05) — oldest first, so the review is first in, first out
      description: >
        Each row carries the guest, the environment (or the temporary mark), the period or the
        stay dates, the last submission date and a summary of the proofs (how many vouchers,
        whether there is cash), and no amount: the administrator compares the declared amounts with
        the proofs in `getPayment` before resolving (RN-16, A5). The queue is ordered by
        `submittedAt`, the last time the payment was sent: a rejected payment that the guest
        corrects and sends again enters the queue with its new date (TAR-239).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Payment queue page
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedPaymentQueue" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createDirectPayment
      tags: [admin-payments]
      summary: >
        Register a direct payment received by the administration (RN-23, CU-14, A5.1) — one or
        more proofs, vouchers or cash without a voucher (RN-22), approved at once with the amounts
        given as verified
      description: >
        Only for a period or a stay that has no payment yet (TAR-239): one that is pending or
        rejected is completed in `correctPaymentByAdmin` (A5.2). The proofs must cover what is due
        (the monthly amount or the agreed amount, minus the credit applied, RN-38); a short payment
        is not registered (400 `VALIDATION_ERROR` with `field: proofs`). What is left over becomes
        credit for the next period, or a refund to register in Finanzas when it is the last period of
        a contract or a stay (RN-38, RN-39). Every proof is recorded as added by the administration.
        A guest that is not active can only pay periods it owes (CU-28, RN-27, RN-35).
        Rate limited per session user, checked before the files are read: over the limit the answer
        is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/DirectPaymentUpload" }
            encoding:
              proofs: { contentType: application/json }
      responses:
        "201":
          description: "Payment registered, status APPROVED immediately (RN-23), with each proof verified at its amount"
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSummary" } } }
        "400":
          description: >
            `VOUCHER_INVALID_FILE` (a file is not JPG, PNG or PDF by content, or is over 5 MB, RF-15;
            `field` names it, e.g. `proofs[1].file`) or `VALIDATION_ERROR` (any other field, with its
            `field`: amount, period, stayId, receivedOn, `proofs` when there are none, more than 5, or
            they do not cover what is due, `proofs[i].amount`, or both or neither of period and stayId)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OriginCheckForbidden" }
        "404": { description: "The guest (`GUEST_NOT_FOUND`) or the stay (`STAY_NOT_FOUND`) does not exist", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: >
            `GUEST_NOT_ACTIVE` (RN-35; a guest that is not active and does not owe that period),
            `PAYMENT_ALREADY_EXISTS_FOR_PERIOD` (an approved payment already exists for the period or
            the stay, RN-02) or `VOUCHER_ALREADY_EXISTS` (a payment is pending or rejected for it:
            complete it in `correctPaymentByAdmin`)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestNotActiveError"
                  - $ref: "#/components/schemas/PaymentAlreadyExistsForPeriodError"
                  - $ref: "#/components/schemas/VoucherAlreadyExistsError"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /admin/payments/{id}:
    get:
      operationId: getPayment
      tags: [admin-payments]
      summary: Payment detail with its proofs to review (A5.2, RN-16, RN-22)
      description: >
        Carries what is being paid (guest, environment, period or stay dates, the amount due after
        the credit applied, and whether it is the last period, which decides between credit and
        refund for what is left over, RN-38) and every proof with its declared and verified amounts
        and who added it. Each voucher's URL is signed when this is requested, expires in 15 minutes
        and forces the download; a cash proof has no file.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: "Payment detail (never cacheable: it carries freshly signed voucher URLs)"
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }
    patch:
      operationId: resolvePayment
      tags: [admin-payments]
      summary: Approve or reject a pending or rejected payment, with the verified amount of each proof (RF-05, CU-05, RN-16)
      description: >
        Resolves a PENDING payment, or a REJECTED one that the administrator corrected
        (`correctPaymentByAdmin`) and decides on at once, without sending it back to the queue
        (decided 2026-10-31, TAR-239). To approve, send the verified amount of every proof: what is
        approved is their sum, which must cover what is due (the monthly amount or the agreed amount
        minus the credit applied); a short payment is rejected with a reason (RN-16). What is left
        over becomes credit or a refund to register (RN-38, RN-39). Rejecting keeps the proofs: the
        guest or the administrator adds or corrects them and the payment is sent again (RN-05).
        The reviewer is recorded and shown in the administrator's views (TAR-230).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [APPROVED, REJECTED] }
                reason: { type: string, maxLength: 500, description: "Required when status=REJECTED, not blank (RN-05); shown to the guest in the app only" }
                proofs:
                  type: array
                  minItems: 1
                  maxItems: 5
                  description: "Required when status=APPROVED: one entry per proof of the payment, with what the administrator verified (RN-16)"
                  items:
                    type: object
                    required: [id, verifiedAmount]
                    additionalProperties: false
                    properties:
                      id: { type: string, format: uuid }
                      verifiedAmount: { type: number, minimum: 0, maximum: 99999999.99, multipleOf: 0.01, description: "In soles; 0 when the proof turned out to be worthless" }
      responses:
        "200":
          description: Payment resolved (without the voucher URLs; ask `getPayment` for them)
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSummary" } } }
        "400":
          description: >
            `PAYMENT_REASON_REQUIRED` (empty reason on rejection, RN-05) or `VALIDATION_ERROR`
            (`field: proofs` when approving without the verified amount of every proof of the
            payment, or when their sum does not cover what is due)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            `PAYMENT_ALREADY_RESOLVED` (the payment is already approved: another process resolved
            it first), `PAYMENT_ALREADY_EXISTS_FOR_PERIOD` (approving it would leave two approved
            payments for the same period or stay) or `PAYMENT_PERIOD_NOT_PAYABLE` (approving a
            payment whose period the contract no longer charges, because it was terminated or expired
            first; the payment can only be rejected with a reason)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PaymentAlreadyResolvedError"
                  - $ref: "#/components/schemas/PaymentAlreadyExistsForPeriodError"
                  - $ref: "#/components/schemas/PaymentPeriodNotPayableError"

  /admin/payments/{id}/proofs:
    put:
      operationId: correctPaymentByAdmin
      tags: [admin-payments]
      summary: Add or correct the proofs of a pending or rejected payment (A5.2, RN-05, RN-15, RN-22)
      description: >
        Replaces the payment's set of proofs: every proof listed with its `id` is kept (its amount
        or method can change, and a new file replaces its voucher), every proof without `id` is
        added by the administration (a voucher of reference or cash), and every existing proof not
        listed is removed. The status does not change: a rejected payment stays REJECTED until
        `resolvePayment` approves or rejects it again (decided 2026-10-31, TAR-239). An approved
        payment cannot be corrected. Rate limited per session user, checked before the files are
        read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ProofsCorrection" }
            encoding:
              proofs: { contentType: application/json }
      responses:
        "200":
          description: Proofs saved; the payment without the voucher URLs (ask `getPayment` for them)
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSummary" } } }
        "400":
          description: >
            `VOUCHER_INVALID_FILE` (with the `field` of the file, RF-15) or `VALIDATION_ERROR`
            (`field: proofs` when there are none or more than 5, or `proofs[i].…`; an `id` that is
            not a proof of this payment is `proofs[i].id`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OriginCheckForbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: "`PAYMENT_NOT_CORRECTABLE` (the payment is already approved) or `CONCURRENT_MODIFICATION` (the payment changed meanwhile, for example the guest sent it again)"
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PaymentNotCorrectableError"
                  - $ref: "#/components/schemas/ConcurrentModificationError"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  # ───────────────────────── ADMIN: EXPENSES (RF-07, CU-08) ─────────────────────────
  /admin/expenses:
    get:
      operationId: listExpenses
      tags: [admin-expenses]
      summary: List monthly expenses (RF-07, CU-08)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: One page of the expense list of the month, oldest first
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedExpenses" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createExpense
      tags: [admin-expenses]
      summary: Register expense (RF-07)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExpenseInput" }
      responses:
        "201":
          description: Expense created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/expenses/{id}:
    patch:
      operationId: updateExpense
      tags: [admin-expenses]
      summary: Edit expense — replaces its category, amount, month and description; no audit restriction (RN-24)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ExpenseInput" } } }
      responses:
        "200":
          description: Expense updated
          content: { application/json: { schema: { $ref: "#/components/schemas/Expense" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/ConcurrentModification" }
    delete:
      operationId: deleteExpense
      tags: [admin-expenses]
      summary: Delete expense — no audit restriction (RN-24)
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Expense deleted for good (RN-24) }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ───────────────────────── ADMIN: FINES (RF-19, RN-30) ─────────────────────────
  /admin/fines:
    get:
      operationId: listFines
      tags: [admin-fines]
      summary: List monthly fines (RF-19)
      description: >
        Fines of the month, of any guest, active or inactive. The list is a plain array with no
        pagination: a month has few fines (RF-19).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$", example: "2026-09" }
      responses:
        "200":
          description: Fines of the month, not paginated
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Fine" } } } }
        "400":
          description: "`VALIDATION_ERROR` with `field: month` (missing, or not a YYYY-MM month)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createFine
      tags: [admin-fines]
      summary: Register fine as income against a guest (RF-19, RN-30)
      description: >
        A fine is direct income of its month (RN-30): it takes no voucher and no approval, and it
        counts in the monthly balance as soon as it is created. It accepts any existing guest,
        active or inactive (a fine can be charged after the guest left). A fine is not edited:
        to change it, delete it and create it again (RN-24).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FineInput" }
      responses:
        "201":
          description: Fine created
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Fine" } } }
        "400":
          description: >
            `VALIDATION_ERROR` with its `field`: `guestId` missing or not a UUID, `amount` missing,
            not greater than 0, over 99999999.99 or with more than two decimals, `month` missing or
            not a YYYY-MM month, or `description` over 500 characters
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { description: "The guest does not exist (`RESOURCE_NOT_FOUND`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /admin/fines/{id}:
    delete:
      operationId: deleteFine
      tags: [admin-fines]
      summary: Delete fine — no audit restriction (RN-24)
      description: >
        Deletes the fine for good (RN-24): it leaves the monthly balance at once. There is no
        edit operation; to correct a fine, delete it and create it again (RF-19, RN-30).
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Fine deleted for good (RN-24) }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "404": { description: "The fine does not exist (`RESOURCE_NOT_FOUND`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  # ───────────────────────── ADMIN: REFUNDS AND CREDITS (RF-24, RN-38, RN-39, TAR-240) ─────────────────────────
  /admin/refunds:
    get:
      operationId: listRefunds
      tags: [admin-refunds]
      summary: Refunds of a month (RF-24, A6 «Devoluciones»)
      description: >
        The refunds Quipu made to guests whose date falls in the month: each one counts in the
        month of its date and is subtracted from that month's income (RN-39, RF-18). Newest first.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: month
          in: query
          required: true
          schema: { type: string, pattern: "^(?!0000)\\d{4}-(0[1-9]|1[0-2])$", example: "2026-10" }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: One page of the refunds of the month
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedRefunds" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      operationId: createRefund
      tags: [admin-refunds]
      summary: Register a refund of Quipu to a guest (RF-24, RN-39, A6.5)
      description: >
        Returns part or all of a guest's pending credit (RN-38): a partial refund is allowed and
        the rest stays pending. The amount cannot exceed the pending credit, also when two refunds
        are registered at the same time (the second one answers 400 with `field: amount`). In the
        MVP a refund is not edited nor deleted (decided 2026-10-29). Who and when are recorded; no
        personal data goes to the logs.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundInput" }
      responses:
        "201":
          description: Refund registered; the month of its date is recalculated
          headers:
            Location: { $ref: "#/components/headers/Location" }
          content: { application/json: { schema: { $ref: "#/components/schemas/Refund" } } }
        "400":
          description: >
            `VALIDATION_ERROR` with its `field`: `guestId`; `amount` (missing, not greater than 0,
            more than two decimals, or more than the pending credit of the guest); `date` (missing or
            in the future); `method` (missing, blank or over 50); `note` (over 500)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "The guest does not exist (`RESOURCE_NOT_FOUND`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /admin/credits:
    get:
      operationId: listPendingCredits
      tags: [admin-refunds]
      summary: Guests with credit to refund (RN-38, A6 and A1 notices)
      description: >
        Credit that has no period left to be used in: the contract ended or is in its last period,
        or it came from a stay of a temporary guest. Oldest first, so A6.5 offers the oldest one.
        Not paginated: there are few at a time.
      security: [{ cookieAuth: [] }]
      x-roles: [ADMIN]
      parameters:
        - name: pending
          in: query
          required: true
          description: Only credit still to refund; `true` is the only value supported for now
          schema: { type: boolean, enum: [true] }
      responses:
        "200":
          description: Pending credits, one per guest
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PendingCredit" } } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── CONTRACT GUEST (RF-04, RF-06, RF-10, CU-16..20) ─────────────────────────
  /guest/account-status:
    get:
      operationId: getGuestAccountStatus
      tags: [guest]
      summary: Payment status by period — up to date/pending/overdue (RF-06, CU-16)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      responses:
        "200":
          description: Status per period
          content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/PeriodStatus" } } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }

  /guest/credit:
    get:
      operationId: getOwnCredit
      tags: [guest]
      summary: Own credit — what is left over to use or to be refunded (RN-38, RN-39, H1)
      description: >
        The credit the guest has now and whether Quipu will refund it (no period left where to
        use it: the contract ended or this is its last period), plus the last refund made. The
        guest cannot ask for a refund while a period remains where to use the credit (decided
        2026-11-01). H1 reads it instead of the payment history.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      responses:
        "200":
          description: Own credit
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestCredit" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }

  /guest/contract:
    get:
      operationId: getOwnContract
      tags: [guest]
      summary: >
        Own contracts, regardless of status — shown read-only even when
        EXPIRED or TERMINATED (CU-18, RN-26). A guest never loses visibility
        of their own contract; only the ability to act on it changes with
        status (e.g. voucher upload requires ACTIVE, see /guest/payments).
      description: >
        `current` is the contract in force today, or the one that starts first if none is running
        yet (RN-07), or the latest one if all ended. `next` is a renewal already loaded that starts
        after `current` ends (RN-20); H2 shows it below as «Tu próximo contrato» (decided
        2026-10-31, TAR-237).
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      responses:
        "200":
          description: "Own contracts (never cacheable: they carry freshly signed file URLs)"
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content:
            application/json:
              schema:
                type: object
                required: [current, next]
                properties:
                  current: { $ref: "#/components/schemas/Contract" }
                  next: { type: object, allOf: [{ $ref: "#/components/schemas/Contract" }], nullable: true }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "404": { description: "No contract was ever associated with this guest" }

  /guest/payments:
    get:
      operationId: listOwnPayments
      tags: [guest]
      summary: Own payment history (RF-10, CU-19, H4) — own record only (RN-09), newest first, without voucher URLs
      description: >
        Each payment with its proofs (kind, method, declared and verified amount, who added it),
        what happened to it (sent, rejected with its reason, approved), what was left over and the
        credit it used (RN-38); the refunds Quipu made to the guest come as items of their own, by
        date (RN-39, label Devuelto). `creditBalance` is the credit the guest has right now. Who
        reviewed a payment is not shown to the guest (TAR-230).
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/After"
      responses:
        "200":
          description: Own payment history page
          content: { application/json: { schema: { $ref: "#/components/schemas/PagedGuestHistory" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
    post:
      operationId: uploadPaymentVoucher
      tags: [guest]
      summary: Send the payment of a month with one or more proofs (RF-04, CU-17, H3, RN-22)
      description: >
        A payment gathers from 1 to 5 proofs: vouchers (a file each) and cash without a voucher
        (RN-22). It is created PENDING. Rate limited per session user, checked before the files are
        read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/GuestPaymentUpload" }
            encoding:
              proofs: { contentType: application/json }
      responses:
        "201":
          description: Payment sent, status PENDING
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSummary" } } }
        "400":
          description: >
            `VOUCHER_INVALID_FILE` (a file is not JPG, PNG or PDF by content, or is over 5 MB, RF-15;
            `field` names it, e.g. `proofs[1].file`) or `VALIDATION_ERROR` (any other field, with its
            `field`: period, `proofs` when there are none or more than 5, `proofs[i].amount`,
            `proofs[i].fileIndex`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >
            `VOUCHER_NO_ACTIVE_CONTRACT` (no active contract, RN-27),
            `AUTH_ONBOARDING_REQUIRED` (the onboarding is not complete, RN-33),
            `AUTH_PASSWORD_CHANGE_REQUIRED` (temporary password not changed,
            RF-12) or `AUTH_FORBIDDEN` (a guest of the other type, RN-09). On the multipart upload, `AUTH_FORBIDDEN` is also returned when the request carries neither an `Origin` header nor `Sec-Fetch-Site: same-origin` (ADR-006)
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [VOUCHER_NO_ACTIVE_CONTRACT, AUTH_ONBOARDING_REQUIRED, AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
                  message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        "409":
          description: >
            `GUEST_NOT_ACTIVE` (RN-35), `PAYMENT_ALREADY_EXISTS_FOR_PERIOD` (the period is already
            approved, RN-02, D-28) or `VOUCHER_ALREADY_EXISTS` (a payment is pending for this period,
            RN-15, or rejected: correct it with `correctOwnPayment`)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestNotActiveError"
                  - $ref: "#/components/schemas/PaymentAlreadyExistsForPeriodError"
                  - $ref: "#/components/schemas/VoucherAlreadyExistsError"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /guest/payments/{id}:
    get:
      operationId: getOwnPayment
      tags: [guest]
      summary: One own payment with its proofs (H3 read-only «Tu pago» and correction, RN-15) — without voucher URLs
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The payment, with its proofs and reviews
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestPayment" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "404": { description: "No payment with that id belongs to this guest (`RESOURCE_NOT_FOUND`, RN-09)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
    put:
      operationId: correctOwnPayment
      tags: [guest]
      summary: Correct a rejected payment and send it again (H3 «Enviar de nuevo», RN-05)
      description: >
        Replaces the payment's set of proofs as `correctPaymentByAdmin` does (listed with `id`:
        kept, with its amount, method or file changed; without `id`: added; not listed: removed)
        and sends it again: the payment goes back to PENDING with a new `submittedAt`. Only a
        REJECTED payment can be corrected; a pending one is read-only (RN-15). Rate limited per
        session user, checked before the files are read.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ProofsCorrection" }
            encoding:
              proofs: { contentType: application/json }
      responses:
        "200":
          description: Payment sent again, status PENDING
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSummary" } } }
        "400":
          description: "`VOUCHER_INVALID_FILE` (with the `field` of the file, RF-15) or `VALIDATION_ERROR` (`proofs` or `proofs[i].…`)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "404": { description: "No payment with that id belongs to this guest (`RESOURCE_NOT_FOUND`, RN-09)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "409":
          description: "`PAYMENT_NOT_CORRECTABLE` (the payment is pending or approved, not rejected) or `GUEST_NOT_ACTIVE` (RN-35)"
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/PaymentNotCorrectableError"
                  - $ref: "#/components/schemas/GuestNotActiveError"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /guest/profile:
    get:
      operationId: getOwnProfile
      tags: [guest]
      summary: Own personal and contact data, the account email and the uploaded documents (H5, RN-17)
      description: >
        What H5 «Mis datos» shows before editing: the document, the name and contact data the
        guest keeps (RN-17), the account email where the password recovery link goes (read-only:
        only the administration changes it, A3.9) and the documents uploaded during the onboarding
        or later (RN-37, `uploadOwnDocument`), without their files (TAR-241). Never cacheable.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      responses:
        "200":
          description: Own profile
          headers:
            Cache-Control: { required: true, schema: { type: string, enum: ["no-store"] } }
          content: { application/json: { schema: { $ref: "#/components/schemas/OwnProfile" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
    patch:
      operationId: updateOwnProfile
      tags: [guest]
      summary: Edit own personal and contact data (CU-20, RN-17)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateInput" }
      responses:
        "200":
          description: Profile updated
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestSummary" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "409": { $ref: "#/components/responses/GuestEmailTaken" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ───────────────────────── GUEST ONBOARDING (RF-14, RF-20, CU-11, CU-24..26) ─────────────────────────
  # Open to a GUEST of either type. Until the onboarding is complete every other
  # /guest/** and /temporary-guest/** operation answers 403 AUTH_ONBOARDING_REQUIRED.
  /guest/documents:
    post:
      operationId: uploadOwnDocument
      tags: [guest]
      summary: Upload one more own document from «Mis datos» after the onboarding (RN-37, TAR-242)
      description: >
        Same rules as the onboarding upload (`uploadOnboardingDocument`): one file per
        call, JPG, PNG or PDF of up to 5 MB checked by real content (SEC-07, RF-15), and
        at most 5 files per guest counting the ones of the onboarding (RN-37). Only for
        a guest whose onboarding is complete (RN-33); before that the guest uses the
        onboarding step. The guest can neither delete nor replace a file: an
        administrator does it on an ARCO request or an upload error, with evidence
        (`deleteGuestDocument`, `replaceGuestDocument`). Under the
        `Origin`/`Sec-Fetch-Site` check of the multipart routes (ADR-006).
        Rate limited per session user, checked before the file is read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType CONTRACT
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB, checked by content (RF-15)" }
      responses:
        "201":
          description: Document stored; it appears in `documents` of the own profile
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestDocumentRef" } } }
        "400":
          description: "`DOCUMENT_INVALID_FILE` (type or size not allowed, RF-15)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >
            `AUTH_ONBOARDING_REQUIRED` (the onboarding is not complete, RN-33),
            `AUTH_PASSWORD_CHANGE_REQUIRED` (temporary password not changed, RF-12) or
            `AUTH_FORBIDDEN` (a TEMPORARY guest, RN-09). On the multipart upload, `AUTH_FORBIDDEN` is also returned when the request carries neither an `Origin` header nor `Sec-Fetch-Site: same-origin` (ADR-006)
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [AUTH_ONBOARDING_REQUIRED, AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
                  message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        "409":
          description: "`DOCUMENT_LIMIT_REACHED` (the guest already has 5 files, RN-37)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /guest/onboarding:
    get:
      operationId: getOnboarding
      tags: [guest-onboarding]
      summary: Onboarding state — next step, saved data and the consent text in force (RF-20, CU-26)
      description: >
        Lets the guest resume where they left off. `nextStep` is the first
        pending step in the order PASSWORD, PERSONAL_DATA, DOCUMENTS, CONSENT
        (RN-33); the documents step is optional (RN-37) but is still offered
        once.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      responses:
        "200":
          description: Current onboarding state
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingState" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }

  /guest/onboarding/personal-data:
    put:
      operationId: savePersonalData
      tags: [guest-onboarding]
      summary: Save the personal data step (RF-20, CU-25)
      description: >
        Requires the password step to be done (RN-33). Only while the guest is
        in onboarding; afterwards the data is edited through the profile endpoint.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/PersonalDataInput" } } }
      responses:
        "200":
          description: Step saved
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingDocumentsPending" } } }
        "400": { $ref: "#/components/responses/ValidationFailed" }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409":
          description: >
            An onboarding-state conflict (`ONBOARDING_STEP_OUT_OF_ORDER`, `ONBOARDING_ALREADY_COMPLETED`,
            see the `OnboardingConflict` response) or `GUEST_EMAIL_TAKEN` (the contact email
            already belongs to another guest, D-33)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/OnboardingConflictError"
                  - $ref: "#/components/schemas/GuestEmailTakenError"

  /guest/onboarding/documents:
    post:
      operationId: uploadOnboardingDocument
      tags: [guest-onboarding]
      summary: Upload one optional document (RN-37, RF-15, CU-25)
      description: >
        One file per call; repeat for more. At most 5 files per guest, each
        JPG, PNG or PDF of up to 5 MB, checked by real content (SEC-07). The
        guest never gets the file back: only the administrator sees it. The
        guest can neither delete nor replace a file. The only exception is an
        ARCO request of the holder or an upload error (RN-37): an administrator
        deletes or replaces the file (`POST
        /admin/guests/{id}/documents/{documentId}/deletion` and `PUT
        /admin/guests/{id}/documents/{documentId}`), and each action leaves an
        evidence entry with who and when (`GET /admin/guests/{id}/document-actions`).
        Rate limited per session user, checked before the file is read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: "JPG/PNG/PDF, ≤5MB, checked by content (RF-15)" }
      responses:
        "201":
          description: Document stored
          content: { application/json: { schema: { $ref: "#/components/schemas/GuestDocumentRef" } } }
        "400":
          description: "`DOCUMENT_INVALID_FILE` (type or size not allowed, RF-15)"
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409":
          description: >
            `DOCUMENT_LIMIT_REACHED` (the guest already has 5 files),
            `ONBOARDING_STEP_OUT_OF_ORDER` or `ONBOARDING_ALREADY_COMPLETED`
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /guest/onboarding/documents/done:
    post:
      operationId: finishDocumentsStep
      tags: [guest-onboarding]
      summary: Mark the documents step as finished, with files or skipped (RN-37, CU-25)
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      responses:
        "200":
          description: Step finished
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingConsentPending" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409": { $ref: "#/components/responses/OnboardingConflict" }

  /guest/onboarding/consent:
    post:
      operationId: acceptConsent
      tags: [guest-onboarding]
      summary: Accept the personal data consent — closes the onboarding (RF-14, RN-14, CU-11)
      description: >
        Records the acceptance with date, time and the text version. With the
        password and personal data steps already done, the guest becomes
        ACTIVE (RN-33, RN-36). Accepting before the personal data step answers
        409 `ONBOARDING_STEP_OUT_OF_ORDER`.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # either guestType
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ConsentInput" } } }
      responses:
        "200":
          description: "Consent recorded and the guest is now ACTIVE: the onboarding is complete"
          content: { application/json: { schema: { $ref: "#/components/schemas/OnboardingCompleted" } } }
        "400":
          description: >
            `CONSENT_NOT_ACCEPTED` (`accepted` is not true) or
            `VALIDATION_ERROR` with `field: consentVersion` if it is not the
            version in force
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/OnboardingAccessDenied" }
        "409": { $ref: "#/components/responses/OnboardingConflict" }

  # ───────────────────────── TEMPORARY GUEST (RF-04, RF-06, CU-21, CU-22) ─────────────────────────
  /temporary-guest/payment-status:
    get:
      operationId: getTemporaryGuestPaymentStatus
      tags: [temporary-guest]
      summary: Payment status of the stay in force (CU-21)
      description: >
        The stay in force today, otherwise the next one, otherwise the last one (the same rule
        as the stay fields of the guest detail).
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType TEMPORARY
      responses:
        "200":
          description: Stay payment status
          content: { application/json: { schema: { $ref: "#/components/schemas/StayPaymentStatus" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403": { $ref: "#/components/responses/GuestAccessDenied" }
        "404": { description: "The guest has no stay yet (`RESOURCE_NOT_FOUND`)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }

  /temporary-guest/payments:
    post:
      operationId: uploadTemporaryVoucher
      tags: [temporary-guest]
      summary: >
        Send the single payment of a stay with one or more proofs (RF-04, CU-22, T2) — a stay has
        one payment (RN-03), which gathers from 1 to 5 proofs, vouchers or cash (RN-22). The guest
        keeps its record across visits and each visit is a stay (RN-13, RN-18,
        `POST /admin/guests/{id}/stays`). The guest does not choose the stay: the payment belongs
        to the stay in force today, otherwise to the next one that has no payment.
      description: >
        Rate limited per session user, checked before the files are read: over the limit the answer is 429 `RATE_LIMITED` with a `Retry-After` header.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType TEMPORARY
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/StayPaymentUpload" }
            encoding:
              proofs: { contentType: application/json }
      responses:
        "201":
          description: Payment sent, status PENDING
          content: { application/json: { schema: { $ref: "#/components/schemas/PaymentSummary" } } }
        "400":
          description: >
            `VOUCHER_INVALID_FILE` (a file is not JPG, PNG or PDF by content, or is over 5 MB, RF-15;
            `field` names it) or `VALIDATION_ERROR` (`proofs` when there are none or more than 5,
            `proofs[i].amount`, `proofs[i].fileIndex`)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
        "401": { $ref: "#/components/responses/NoSession" }
        "403":
          description: >
            `VOUCHER_NO_ACTIVE_STAY` (the guest has no stay in force or coming, CU-22),
            `AUTH_ONBOARDING_REQUIRED` (the onboarding is not complete, RN-33),
            `AUTH_PASSWORD_CHANGE_REQUIRED` (temporary password not changed, RF-12) or
            `AUTH_FORBIDDEN` (a guest of the other type, RN-09). On the multipart upload, `AUTH_FORBIDDEN` is also returned when the request carries neither an `Origin` header nor `Sec-Fetch-Site: same-origin` (ADR-006)
          content:
            application/json:
              schema:
                type: object
                required: [code, message]
                properties:
                  code: { type: string, enum: [VOUCHER_NO_ACTIVE_STAY, AUTH_ONBOARDING_REQUIRED, AUTH_PASSWORD_CHANGE_REQUIRED, AUTH_FORBIDDEN] }
                  message: { type: string, description: "User-facing message, in Spanish, ready to display in the UI" }
        "409":
          description: >
            `GUEST_NOT_ACTIVE` (RN-35), `PAYMENT_ALREADY_EXISTS_FOR_PERIOD` (the stay is already paid,
            RN-03) or `VOUCHER_ALREADY_EXISTS` (a payment is pending for the stay, RN-03, RN-15, or
            rejected: correct it with `correctOwnPaymentTemporary`)
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/GuestNotActiveError"
                  - $ref: "#/components/schemas/PaymentAlreadyExistsForPeriodError"
                  - $ref: "#/components/schemas/VoucherAlreadyExistsError"
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/FileStorageUnavailable" }

  /temporary-guest/payments/{id}:
    get:
      operationId: getOwnPaymentTemporary
      tags: [temporary-guest]
      summary: The payment of a stay with its proofs (T2 read-only «Tu pago» and correction, RN-15) — without voucher URLs
      description: The id comes from `paymentId` in `getTemporaryGuestPaymentStatus`; the temporary guest has no history (H4) yet.
      security: [{ cookieAuth: [] }]
      x-roles: [GUEST] # guestType TEMPORARY
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The payment, with its proofs and reviews
